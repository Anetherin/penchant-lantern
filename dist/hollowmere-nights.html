'use strict';
// Romance arcs live in data/arcs.json (beats, choices and their effects). The final beat makes her Sam's lover (Devoted).
ARCS = noMeta(needData('arcs'));
// Turn a choice's declarative effects into trust/mood/lewd changes, applying the side effects (gold, Sam stats, etc.).
function resolveEff(w, c){
  let e = Object.assign({}, c);
  if(e.if){ const ok = Object.entries(e.if).every(([k,v])=>(w[k]||0) >= v); if(!ok) e = Object.assign({}, e.else||{}); }
  if(e.gold && e.gold < 0 && S.gold < -e.gold) return Object.assign({}, e.cantAfford || {res:"Sam can't afford that right now."});
  if(e.gold) S.gold += e.gold;
  if(e.sam) Object.entries(e.sam).forEach(([k,v])=>samStat(k, v));
  if(e.energy==='full') w.energy = maxEnergy(w); else if(typeof e.energy==='number') w.energy = clamp(w.energy + e.energy, 0, maxEnergy(w));
  if(e.health) w.health = clamp(w.health + e.health);
  if(e.grow) Object.entries(e.grow).forEach(([k,v])=>grow(w, k, v));
  return e;
}
function applyEff(w, e){
  if(e.t) w.trust = clamp(w.trust + e.t);
  if(e.m) moodAdd(w, e.m);
  if(e.l) w.lewd = clamp(w.lewd + e.l);
}
function evArc(w){
  const beats = ARCS[w.key]; if(!beats || !S.workers.includes(w)) return null;
  const i = w.arc||0; if(i>=beats.length) return null;
  let b = beats[i]; const last = i===beats.length-1;
  // bath / walk-in beats once they're well past being embarrassed about it (firsts.json → relaxed)
  if((b.scene==='shower' || b.scene==='walkin') && (w.intim||0) >= FIRSTS.relaxedAt) b = relaxedMishap(w, b);
  let scene = b.scene, cloth = b.cloth;
  if(b.image && scene!=='final') scene = dynScene(`arc_${w.key}_${i}`, b.image) || scene;
  // the last beat crosses her next line with Sam if she's comfortable with it; the picture shows the furthest she'd go
  const nx = last ? firstNext(w) : null, nxOk = nx && tierActs(w, nx).length;
  if(scene==='final'){ const top = nxOk ? nx : (w.intim||0), pool = getActs().filter(a=>actTier(a.id)<=top && samStance(w,a.id)!=='no');
    const act = (pool.find(a=>a.id===w.fav) || pool.sort((x,y)=>y.th-x.th)[0] || {id:'kiss'}).id; scene = 'samact:'+act; cloth = undefined; }
  return {title:`${w.name}: ${b.title} (${i+1}/${beats.length})`, who:w.id, scene, cloth, text:b.text,
    choices: b.choices.map(c=>({label:fillF(c.label, w), fx(){
      const e = resolveEff(w, c);
      applyEff(w, e);
      let res = String(e.res||'').replace(/\{N\}/g, w.name);
      w.arcWk = S.week;
      if(e.hold) return res;
      w.arc = i+1; samGainXP(last?40:15);
      if(w.arc>=4 && has(w,'Oblivious')){ w.traits = w.traits.filter(t=>t!=='Oblivious'); res += `\n\n(Something has changed in the way ${w.name} looks at Sam. Oblivious removed.)`; }
      if(last && nxOk){ w.intim = nx; w.intimWk = S.week; res += `${res?'\n\n':''}♥ ${w.name} and Sam: ${stageName(nx)}.`; addLog(`${w.name} and Sam: ${stageName(nx)}.`); }
      if(last){ w.privateCount++; if(S.sam.first) S.sam.first=false; if(!has(w,'Devoted')) w.traits.push('Devoted'); w.isPartner = true; w.wage = 0; w.contract = 999;
        res = (res?res+'\n\n':'') + `${w.name} is now Sam's lover. (Devoted: never leaves, works without wages, more willing with Sam, and her mood stays up.)`; }
      return res;
    }}))};
}

}

'use strict';
/* =====================================================================
   REGULAR CLIENTS
   Named men who keep coming back to a house, usually for one favorite lady.
   Numbers and all the words are in data/regulars.json; the choice logic is here.
   ===================================================================== */
const REG = needData('regulars');
const regQuirk = r => REG.quirks[r.quirk] || {label:r.quirk, desc:'', tip:1, drama:0};
const regFill = (t, r, w, extra={}) => String(Array.isArray(t) ? pick(t) : t||'').replace(/\{(\w+)\}/g, (m,k)=>{
  const c = Object.assign({regular:r ? r.name : '', name:w ? w.name : 'her', house: r && S.houses.find(h=>h.id===r.house) ? S.houses.find(h=>h.id===r.house).name : 'the house'}, extra);
  return c[k]!==undefined ? String(c[k]) : m;
});
function regName(){
  const used = (S.regulars||[]).map(r=>r.name); let n, t=0;
  do { n = pick(REG.names.first) + ' ' + pick(REG.names.last); t++; } while(used.includes(n) && t<30);
  return n;
}
// this week's visiting regulars for a house
function regularsVisiting(h){ return (S.regulars||[]).filter(r=>r.house===h.id && Math.random() < (REG.visitChance ?? 0.6)); }
// after a regular's visit: loyalty, favorite, and whether he keeps coming
function regAfter(r, w, sat, inc){
  r.visits++; r.spent += inc;
  if(sat >= 60){ r.loyalty = Math.min(10, r.loyalty + 1); if(!r.fav || (r.fav!==w.id && sat>=85 && Math.random()<0.3)) r.fav = w.id; }
  else if(sat < 30){ r.loyalty -= 2; }
  if(r.loyalty <= -4){ S.regulars = S.regulars.filter(x=>x!==r); addLog(`${r.name} has stopped coming to ${S.houses.find(h=>h.id===r.house).name}.`); }
}
// a great visit may turn a client into a regular
function maybeNewRegular(h, best, R){
  S.regulars = S.regulars || [];
  if(!best || S.regulars.filter(r=>r.house===h.id).length >= (REG.maxPerHouse ?? 4) || Math.random() > 0.3) return;
  const r = {id:uid(), name:regName(), cls:best.cls.id, house:h.id, fav:best.w.id, visits:1, loyalty:2, spent:0, quirk:pick(Object.keys(REG.quirks)), since:S.week};
  S.regulars.push(r);
  R.hl.push({wid:best.w.id, text:regFill(REG.events.new, r, best.w), act:null, scene:'companion'});
}

/* ---------- drama ---------- */
function queueRegularDrama(){
  const c = (S.regulars||[]).filter(r=>r.fav && findW(r.fav) && REG.events[r.quirk] && Math.random() < (regQuirk(r).drama||0));
  if(!c.length) return false;
  const r = pick(c); EVQ.push(()=>evRegular(r.id)); return true;
}
function evRegular(rid){
  const r = (S.regulars||[]).find(x=>x.id===rid), w = r && findW(r.fav); if(!r || !w) return null;
  const E = REG.events[r.quirk], h = S.houses.find(x=>x.id===r.house) || houseOf(w);
  const F = (t, extra) => regFill(t, r, w, extra);
  const base = {title:F(E.title), who:w.id, scene:'companion'};
  if(r.quirk==='generous'){
    const g = ri(60,160);
    return Object.assign(base, {text:F(E.text,{gold:fmt(g)}), choices:[
      {label:'Let her keep it', fx(){ moodAdd(w, 8); gainTrust(w,2); return F(E.keep); }},
      {label:'Sell it for the house', fx(){ S.gold += g; moodAdd(w, -3); return F(E.split,{gold:fmt(g)}); }}]});
  }
  if(r.quirk==='jealous'){
    const g = ri(80,200);
    return Object.assign(base, {text:F(E.text), choices:[
      {label:`Take his money (${fmt(g)})`, fx(){ S.gold += g; moodAdd(w, -3); r.loyalty++; return F(E.pay,{gold:fmt(g)}); }},
      {label:'"She isn\'t yours"', fx(){ r.loyalty -= 3; gainTrust(w,2); if(r.loyalty<=-4) S.regulars = S.regulars.filter(x=>x!==r); return F(E.refuse); }},
      {label:'Let her handle it', fx(){ w.energy = clamp(w.energy-10, 0, maxEnergy(w)); r.loyalty++; return F(E.calm); }}]});
  }
  if(r.quirk==='lingering'){
    const g = ri(40,110), sec = S.workers.some(x=>x.house===r.house && x.job==='security');
    const ch = [
      {label:`Bill him for the night (${fmt(g)})`, fx(){ S.gold += g; w.energy = clamp(w.energy-15, 0, maxEnergy(w)); return F(E.charge,{gold:fmt(g)}); }},
      {label:'Let it go', fx(){ S.gold += Math.round(g/3); w.energy = clamp(w.energy-15, 0, maxEnergy(w)); moodAdd(w, -2); r.loyalty++; return F(E.letit); }}];
    if(sec) ch.splice(1, 0, {label:'Have security walk him out', fx(){ r.loyalty -= 2; gainTrust(w,1); return F(E.escort); }});
    return Object.assign(base, {text:F(E.text), choices:ch});
  }
  if(r.quirk==='smitten'){
    const g = Math.round(Math.max(300, (w.wage||20)*30 + w.popularity*8));
    const stays = has(w,'Devoted') || w.isPartner || w.locked || w.trust >= 60 || Math.random() < 0.6;
    return Object.assign(base, {text:F(E.text,{gold:fmt(g)}), choices:[
      {label:'Let her decide', fx(){
        S.regulars = S.regulars.filter(x=>x!==r);
        if(stays){ gainTrust(w,4); moodAdd(w, 4); return F(E.stays); }
        S.gold += g; S.workers = S.workers.filter(x=>x.id!==w.id); return F(E.goes,{gold:fmt(g)}); }},
      {label:'Refuse the offer', fx(){ S.regulars = S.regulars.filter(x=>x!==r); moodAdd(w, -2); return F(E.refuse); }}]});
  }
  if(r.quirk==='talker'){
    return Object.assign(base, {text:F(E.text), choices:[
      {label:'Buy him a drink', fx(){ if(h) h.rep = clamp(h.rep+2); w.popularity = clamp(w.popularity+3); return F(E.thanks); }}]});
  }
  return null;
}

/* ---- js/events/bonds.js ---- */
'use strict';
/* =====================================================================
   BONDS BETWEEN THE LADIES
   S.bonds["idA|idB"] = {v: -100..100, kind?, from?}  (from = mentor's id for one-way kinds)
   Events and shared scenes are defined in data/bonds.json; this file checks requirements and applies effects.
   ===================================================================== */
const BONDS = needData('bonds');
const bkey = (a,b) => [a.id,b.id].sort().join('|');
const bondOf = (a,b) => (S.bonds||{})[bkey(a,b)] || {v:0};
const bondV = (a,b) => bondOf(a,b).v;
function addBond(a, b, n){
  if(!a || !b || a===b || !n) return;
  S.bonds = S.bonds || {}; const k = bkey(a,b), o = S.bonds[k] || (S.bonds[k] = {v:0});
  o.v = Math.max(-100, Math.min(100, o.v + n));
}
// named ladies' starting bonds (characters.json → bonds), applied once both are on the roster
function seedBonds(){
  S.bonds = S.bonds || {};
  S.workers.forEach(a=>{ const seeds = a.key && NAMED[a.key] && NAMED[a.key].bonds; if(!seeds) return;
    Object.entries(seeds).forEach(([ok, s])=>{ const b = S.workers.find(x=>x.key===ok); if(!b) return;
      const k = bkey(a,b); if(S.bonds[k] && S.bonds[k].seeded) return;
      S.bonds[k] = {v: s.v||0, seeded:true}; if(s.kind){ S.bonds[k].kind = s.kind; S.bonds[k].from = a.id; } }); });
}
// weekly drift: housemates warm up (or grate on each other); bonds between ladies in different houses fade slowly
function driftBonds(){
  const D = BONDS.drift, W = S.workers;
  for(let i=0;i<W.length;i++) for(let j=i+1;j<W.length;j++){
    const a = W[i], b = W[j];
    if(a.house===b.house){
      let n = D.sameHouse * Math.random();
      if(BONDS.warm.includes(a.personality) && BONDS.warm.includes(b.personality)) n += D.warmPair;
      if(BONDS.prickly.includes(a.personality) && BONDS.prickly.includes(b.personality)) n += D.pricklyPair;
      addBond(a, b, n);
    } else { const o = bondOf(a,b); if(o.v && !o.kind) addBond(a, b, o.v>0 ? -D.decayDifferentHouse : D.decayDifferentHouse); }
  }
}
// how she's connected to the others, for her sheet
function bondLines(w){
  const out = [];
  S.workers.forEach(o=>{ if(o===w) return; const b = bondOf(w,o);
    if(b.kind && BONDS.kinds[b.kind]){ const K = BONDS.kinds[b.kind]; out.push(`${b.from===w.id ? K.from : K.to} ${o.name}`); }
    const L = BONDS.labels.find(l=>(l.min!==undefined && b.v>=l.min) || (l.max!==undefined && b.v<=l.max));
    if(L && !(b.kind && b.v>=0)) out.push(`${L.label} ${o.name}`);
  });
  return out;
}

/* ---------- requirements ---------- */
function bondReqOK(w, r){
  r = r || {};
  if(r.devoted!==undefined && has(w,'Devoted')!==r.devoted) return false;
  if(r.trustMin!==undefined && w.trust < r.trustMin) return false;
  if(r.lewdMin!==undefined && w.lewd < r.lewdMin) return false;
  if(r.moodMin!==undefined && w.mood < r.moodMin) return false;
  if(r.moodBelow!==undefined && w.mood >= r.moodBelow) return false;
  if(r.lustMin!==undefined && (w.lust||0) < r.lustMin) return false;
  if(r.energyBelow!==undefined && w.energy >= maxEnergy(w)*r.energyBelow) return false;
  if(r.energyAbove!==undefined && w.energy < maxEnergy(w)*r.energyAbove) return false;
  if(r.working && w.job==='rest') return false;
  if(r.intimate && !bestSamAct(w)) return false;
  return r.energyBelow!==undefined || w.energy >= maxEnergy(w)*0.15;
}
function bondPairOK(d, a, b){
  if(a===b) return false;
  if(d.sameHouse!==false && a.house!==b.house) return false;
  const o = bondOf(a,b);
  if(d.bondMin!==undefined && o.v < d.bondMin) return false;
  if(d.bondMax!==undefined && o.v > d.bondMax) return false;
  if(d.dynamic==='lesson' && !getActs().some(x=>canSam(a,x.id) && canSam(b,x.id) && actSkill(a,x.id) > actSkill(b,x.id))) return false;
  if(d.kind){ if(o.kind!==d.kind) return false; if(d.kind==='mentor' && o.from!==a.id) return false; }
  return bondReqOK(a, d.a) && bondReqOK(b, d.b);
}
function bondCandidates(list){
  const out = [];
  list.forEach(d=>S.workers.forEach(a=>S.workers.forEach(b=>{ if(bondPairOK(d,a,b)) out.push({d, a, b}); })));
  return out;
}
// one bond event or shared scene per week at most
function queueBondEvents(){
  const pools = [];
  if(Math.random() < BONDS.sharedChance) pools.push(BONDS.shared);
  if(Math.random() < BONDS.eventChance) pools.push(BONDS.events);
  for(const list of pools){
    const c = bondCandidates(list); if(!c.length) continue;
    const p = weighted(c, x=>x.d.weight||1), id = p.d.id, ai = p.a.id, bi = p.b.id, shared = list===BONDS.shared;
    EVQ.push(()=>evBond(id, ai, bi, shared)); return 1;
  }
  return 0;
}

/* ---------- the event ---------- */
const bondFill = (t, a, b) => String(Array.isArray(t) ? pick(t) : (t||'')).replace(/\{a\}/g, a.name).replace(/\{b\}/g, b.name);
function evBond(id, aId, bId, shared){
  const d = (shared ? BONDS.shared : BONDS.events).find(x=>x.id===id), a = findW(aId), b = findW(bId);
  if(!d || !a || !b || !bondPairOK(d, a, b)) return null;
  const choices = [];
  d.choices.filter(c=>!c.needsGold || S.gold >= c.needsGold).forEach(c=>{
    if(!c.acts) return choices.push({label:bondFill(c.label, a, b), fx(){ return applyBondChoice(c, a, b, d); }});
    // one choice per service both of them will do with Sam
    duoActs(a, b).filter(act=>d.dynamic!=='lesson' || actSkill(a,act) > actSkill(b,act)).forEach(act=>{
      const st = [a,b].filter(w=>samStance(w,act)==='ask').map(w=>w.name.split(' ')[0]);
      choices.push({label: actLabel(act) + (st.length ? ` (a stretch for ${st.join(' and ')})` : ''), fx(){ return applyBondChoice(c, a, b, d, act); }});
    });
  });
  if(!choices.length) return null;
  return {title:bondFill(d.title, a, b), who:a.id, scene:d.scene||'casual', text:bondFill(d.text, a, b), choices};
}
function bondFx(w, e, partner){
  if(!e) return;
  if(e.mood) moodAdd(w, e.mood);
  if(e.trust) { if(e.trust>0) gainTrust(w, e.trust); else w.trust = clamp(w.trust + e.trust); }
  if(e.lewd) w.lewd = clamp(w.lewd + e.lewd);
  if(e.lust) w.lust = clamp((w.lust||0) + e.lust);
  if(e.energy) w.energy = clamp(w.energy + e.energy, 0, maxEnergy(w));
  if(e.popularity) w.popularity = clamp(w.popularity + e.popularity);
  if(e.grow) Object.entries(e.grow).forEach(([k,n])=>grow(w, k, n));
  if(e.lesson && partner){ const act = bestSamAct(partner) || partner.fav; if(act && w.acts[act]) growAct(w, act, 6); }
}
// services both will do with Sam, best-liked first
const duoActs = (a, b) => getActs().filter(x=>canSam(a,x.id) && canSam(b,x.id)).map(x=>x.id)
  .sort((x,y)=>((samStance(a,y)==='yes')+(samStance(b,y)==='yes')) - ((samStance(a,x)==='yes')+(samStance(b,x)==='yes')));
const dynLine = (dyn, act, a, b) => { const D = (BONDS.dynamics||{})[dyn] || {}; return bondFill(String(byAct(D, act) || D._default || ''), a, b).replace(/\{act\}/g, actLabel(act||'')); };
// what the bond dynamic adds on top of the choice's own effects
function dynamicFx(dyn, act, a, b){
  const fn = w => w.name.split(' ')[0];
  if(dyn==='collaborative'){ addBond(a, b, 6); [a,b].forEach(w=>{ if(w.fav===act) moodAdd(w, 4); }); return ''; }
  if(dyn==='competitive'){
    const sa = s100(actSkill(a,act)) + rnd(0,25), sb = s100(actSkill(b,act)) + rnd(0,25), C = BONDS.competition || {};
    if(Math.abs(sa-sb) < 8){ addBond(a, b, 8); return C.close || ''; }
    const [W, L] = sa > sb ? [a,b] : [b,a]; moodAdd(W, 5); moodAdd(L, -3); growAct(L, act, 3); addBond(a, b, -4);
    return String(C.win||'').replace(/\{w\}/g, fn(W)).replace(/\{l\}/g, fn(L));
  }
  if(dyn==='lesson'){ growAct(b, act, 8); growAct(a, act, 2); addBond(a, b, 5); return `(${fn(b)} improves at ${actLabel(act)}.)`; }
  if(dyn==='curious'){ gainTrust(b, 5); if(samStance(b,act)==='ask') lewdUp(b, 3, svcLewdCap(act,'sam') + BAL.lewd.stretchCap); addBond(a, b, 6); return ''; }
  return '';
}
function applyBondChoice(c, a, b, d, chosenAct){
  if(c.roll!==undefined && Math.random() >= c.roll && c.else) c = Object.assign({}, c.else);
  if(c.gold) S.gold += c.gold;
  if(c.rep){ const h = houseOf(a); if(h) h.rep = clamp(h.rep + c.rep); }
  if(c.samEnergy) S.sam.energy = clamp(S.sam.energy + c.samEnergy);
  if(c.sam) Object.entries(c.sam).forEach(([k,n])=>samStat(k, n));
  bondFx(a, c.a, b); bondFx(b, c.b, a);
  if(c.bond) addBond(a, b, c.bond);
  let text = bondFill(c.res, a, b), img = null, ai = null;
  const dyn = chosenAct && d.dynamic;
  if(dyn){ const line = dynLine(dyn, chosenAct, a, b); if(line) text = line + '\n\n' + text; }
  if(c.private && c.private.length){
    const notes = c.private.map(r=>{ const w = r==='a' ? a : b, act = chosenAct || bestSamAct(w); if(!act || !canSam(w,act)) return ''; const t = privateCore(w, act); return `${w.name.split(' ')[0]}: ${t.split('\n\n').pop()}`; }).filter(Boolean);
    if(dyn){ const extra = dynamicFx(dyn, chosenAct, a, b); if(extra) text += '\n\n' + extra; }
    if(notes.length) text += '\n\n' + notes.join('\n');
    samLog(`A night with ${a.name} and ${b.name}`);
    const act = chosenAct || bestSamAct(a);
    if(act){ const sc = chosenAct ? `duo:${act}:${b.id}${dyn?':'+dyn:''}` : 'samact:'+act; img = {wid:a.id, scene:sc};
      if(d.ai) ai = {kind:d.ai, wid:a.id, other:b.id, act, scene:sc, forSam:true, dynamic: dyn ? ((BONDS.dynamics[dyn]||{}).prompt||'') : ''}; }
  } else if(d.ai){ ai = {kind:d.ai, wid:a.id, other:b.id, scene:d.scene||'casual'}; }
  return {text, img, ai};
}

/* ---- js/events/firsts.js ---- */
'use strict';
/* =====================================================================
   FIRSTS WITH SAM
   Each lady crosses lines with Sam at her own pace. Until she has, private time with him only offers services up to
   the tier she's reached (services.json → tier; canSam in js/logic/character.js). Clients are unaffected.
   - pace (fast / normal / slow): trust she needs for each stage and weeks between them (data/firsts.json → paces)
   - path: the stages her firsts reach, in order. [1,2,3] = a kiss, then hands & mouth, then everything;
     [1,3] = a kiss, then everything; [3] = straight to everything in one night.
   - init: once she's ready she makes the move herself instead of waiting for Sam.
   Her comfort (samStance) still has to allow it. A lady who's pent up (lust at max) can push past her own pace.
   Named ladies have their own scenes (firsts.json → characters, keyed by stage); everyone else uses the templates,
   which have variations by personality and traits.
   When it happens: at the end of a good date, from "Take the next step" on her sheet, or at the end of the week.
   ===================================================================== */
const FIRSTS = needData('firsts');
const FIRST_CHARS = noMeta(FIRSTS.characters), FIRST_TPL = noMeta(FIRSTS.templates);
const firstPace = w => FIRSTS.paces[(w.firsts||{}).pace] || FIRSTS.paces.normal;
const stageName = s => (FIRSTS.stages[s]||{}).label || '';
const pentUp = w => restless(w);
// trust she needs for stage s; lewdness eases it (firsts.json → lewdEase), restlessness (pent) eases it further
function firstNeed(w, s, pent){
  const E = FIRSTS.lewdEase || {from:25, per:0, max:0}, ease = clamp(E.per * ((w.lewd||0) - E.from), 0, E.max);
  return firstPace(w).trust[s-1] - (pent ? FIRSTS.pentTrust : 0) - ease;
}
const fillF = (t, w) => String(t||'').replace(/\{name\}/g, w.name).replace(/\{N\}/g, w.name).replace(/\{house\}/g, (S && houseOf(w)) ? houseOf(w).name : 'the house');

// Named ladies: their own pace/path. Guests: rolled once from personality and traits, the same every game (seeded by key).
// Generic ladies: rolled at random (firsts.json → roll).
function firstsProfile(w){
  const C = w.key && FIRST_CHARS[w.key];
  if(C && C.path) return {pace:C.pace||'normal', path:C.path.slice(), init:!!C.init};
  const R = w.key ? seededRng(hashStr(w.key+':firsts')) : Math.random, P = FIRSTS.roll;
  const wpick = o => { const e = Object.entries(o).filter(([,v])=>v>0); let t = e.reduce((a,[,v])=>a+v,0)*R(); for(const [k,v] of e){ t -= v; if(t<=0) return k; } return e[0][0]; };
  const pace = Object.assign({}, P.pace), path = Object.assign({}, P.path);
  const mods = [...(w.traits||[]), w.personality].map(m=>P.mods[m]).filter(Boolean);
  mods.forEach(M=>{ Object.entries(M.pace||{}).forEach(([k,v])=>pace[k]=(pace[k]||0)+v); Object.entries(M.path||{}).forEach(([k,v])=>path[k]=(path[k]||0)+v); });
  if(w.lewd>=60) pace.fast += 1; else if(w.lewd<20) pace.slow += 1;
  if(P.lewdPath && w.lewd >= P.lewdPath.at) Object.entries(P.lewdPath.path).forEach(([k,v])=>path[k]=(path[k]||0)+v);
  const init = P.init + mods.reduce((a,M)=>a+(M.init||0),0);
  return {pace:wpick(pace), path:wpick(path).split(',').map(Number), init: R() < init};
}
function firstNext(w){ return ((w.firsts||{}).path||[1,2,3]).find(s=>s>(w.intim||0)) || null; }
// services at that stage she'd be comfortable with, with Sam
const tierActs = (w, s) => getActs().filter(a=>actTier(a.id)===s && samStance(w,a.id)!=='no');
// Why she isn't ready for her next first (null = she is). pent: she's restless enough to push past her own pace.
function firstBlock(w, pent){
  const s = firstNext(w); if(!s) return 'done';
  if(!tierActs(w,s).length) return 'comfort';
  const need = firstNeed(w, s, pent);
  if(w.trust < need) return 'trust';
  if(w.firstHold && S.week < w.firstHold) return 'wait';
  if(!pent && S.week - (w.intimWk ?? -99) < firstPace(w).gap) return 'wait';
  return null;
}
const firstReady = (w, pent) => !!S && S.workers.includes(w) && !firstBlock(w, pent);
const firstReadyAny = w => firstReady(w) || (pentUp(w) && firstReady(w, true));

// Which scene: hers if she has one for this stage, else a template. A jump (from nothing straight past the first kiss)
// uses the "jump" templates; "pent_" templates are for when she can't wait any longer.
function firstData(w, s, pent){
  const C = w.key && FIRST_CHARS[w.key];
  if(C && C.events){
    if(pent && C.pent && C.pent[s]) return {d:C.pent[s], key:`first_${w.key}_${s}_p`};
    if(C.events[s]) return {d:C.events[s], key:`first_${w.key}_${s}`};
  }
  const base = (w.intim||0)===0 && s>1 ? 'jump' : String(s);
  const list = (pent && FIRST_TPL['pent_'+base]) || FIRST_TPL[base] || FIRST_TPL['1'];
  const fits = list.map((v,i)=>({v,i})).filter(({v})=>(!v.pers || v.pers.includes(w.personality)) && (!v.traits || v.traits.some(t=>has(w,t))) && (!v.race || v.race.includes(w.race)) && (v.lewdMin==null || (w.lewd||0) >= v.lewdMin));
  const p = weighted(fits.length ? fits : list.map((v,i)=>({v,i})), x=>(x.v.pers||x.v.traits||x.v.race||x.v.lewdMin!=null) ? 3 : 1);
  return {d:p.v, key:`first_t_${pent&&FIRST_TPL['pent_'+base]?'pent_':''}${base}_${p.i}`};
}
// the service shown when the line is crossed: hers if the scene names one, else her favorite at that stage, else the gentlest
function firstAct(w, s, d){
  const acts = tierActs(w, s);
  if(d && d.act && acts.some(a=>a.id===d.act)) return d.act;
  return (acts.find(a=>a.id===w.fav) || acts.slice().sort((a,b)=>a.th-b.th)[0] || {}).id;
}
function firstEvent(w, how){
  const s = firstNext(w); if(!s) return null;
  const pent = how==='pent', {d, key} = firstData(w, s, pent), act = firstAct(w, s, d);
  if(!act) return null;
  return {title:`♥ ${fillF(d.title, w)}`, who:w.id, scene: dynScene(key, d.image) || 'casual', text: fillF(d.text, w),
    choices:[
      {label: fillF(d.go || FIRSTS.defaults.go, w), fx(){ return firstCross(w, s, act, d); }},
      {label: fillF(d.wait || FIRSTS.defaults.wait, w), fx(){
        w.firstHold = S.week + FIRSTS.holdWeeks; gainTrust(w, 1);
        if(pent){ moodAdd(w, -4); w.lust = clamp(w.lust - 10); }
        return fillF(d.waitRes || FIRSTS.defaults.waitRes, w); }}]};
}
function firstCross(w, s, act, d){
  const from = w.intim||0;
  w.intim = s; w.intimWk = S.week; w.firstHold = 0; samGainXP(12);
  const text = privateCore(w, act, {lead: fillF(d.goRes, w), first:true});
  const opened = getActs().filter(a=>actTier(a.id)>from && actTier(a.id)<=s).map(a=>a.label);
  addLog(`${w.name} and Sam: ${stageName(s)}.`);
  return {text: text + `\n\n♥ ${w.name} and Sam: ${stageName(s)}. Private time with her can now include ${opened.join(', ')}, as far as she's comfortable.`,
    img:{wid:w.id, scene:'samact:'+act},
    ai:{kind:'encounter', wid:w.id, act, scene:'samact:'+act, forSam:true, situation: d.situation || FIRSTS.stages[s].situation}};
}

// End of the week: at most one. Someone at the end of her rope first, then ladies who make the move, then the rest.
function queueFirsts(){
  const C = FIRSTS.chance, ws = shuffle(S.workers.filter(w=>firstNext(w)));
  let pickd = null;
  for(const w of ws){ if(pentUp(w) && firstReady(w, true) && Math.random() < C.pent){ pickd = [w, 'pent']; break; } }
  if(!pickd) for(const w of ws){ if(firstReady(w) && Math.random() < (w.firsts.init ? C.init : C.week)){ pickd = [w, 'week']; break; } }
  if(!pickd) return 0;
  const id = pickd[0].id, how = pickd[1];
  EVQ.push(()=>{ const x = findW(id); return x && (how==='pent' ? firstReady(x, true) : firstReady(x)) ? firstEvent(x, how) : null; });

}

'use strict';
/* =====================================================================
   CHANCE ENCOUNTERS & RECKLESS NIGHTS
   - Late-night visits: ladies who aren't seeing clients this week (resting or on staff jobs),
     with enough trust, lewdness and lust, may come looking for Sam.
   - Rest visits: when Sam rests, someone may join him.
   - Reckless nights: when lust runs very high, a lewd lady acts on it, either pulling Sam
     away (draining his energy) or freelancing with clients off the books.
   Every outcome is consensual; "reckless" means impulsive, not unwilling.
   ===================================================================== */
const bestSamAct = w => (w.fav && canSam(w,w.fav) && samStance(w,w.fav)==='yes') ? w.fav
  : (getActs().filter(a=>canSam(w,a.id) && samStance(w,a.id)==='yes').sort((a,b)=>b.th-a.th)[0] || getActs().find(a=>canSam(w,a.id)) || {}).id;
// When she comes to Sam because she needs it, it has to be something that gets her off: a service that spends her lust
// (services.json lust < 0). Her favorite or lovers-only one if it qualifies, else the furthest they've gone. null if none yet.
const releases = id => ((actById(id)||{}).lust ?? -1) < 0;
const releaseSamAct = w => { const ok = id => id && canSam(w,id) && samStance(w,id)==='yes' && releases(id);
  if(ok(w.fav)) return w.fav; if(ok(w.lovers)) return w.lovers;
  const a = getActs().filter(x=>ok(x.id)).sort((x,y)=>y.th-x.th)[0] || getActs().find(x=>releases(x.id) && canSam(w,x.id)); return a ? a.id : null; };
const needSamAct = w => releaseSamAct(w) || bestSamAct(w);
const idleForClients = w => JOBS[w.job] && JOBS[w.job].cat!=='escort';
function canVisit(w, trustMin, lewdMin, lustMin){
  return w.trust>=trustMin && w.lewd>=lewdMin && w.lust>=lustMin && w.energy>=maxEnergy(w)*0.3 && !!(restless(w) ? releaseSamAct(w) : bestSamAct(w));
}
// One shared result: run privateCore without spending an action. The encounter's own line leads, then the service's
// own line (flavor.json → private_act) instead of the generic private-time text; the picture switches to the service.
function encounterResult(w, act, intro, kind, situation, drain){
  if(drain) S.sam.energy = Math.max(0, S.sam.energy - drain);
  const text = privateCore(w, act, {lead:intro});   // privateCore spends her lust
  samLog(`${kind==='reckless'?'Swept off by':'A visit from'} ${w.name}`);
  if(wantsAgain(w)){ const id = w.id; EVQ.unshift(()=>evAgain(findW(id))); }
  return {text, img:{wid:w.id, scene:'samact:'+act}, ai:{kind, wid:w.id, act, scene:'samact:'+act, forSam:true, situation}};
}

  };

  return {title:'Contract Renewal', who:w.id, scene:'portrait', text:`${w.name}'s contract is up.${pay}\n\n${mood}`, choices:[
    {label:`Renew at ${fmt(market)}/wk (${fee?fmt(fee)+' bonus':'free'}${oddsTxt(odds)})`, fx: sign(market, fee, odds)},
    {label:`Offer a raise: ${fmt(raised)}/wk (${fee2?fmt(fee2)+' bonus':'free'}${oddsTxt(odds2)})`, fx: sign(raised, fee2, odds2, ()=>{ w.trust=clamp(w.trust+4); moodAdd(w, 4); })},

  if(C.partner && C.partner!=='none'){
    const p = makeNamed(C.partner, true); p.house = og;
    if(C.boon==='devotion'){ p.trust = clamp(p.trust+15); p.lewd = clamp(p.lewd+10); }
    S.workers.push(p); assignStart(p, ['courtesan','bartender','dancer','bath'].includes(NAMED[C.partner].job) ? NAMED[C.partner].job : 'courtesan');
    S.partner = C.partner;
  }
  S.partners = Array.from(new Set([...(S.partners||[]).filter(k=>S.workers.some(w=>w.key===k)), ...(C.partner && C.partner!=='none' ? [C.partner] : [])]));
  const h0 = H(og); if(C.boon==='renown') h0.rep = clamp(h0.rep + 10);
  // Sam, money, debt
  const samOld = Object.fromEntries(Object.keys(BAL.sam.base).map(k=>[k, S.sam[k]||0]));
  if(B.samReset.stats){   // base + perLevel x (lvl-1), then every past life's bonuses again
    const lv = (S.sam.lvl||1) - 1; Object.entries(BAL.sam.base).forEach(([k,v])=>{ S.sam[k] = clamp(v + BAL.sam.perLevel*lv, 0, samCap()); });
  }
  if(B.samReset.appraisal){ S.sam.appraisal = 1; S.sam.appXP = 0; }
  if(B.samReset.stats || B.samReset.appraisal) samPasts().forEach(k=>{ if(PASTS[k]) PASTS[k].fx(S.sam); });
  if(B.samReset.stats) Object.keys(samOld).forEach(k=>{ S.sam[k] = clamp(Math.round(S.sam[k] + (B.carry||0)*Math.max(0, samOld[k] - S.sam[k])), 0, samCap()); });   // he keeps ngplus.carry of what he'd trained
  // Sam's own things (balance.json → samUps): the ones without carry stay behind; he sleeps at his home house again
  S.samUps = Object.fromEntries(Object.entries(S.samUps||{}).filter(([k,v])=>v && (BAL.samUps[k]||{}).carry)); S.samHome = og;
  S.boons = S.boons || []; if(C.boon && !S.boons.includes(C.boon)) S.boons.push(C.boon);
  if(C.boon==='renown') S.rep = clamp(S.rep + 15);
  S.gold = N.purse;
  S.debt = {total:N.debt, remaining:N.debt, carry:0, strikes:0, start:S.week-1};
  S.won = false; S.over = false; S.lastReport = null; EVQ = [];
  S.flags.partnerCD = 3; S.ap = apMax();
  refreshCandidates(C.boon==='recruit' ? 3 : 0, C.boon==='recruit' ? 1.15 : 1);
  inviteFriend(true);   // the first week already shows an old friend
  checkUnlocks(true);
  addLog(`New Game+ (cycle ${S.cycle}): Sam keeps ${HDo.name} and takes on a new debt of ${fmt(N.debt)}.`);
  NGS = null; save(); TAB = 'house'; render();
  modal(`<h2>${esc(HDo.name)}</h2><p class="story">Marguerite Vane slides a fresh contract across the desk. "Paying off one house was impressive, Mr. Takahashi. Let's see you do it again, with a little less sentiment." She almost smiles again. It's starting to worry him.\n\nSam keeps ${esc(HDo.name)}${C.house?`, takes on ${esc(HOUSES[C.house].name)}`:''}${lovers.length?` and ${lovers.map(w=>esc(w.name)).join(', ')}`:''}. Everyone else has gone their own way. The new debt is ${fmt(N.debt)}, due over the next ${BAL.debt.payments*BAL.debt.every} weeks.</p><div class="row"><button class="primary" onclick="closeModal()">Let's go</button></div>`);
}

function readCreator(){
  const g = id => { const e=$('#'+id); return e ? e.value : ''; };
  const race = RACES[g('c_race')] ? g('c_race') : 'human', R = RACES[race];
  const w = CDRAFT ? clone(CDRAFT) : genWorker({race});
  w.race = race; w.sub = race==='beastkin' ? (cleanText(g('c_sub'))||'fox') : '';
  w.age = Math.max(R.age[0], parseInt(g('c_age'))||R.age[0]);
  w.name = cleanText(g('c_name')) || genName(race, w.sub);
  w.design = {build:cleanText(g('c_build')), hairStyle:cleanText(g('c_hairStyle')), hairColor:cleanText(g('c_hairColor')), eyes:cleanText(g('c_eyes')), skin:cleanText(g('c_skin')), features:cleanText(g('c_features'))};
  w.personality = cleanText(g('c_pers')) || pick(PERSONALITIES);
  w.backstory = cleanText(g('c_back'));
  w.style = g('c_style') || w.style; w.favColor = g('c_fcol') || w.favColor;
  w.outfit = g('c_out') || w.outfit; w.customOutfit = cleanText(g('c_outc')); w.outColor = g('c_ocol') || w.outColor;
  if(w.outfit==='custom' && !w.customOutfit) w.customOutfit = 'an elegant dress';
  if(w.outfit!=='custom' && !w.owned.includes(w.outfit)) w.owned.push(w.outfit);
  w.under = g('c_un') || w.under; w.customUnder = cleanText(g('c_unc')); w.underColor = g('c_ucol') || w.underColor;
  if(w.under==='custom' && !w.customUnder) w.customUnder = 'simple lace underwear';
  if(w.under!=='custom' && !w.ownedUnder.includes(w.under)) w.ownedUnder.push(w.under);
  w._mr = 1; w.traits = [...document.querySelectorAll('.c_trait:checked')].map(x=>x.value).concat((w.traits||[]).filter(t=>TRAITS[t]&&TRAITS[t].story));
  STAT_KEYS.forEach(k=>w.stats[k]=clampK(parseInt(g('c_s_'+k))||0));
  TECH_KEYS.forEach(k=>w.tech[k]=clampK(parseInt(g('c_t_'+k))||0));
  w.body = Object.assign({}, bodyOf(w), Object.fromEntries(BODY_KEYS.map(k=>[k, g('c_b_'+k) || bodyOf(w)[k]])));
  w.popularity = clamp(parseInt(g('c_pop'))||0); w.lewd = clamp((parseInt(g('c_lewd'))||0)/10); w.trust = clamp((parseInt(g('c_trust'))||0)/TRUST_SHOW);
  w.fav = g('c_fav')||null; w.dislike = g('c_dis')||null; w.lovers = g('c_lov')||null;
  if(w.dislike && w.dislike===w.fav) w.dislike = null;
  ensureWorker(w);
  getActs().forEach(a=>{ const v=parseInt(g('c_a_'+a.id)); if(!isNaN(v)) w.acts[a.id].skill = clampK(v); });
  w.named = !!($('#c_named')&&$('#c_named').checked); w.keep = w.named;
  return w;
}

}
function dlText(text, name){
  try{ const blob = new Blob([text],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ toast('Download blocked here. Copy the text instead.'); }
}
function importBox(kind){ modal(`<h2>Import ${kind}</h2><textarea id="imp" style="min-height:200px" placeholder="Paste exported text here"></textarea><div class="row"><button class="primary" onclick="doImport('${kind}')">Import</button></div>`); }
function doImport(kind){
  let d; try{ d = JSON.parse($('#imp').value); }catch(e){ return toast('That text isn\'t valid.'); }
  if(kind==='save'){ if(!d || !Array.isArray(d.workers)) return toast('That doesn\'t look like a save.'); S = migrate(d); SETUP=null; save(); }
  else if(kind==='lib'){ if(!Array.isArray(d)) return toast('That doesn\'t look like a library.'); LIB = d; LIB.forEach(w=>{ if(w.stats && Math.max(...Object.values(w.stats))<=100){ scaleWorker(w); } migrateWorker(w); }); saveLib(); }
  else { if(typeof d!=='object' || Array.isArray(d)) return toast('That doesn\'t look like snippets.');
    if(d.snippets){ SET.snippets = d.snippets; SET.clothText = d.clothText||{}; SET.customActs = d.customActs||[]; } else SET.snippets = d; saveSettings(); }
  closeModal(); toast('Imported.'); render();
}
async function exportImages(){
  const imgs = await idbAll('imgs'), thumbs = await idbAll('thumbs');
  const n = Object.keys(imgs).length; if(!n) return toast('No saved images yet.');
  dlText(JSON.stringify({imgs, thumbs}), `hollowmere-images-wk${S.week}.json`);
  toast(`Exported ${n} images.`);
}
function importImages(){
  const inp = $('#upJson'); inp.value='';
  inp.onchange = ()=>{ const f=inp.files[0]; if(!f) return; const fr=new FileReader();
    fr.onload = async ()=>{ let d; try{ d=JSON.parse(fr.result); }catch(e){ return toast('That file isn\'t valid.'); }
      let n=0; for(const [k,v] of Object.entries(d.imgs||{})){ await imgPut(k,v); n++; }
      for(const [k,v] of Object.entries(d.thumbs||{})){ await idbReq('thumbs','readwrite',s=>s.put(v,k)); THUMBS[k]=v; }
      toast(`Imported ${n} images.`); render(); };
    fr.readAsText(f); };
  inp.click();
}
async function cleanImages(){
  const keep = new Set([...S.workers, ...S.candidates, ...LIB].map(w=>w.id).concat(Object.keys(NPCS)));
  const imgs = await idbAll('imgs'); let n=0;
  for(const k of Object.keys(imgs)){ const id=k.split('|')[0]; if(!keep.has(id) && !id.startsWith('n_')){ await imgDel(k); n++; } }
  const th = await idbAll('thumbs');
  for(const k of Object.keys(th)){ if(!keep.has(k) && !k.startsWith('n_')){ await idbReq('thumbs','readwrite',s=>s.delete(k)); delete THUMBS[k]; } }
  toast(`Removed ${n} unused images.`);
}

/* ---- js/main.js ---- */
'use strict';
/* ---------- Intro + init ---------- */
function showIntro(){
  const h = S.houses[0], D = HOUSES[h.id], npc = S.workers.find(w=>w.key===D.npc), p = S.workers.find(w=>w.isPartner);
  modal(`<h2>Welcome to Hollowmere</h2><p class="story">The last thing Sam Takahashi remembers is a truck horn.

Now he's in a world with two moons, holding the deed to ${D.name} in ${D.loc}, and a glowing window only he can see:

[ Unique Skill: Appraisal Lv ${S.sam.appraisal} ]

A woman with a monocle informs him the deed comes with its previous owner's debt: ${fmt(S.debt.remaining)} to the Vane Credit House, payable every four weeks. Three missed payments and everything is theirs.

${npc?npc.name+' is waiting inside. She came with the building and isn\'t sure what to make of him yet.':''}
${p?p.name+' is at his side. '+NAMED[p.key].partnerStory:''}</p>
<p class="muted">How to play: assign jobs in Roster, set prices in Houses, spend Sam's actions each week, then End Week. Ladies only recover energy when they sleep, so mind the beds, and they'll auto-rest when worn out. Each lady's Lewdness decides what she enjoys; her Trust in Sam decides how far past that she'll go when he asks, and some lines she won't cross yet. More houses are for sale in Upgrades.</p>
<div class="row"><button class="primary" onclick="closeModal()">Let's go</button></div>`, {lock:true});
}
async function init(){
  await idbOpen();
  const th = await idbAll('thumbs'); THUMBS = th || {};
  IMGKEYS = new Set((await imgKeysAll()) || []);
  // the saved library was 0-100 before the 0-1000 stats change
  if(store.get('gilded_lantern_libv') !== 13){ LIB.forEach(w=>{ scaleWorker(w); migrateWorker(w); }); saveLib(); store.set('gilded_lantern_libv', 13); }
  else LIB.forEach(migrateWorker);   // idempotent: picks up renamed service ids
  // saved images keyed by an old service id ('act:oral', 'samact:paizuri', ...) move to the new id
  for(const k of [...IMGKEYS]){ const nk = actKeyScene(k); if(nk!==k && !IMGKEYS.has(nk)){ const v = await imgGet(k); if(v){ await imgPut(nk, v); await imgDel(k); } } }
  S = store.get(KEY_SAVE);
  if(!S || !Array.isArray(S.workers)){ S = null; startSetup(); }
  else { migrate(S); save(); render(); }
}
init();
