  const sig = fxSig(w), c = FX_CACHE.get(w);
  if(c && c.sig === sig && c.wk === (typeof S!=='undefined' && S ? S.week : 0)) return c.list;
  const list = [], add = f => { if(f && typeof f==='object') list.push(f); };
  (w.traits||[]).forEach(t => add(TRAITS[t] && TRAITS[t].fx));
  (w.ngPerks||[]).forEach(t => add(TRAITS[t] && TRAITS[t].fx));
  const rb = rebornFx(w); if(rb) add(rb);
  const R = raceOf(w); add(R.fx);
  const sd = w.race==='beastkin' ? subData(w.race, w.sub) : null; if(sd) add(sd.fx);
  const b = bodyOf(w); BODY_KEYS.forEach(k => { const o = bodyOpts(k)[b[k]]; if(o) add(o.fx); });
  if(w.unique) add(w.unique.fx);
  FX_CACHE.set(w, {sig, wk: (typeof S!=='undefined' && S ? S.week : 0), list});
  return list;
}
function fxMul(w, key){ let m = 1; fxList(w).forEach(f => { if(typeof f[key]==='number') m *= f[key]; }); return m; }
function fxAdd(w, key){ let a = 0; fxList(w).forEach(f => { if(typeof f[key]==='number') a += f[key]; }); return a; }
function fxHas(w, key){ return fxList(w).some(f => !!f[key]); }
function fxSub(w, key, id){ let m = 1; fxList(w).forEach(f => { const o = f[key]; if(o && typeof o==='object' && typeof o[id]==='number') m *= o[id]; }); return m; }
function fxArr(w, key){ const out = []; fxList(w).forEach(f => { if(Array.isArray(f[key])) out.push(...f[key]); }); return out; }
const actBanned = (w, id) => fxArr(w, 'actBan').includes(actKey(id));

/* ---------- bodies ---------- */
function rollBody(race){
  const skew = (BODY.raceSkew||{})[race] || {}, out = {};
  BODY_KEYS.forEach(k => { const o = bodyOpts(k), ids = Object.keys(o);
    out[k] = ids.length ? weighted(ids, id => Math.max(0.01, (o[id].weight ?? 1) + (((skew[k]||{})[id]) || 0))) : BODY_DEF[k]; });
  return out;
}
const bodyText = w => { const b = bodyOf(w); return BODY_KEYS.map(k => (bodyOpts(k)[b[k]]||{}).img || '').filter(Boolean).join(', '); };
const bodyLabel = w => { const b = bodyOf(w); return BODY_KEYS.map(k => (bodyOpts(k)[b[k]]||{}).label || b[k]).join(' · '); };

/* ---------- small helpers built on fx ---------- */
// Her lust at which she's restless/reckless: shifted by recklessAt, never for noReckless ladies.
const lustHigh = w => fxHas(w, 'noReckless') ? 1e9 : LUST_HIGH + fxAdd(w, 'recklessAt');
const restless = w => w.lust >= lustHigh(w);
// Mood change scaled by moodDelta (events & work). Returns the applied change.
// A madame in her house softens mood losses (balance.json → jobs.madameMoodLoss).
function madameShield(w){
  if(typeof S==='undefined' || !S || !w.house) return 1;
  return S.workers.some(x=>x!==w && x.house===w.house && x.job==='madame') ? BAL.jobs.madameMoodLoss : 1;
}
function moodAdd(w, n){ const before = w.mood; let d = n * fxMul(w, 'moodDelta'); if(d < 0) d *= madameShield(w); w.mood = clamp(w.mood + d); return w.mood - before; }
// Sleep/rest recovery multiplier from fx, plus the house's amenities (hearth for dwarves).
function restMult(w){
  let m = fxMul(w, 'energyRec');
  const h = (typeof S!=='undefined' && S) ? houseOf(w) : null;
  if(h && w.race==='dwarf' && h.up && h.up.hearth) m *= 1.1;
  return m;
}
// Race gating: the upgrade she needs in her house (races.json → needs). Returns a message, or null if fine.
function raceBlock(w, h){
  const need = raceOf(w).needs; if(!need || !h) return null;
  if(h.up && h.up[need]) return null;
  return `${w.name} needs a ${(UPGRADES[need]||{label:need}).label} in ${h.name}.`;
}
// Small natural stat growth from the job she does (1000-unit points). n is in the same units as grow().
function statXP(w, key, n){
  if(!w.stats || w.stats[key]===undefined) return;
  const v = w.stats[key];
  w.stats[key] = clampK(v + n * fxMul(w, 'statGain') * Math.max(0.05, 1 - v/growDen()));
}

/* ---------- counters (w.counts) and developable traits ---------- */
// countUp(w,'svc'), countUp(w,'svcByAct.oral_give'), countUp(w,'jobWeeks.dancer', 1)
function countUp(w, key, n=1){
  w.counts = w.counts || {};
  const p = String(key).split('.'); let o = w.counts;
  for(let i=0;i<p.length-1;i++){ if(typeof o[p[i]]!=='object' || o[p[i]]===null) o[p[i]] = {}; o = o[p[i]]; }
  o[p[p.length-1]] = (o[p[p.length-1]]||0) + n;
  return o[p[p.length-1]];
}
function countOf(w, key){ let o = w.counts || {}; for(const k of String(key).split('.')){ if(o===undefined || o===null) return 0; o = o[k]; } return typeof o==='number' ? o : 0; }
function earnEligible(w, e){
  if(!e) return false;
  if(e.count) return countOf(w, e.count) >= (e.at||1);
  if(e.stat){ const v = w.stats && w.stats[e.stat]!==undefined ? s100(w.stats[e.stat]) : w.tech && w.tech[e.stat]!==undefined ? s100(w.tech[e.stat]) : (w[e.stat]||0); return v >= (e.at||0); }
  if(e.trust!==undefined) return w.trust >= e.trust;
  if(e.lewd!==undefined) return w.lewd >= e.lewd;
  if(e.job) return countOf(w, 'jobWeeks.'+e.job) >= (e.weeks||1);
  if(e.weeks!==undefined) return countOf(w, 'weeksWorked') >= e.weeks;
  return false;
}
// Weekly check: returns the names of traits she developed this week.
function earnCheck(w){
  const got = [];
  Object.keys(TRAITS).forEach(t => {
    const T = TRAITS[t]; if(!T.earn || has(w, t) || got.includes(t)) return;
    if((T.excl||[]).some(x => has(w, x) || got.includes(x))) return;
    if(!earnEligible(w, T.earn) || Math.random() >= EARN_CHANCE) return;
    (w.traits = w.traits||[]).push(t); got.push(t);
  });
  return got;
}
// Her client reaction to her race (races.json → client): 'like' (enthusiast), 'dislike' (put off) or null.
function raceReact(w, clsId){
  const R = raceOf(w), sd = w.race==='beastkin' ? subData(w.race, w.sub) : null, C = Object.assign({}, R.client||{}, (sd && sd.client) || {});
  const like = ((C.classLike||{})[clsId]) ?? C.like ?? 0, dis = C.dislike ?? 0, r = Math.random();
  return r < like ? 'like' : r < like + dis ? 'dislike' : null;
}

function ageLook(w){
  const R = RACES[w.race]||RACES.human, SD = w.race==='beastkin' ? subData(w.race, w.sub) : null;
  if(((SD && SD.age) || R.age)[1] > 60) return 'appearing to be a mature woman in her mid-twenties';
  if(w.age < 25) return 'in her early-to-mid twenties';
  if(w.age < 30) return 'in her late twenties';
  return 'in her thirties';
}
function raceLook(w){ if(w.race==='beastkin'){ const s=w.sub||'fox', sd = subData('beastkin', s); if(sd && sd.look) return sd.look; return `beastkin woman with ${s} ears and a ${s} tail`; } return (RACES[w.race]||RACES.human).look; }
// keepOn (data/characters.json): something she won't take off until trust reaches keepOn.trust.
// With aside:true it's a garment, so the rest of her clothes get pulled aside at most.
function keepOnRule(w){ const k = w.key && NAMED[w.key] && NAMED[w.key].keepOn; return k && w.trust < (k.trust||90) ? k : null; }
// A bathing scene (scenes.json / dates.json image: "bath": true, or the older "towel": true).
const isBathScene = scene => { const sc = scene && SCENES[sceneBase(scene)]; return !!(sc && (sc.bath || sc.towel)); };
// A swimming scene (dates.json image: "swim": true). Not a bath scene: no towel, stays where it is.
const isSwimScene = scene => { const sc = scene && SCENES[sceneBase(scene)]; return !!(sc && sc.swim); };
function clothText(w, cloth, scene){
  const keep = keepOnRule(w);
  if(keep) return clothTextBase(w, keep.aside && cloth!=='dressed' ? 'aside' : cloth, scene, keep.aside) + ', still keeping ' + keep.item + ' on';
  return clothTextBase(w, cloth, scene);
}
function clothTextBase(w, cloth, scene, noTowel){
  if(cloth==='aside'){
    const T = Object.assign({}, DEFAULT_CLOTH_TEXT, Object.fromEntries(Object.entries(SET.clothText||{}).filter(([k,v])=>v)));
    const ut = underText(w);
    return ((!ut && T.aside_commando) || T.aside || T.partial || T.dressed).replace(/\{outfit\}/g, outfitText(w, scene)).replace(/\{underwear\}/g, ut || 'bare skin, nothing underneath');
  }
  // Swim scenes: with a bath-compatible outfit (swimsuit...) she swims in it instead of clothes or underwear (nude stays nude)
  if(cloth!=='nude' && swimOutfit(w, scene)){
    return outfitText(w, scene);
  }
  // Bath scenes: only bath-compatible outfits (wardrobe.json "bath": true) stay on; otherwise a towel, her underwear, or nothing.
  if(!noTowel && isBathScene(scene)){
    const T0 = Object.assign({}, DEFAULT_CLOTH_TEXT, Object.fromEntries(Object.entries(SET.clothText||{}).filter(([k,v])=>v)));
    if(cloth==='dressed' && getOutfit(w, scene).bath) return outfitText(w, scene);
    if(cloth==='dressed' || cloth==='partial') return cloth==='partial' && getOutfit(w, scene).bath ? (T0.partial||'').replace(/\{outfit\}/g, outfitText(w, scene)).replace(/\{underwear\}/g, underText(w) || 'bare skin, nothing underneath') : 'wrapped only in a white towel';
  }
  const T = Object.assign({}, DEFAULT_CLOTH_TEXT, Object.fromEntries(Object.entries(SET.clothText||{}).filter(([k,v])=>v)));
  let t = T[cloth];
  if(!t && cloth==='nude') t = T.partial;
  const ut = underText(w);
  // Modest ladies during intimate scenes: clothes pulled aside rather than removed
  if(has(w,'Modest') && (cloth==='dressed'||cloth==='partial') && isSvcScene(scene)){
    t = (!ut && T.aside_commando) || T.aside || t;
  }
  return (t||T.dressed).replace(/\{outfit\}/g, outfitText(w, scene)).replace(/\{underwear\}/g, ut || 'bare skin, nothing underneath');
}
function charDesc(w){
  const d = w.design || {};
  return [`beautiful adult ${raceLook(w)}`, ageLook(w), d.build && `${d.build} build`,
    (d.hairStyle||d.hairColor) && `${d.hairStyle||''} ${d.hairColor||''} hair`, d.eyes && `${d.eyes} eyes`,
    d.skin && `${d.skin} skin`, bodyText(w), d.features].filter(Boolean).join(', ');
}
// act_<id> snippets now live on the service (image.extra); older browser edits still win
const getSnippet = k => { const a = k.startsWith('act_') && actById(k.slice(4)); const t = (SET.snippets[k] || (a && a.image && a.image.extra) || SCENE_SNIPPETS[k] || '').trim(); return isTodo(t) ? '' : t; };
function buildPrompt(w, sceneKey, cloth){
  const sc = sceneInfo(sceneKey, w);
  if(w.male) return cleanText([SET.style, 'adult man', w.look, 'upper body portrait, looking at viewer', 'dramatic lighting'].join(', '));
  cloth = cloth || defaultCloth(w, sceneKey);
  const parts = [SET.style];
  if(sc.pov) parts.push("first-person POV, from the viewer's perspective");
  parts.push(charDesc(w), clothText(w, cloth, sceneKey));
  if(sc.sam && !sc.pov) parts.push('together with ' + SAM_DESC);
  if(sc.client) parts.push(sc.client);
  // pose, expression and the service's own wording first, then where it happens
  parts.push(sc.comp, sc.expr);
  if(sc.snip) parts.push(getSnippet(sc.snip));
  if(sc.snip2) parts.push(getSnippet(sc.snip2));
  parts.push(sc.setting);
  if(sc.pov) parts.push(getSnippet('pov'));
  return cleanText(stripTodo(parts.filter(Boolean).join(', ')));
}

const aiTpl = k => (SET.ai.tpl[k] && SET.ai.tpl[k].trim()) || DEFAULT_AI_TPL[k];
function aiCtx(w, x={}){

  const rel = has(w,'Devoted') ? 'lovers' : w.isPartner ? 'close companions, with feelings between them' : w.trust>=60 ? 'close and trusting' : w.trust>=30 ? 'friendly employer and employee' : 'new employer and employee, still a little guarded';
  const o = x.other ? findAny(x.other) : null;
  return {

  };

// How a service ends, for {outcome} (data/ai-prompts.json → outcomes): did she finish, was she satisfied, did a demon feed.
// x.note comes from the week's encounter (frustrated / drained); x.forSam = Sam is her partner.
function aiOutcome(w, x){
  const a = x.act && actById(x.act); if(!a) return '';
  const O = AI_FILE.outcomes || {}, partner = x.forSam ? 'Sam' : 'her client', T = k => (O[k]||'').replace(/\{name\}/g, w.name).replace(/\{partner\}/g, partner);
  const spends = (a.lust ?? -1) < 0, out = [];
  if(w.race==='demon' && a.finish && a.kind!=='receive') out.push(T(x.note==='drained' || (!x.forSam && restless(w)) ? 'drain' : 'feed'));
  else if(a.finish) out.push(T('finish'));
  out.push(T(x.note==='frustrated' ? 'frustrated' : spends ? 'satisfied' : 'wanting'));
  return out.filter(Boolean).join(' ');
}
const fillTpl = (t, c) => t.replace(/\{(\w+)\}/g, (m,k)=> c[k]!==undefined ? String(c[k]) : m);
const YOUTH_TEST = new RegExp(YOUTH_RE.source, 'i');
async function aiWrite(boxId, kind, wid, x={}){
  const box = $('#'+boxId), w = findAny(wid); if(!box || !w) return;
  const plug = getTextPlugin();
  if(!plug){ box.innerHTML = `<div class="muted">AI text isn't connected. In Perchance, add <code>ai = {import:ai-text-plugin}</code> to the lists panel.</div>`; return; }
  const tpl = aiTpl(kind), ctx = aiCtx(w, x);
  ctx.outcome = aiOutcome(w, x);
  if(ctx.outcome && !/\{outcome\}/.test(tpl)) ctx.guidance = [ctx.outcome, ctx.guidance].filter(Boolean).join(' ');
  const instruction = fillTpl(tpl, ctx).replace(/\{outcome\}/g, '').replace(/ {2,}/g, ' ');
  box.innerHTML = `<div class="hl story muted">Writing…</div>`;
  const out = box.firstChild; let full = '';
  try{
    const r = plug({instruction, onChunk:(d)=>{ full = (d && d.fullTextSoFar!==undefined) ? d.fullTextSoFar : full + ((d&&d.textChunk)||''); out.classList.remove('muted'); out.textContent = full; }});
    const res = await r;
    let text = typeof res==='string' ? res : (res && (res.text || res.generatedText || res.output)) || full;
    text = String(text||'').trim();
    if(!text){ out.textContent = 'Nothing came back. Try again.'; return null; }
    if(YOUTH_TEST.test(text)){ out.textContent = 'That generation was discarded (it described someone as young). Try again.'; return null; }
    out.classList.remove('muted'); out.textContent = text;
    return text;
  }catch(e){ out.textContent = 'AI text error: ' + e.message; return null; }
}
async function aiBackstory(boxId, wid){
  const w = findAny(wid); if(!w) return;
  const text = await aiWrite(boxId, 'backstory', wid);
  if(text){ w.backstory = text; if(S) save(); toast('Backstory saved.'); }
}
const aiBtn = (boxId, kind, wid, x) => SET.ai.on ? `<button class="sm" onclick='aiWrite("${boxId}","${kind}","${wid}",${JSON.stringify(x||{}).replace(/'/g,"&#39;")})'>✨ Write it</button>` : '';

'use strict';
function getPlugin(){
  const P = window.PL_PLUGINS; if(P && typeof P.t2i === 'function') return P.t2i;
  try{ if(typeof t2i === 'function') return t2i; }catch(e){}
  if(typeof window.t2i === 'function') return window.t2i;

}
function extractUrl(d){
  if(!d) return null;
  if(typeof d==='string') return /^(data:image|blob:|https?:)/.test(d) ? d : null;
  for(const k of ['dataUrl','dataURL','imageDataUrl','imageUrl','url','src']) if(typeof d[k]==='string' && /^(data:image|blob:|https?:)/.test(d[k])) return d[k];
  for(const k of ['canvas','imageCanvas']) if(d[k] && d[k].toDataURL){ try{ return d[k].toDataURL('image/jpeg',0.92); }catch(e){} }
  if(d.image && d.image.src) return d.image.src;
  return null;
}
function findAny(id){
  if(id==='draft') return CDRAFT;
  if(SETUP && SETUP.prev && SETUP.prev[id]) return SETUP.prev[id];
  if(!S) return null;
  return S.workers.find(w=>w.id===id) || S.candidates.find(w=>w.id===id) || NPCS[id] || LIB.find(w=>w.id===id) || null;
}
// Images are saved per scene + clothing state + what she's wearing, so each outfit gets its own pictures.
function lookKey(w, cloth, scene){
  if(w.male || !w.outfit) return '';

  const u = w.under==='none' ? 'u:none' : `u:${w.under}:${usesColor(getUnder(w))?w.underColor:''}`;
  return cloth==='nude' ? '-' : cloth==='under' ? u : cloth==='partial' ? o+'+'+u : o;
}
const imgKey = (w,scene,cloth) => { const l = lookKey(w,cloth,scene); return `${w.id}|${scene}|${cloth}` + (l?'|'+l:''); };
const legacyKey = (w,scene,cloth) => `${w.id}|${scene}|${cloth}`;
function imgCountFor(w, prefix){ let n=0; const p1 = `${w.id}|`; IMGKEYS.forEach(k=>{ if(k.startsWith(p1) && k.includes('|'+prefix)) n++; }); return n; }

// mode: 'new' = regenerate now; 'auto' = generate if nothing's saved; 'manual' = only on request.

    box.dataset.key = '';
    if(box.dataset.ext){ box.innerHTML = ''; syncImgBtn(boxId); return; }   // an outside button (weekly report) does the showing
    box.innerHTML = `<div class="row imgshow"><button class="sm" onclick="toggleImg(${A0},false)">🖼 Show image</button></div>`; return;
  }
  let key = imgKey(w, scene, cloth);
  box.dataset.key = key; syncImgBtn(boxId);
  const prompt = buildPrompt(w, scene, cloth);
  let saved = mode==='new' ? null : await imgGet(key), legacy = false;
  if(!saved && mode!=='new' && key!==legacyKey(w,scene,cloth)){ saved = await imgGet(legacyKey(w,scene,cloth)); if(saved){ legacy = true; } }
  if(box.dataset.key !== key || !box.isConnected) return;   // the modal moved on while we were loading
  const newKey = key; if(legacy) key = legacyKey(w,scene,cloth);
  box.innerHTML = '';

  const A = `'${boxId}','${id}','${scene}','${cloth}'`;
  if(saved){ wrap.innerHTML = `<img src="${saved}" alt="">` + (legacy?`<div class="imgph small">Saved before outfits were tracked. Regenerate to save one for her current outfit.</div>`:''); }
  else if(mode==='new' || mode==='auto'){ generateInto(wrap, w, newKey, prompt, scene, mode==='new', boxId, id, cloth); }
  else wrap.innerHTML = `<div class="imgph">No saved image for this scene yet.</div>`;
  const bar = document.createElement('div'); bar.className='row';
  bar.innerHTML = `<button class="sm" onclick="toggleImg(${A},true)" title="Hide this image">🙈 Hide</button><button class="sm" onclick="showImg(${A},'new')">🎨 ${saved?'Regenerate':'Generate'}</button>
    <button class="sm" onclick="uploadImg(${A})">⬆ Upload</button>
    ${saved?`<button class="sm" onclick="downloadImg('${key}','${esc(w.name).replace(/'/g,'')}')">⬇ Save file</button>${id!=='draft'?`<button class="sm" onclick="useAvatar('${key}','${id}')">👤 Avatar</button>`:''}<button class="sm" onclick="deleteImg('${key}',${A})">🗑</button>`:''}`;
  box.appendChild(bar);
  const det = document.createElement('details'); det.className='prompt'; if(!getPlugin()&&!saved) det.open = true;
  det.innerHTML = `<summary class="muted">Prompt</summary><textarea readonly>${esc(prompt)}</textarea>`;
  const cb = document.createElement('button'); cb.className='sm'; cb.textContent='Copy prompt';
  cb.onclick = ()=>{ try{ navigator.clipboard.writeText(prompt); toast('Prompt copied.'); }catch(e){ toast('Select the text and copy manually.'); } };

function refreshCandidates(extra=0, quality=1){
  // guests (drifters) wait stayWeeks among the candidates, then move on
  S.candidates = S.candidates.filter(c=>{
    if(c.friend) return true;
    if(c.key && NAMED[c.key] && NAMED[c.key].role==='drifter'){ if(c.stay===undefined) c.stay = 1; c.keep = false; if(--c.stay>0) return true; addLog(`${c.name} moved on.`); return false; }
    return c.keep;
  });
  const bonus = S.houses.reduce((a,h)=>a+(HOUSES[h.id].recruit||0),0);
  for(let i=0;i<3+extra+bonus;i++){ const c = genWorker({quality: quality*(0.85 + S.rep/200 + ((S.sam.lvl||1)-1)*0.02)}); c.signing = signingFor(c); S.candidates.push(c); }
  if(SET.libraryInPool && LIB.length && Math.random()<0.25){
    const src = pick(LIB);
    if(!allNames().includes(src.name)){ const c = ensureWorker(clone(src)); c.id=uid(); c.keep=false; c.signing=signingFor(c); S.candidates.push(c); }
  }
  inviteFriend(false);
  // other partners occasionally turn up looking for work (paid, normal trust, still have their story)
  if(S.flags.partnerCD>0) S.flags.partnerCD--;
  else if(Math.random()<0.35){
    const open = PARTNERS.filter(k=>!isHired(k) && partnerOffered(k));   // NG+ partners only turn up from cycle 2
    if(open.length){ const k = pick(open); const c = makeNamed(k); c.signing = signingFor(c); S.candidates.push(c); S.flags.partnerCD = 5; addLog(`${c.name} is looking for work. (Candidates)`); }
  }

  const seen = S.flags.guestSeen = S.flags.guestSeen || {}, V = GUEST_VISITS;
  const drift = Object.keys(NAMED).filter(k=>NAMED[k].role==='drifter' && !isHired(k) && !(SET.packsOff||{})[NAMED[k].pack]
    && S.week - (seen[k] ?? -999) >= V.stayWeeks + V.cooldownWeeks);
  if(drift.length && Math.random()<V.chance){
    const k = pick(drift), c = makeNamed(k); c.keep = false; c.stay = V.stayWeeks; seen[k] = S.week;
    c.signing = signingFor(c); S.candidates.push(c); addLog(`${c.name} is passing through Hollowmere and looking for work. (Candidates)`);
  }
}

// Payments (balance.json → debt) every `every` weeks, counted from when this debt started (New Game+ restarts the schedule).
// Payment n is total x share_n; shares ramp linearly from 1 to `ramp` and sum to 1. The last one clears whatever remains.
const debtWeek = () => S.week - (S.debt.start||0);
function debtShares(){ const D = BAL.debt, n = D.payments, w = Array.from({length:n}, (_,i)=> n>1 ? 1 + (D.ramp-1)*i/(n-1) : 1), t = w.reduce((a,b)=>a+b, 0); return w.map(x=>x/t); }
function nextDue(){
  const D = BAL.debt, r = debtWeek(), k = Math.max(1, Math.ceil(r/D.every));
  const amount = k>=D.payments ? S.debt.remaining : Math.min(S.debt.remaining, Math.round(S.debt.total*debtShares()[k-1]) + S.debt.carry);
  return {week:k*D.every + (S.debt.start||0), amount, n:k};

function canDo(w, job){
  const J = JOBS[job]; if(!J) return 'Unknown job.';
  const h = houseOf(w);
  if(job!=='rest' && w.health<30) return `${w.name} is too unwell to work.`;
  if(job!=='rest' && w.trust < jobTrust(w,job)) return `${w.name} doesn't trust Sam enough for that yet (needs trust ${tShow(jobTrust(w,job))}).`;
  if(job==='courtesan' && !getActs().some(a=>clientStance(w,a.id,'courtesan')!=='no')) return `${w.name} isn't comfortable with that yet.`;
  if(J.needs && !h.up[J.needs]) return `${h.name} needs a ${UPGRADES[J.needs].label}.`;
  const used = S.workers.filter(x=>x!==w && x.house===h.id && x.job===job).length, max = slotsFor(h, job);
  if(used >= max) return `No open ${J.label} positions in ${h.name} (${max}).`;
  return null;
}
// Jobs that offer a service menu (courtesans, and the must-offer staff roles).
const MENU_JOBS = ['courtesan','dancer','bath'];
// First job she can actually take: her preference, then the open-ended ones.
function safeJob(w, pref){ for(const j of [pref,'courtesan','promoter','attendant','maid']) if(j && JOBS[j] && !canDo(w,j)) return j; return 'rest'; }
function setJob(id, job){
  const w = findW(id); if(!w) return;
  const msg = canDo(w, job);
  if(msg) toast(msg); else {
    w.job = job;
    if(MENU_JOBS.includes(job) && !w.menu.length){ w.menu = getActs().filter(a=>clientStance(w,a.id)==='yes').map(a=>a.id); if(w.menu.length) toast(`${w.name}'s menu: ${w.menu.map(actLabel).join(', ')}. Add "~" favors on her sheet.`); }
    save();
  }
  render(); refreshSheetInfo();
}
function setHouse(id, hid){
  const w = findW(id); if(!w || !H(hid)) return;
  if(w.locked && w.locked!==hid) return toast(`${w.name} belongs to ${H(w.locked).name}.`);
  const rb = raceBlock(w, H(hid)); if(rb) return toast(rb);
  w.house = hid; if(canDo(w, w.job)) w.job = 'rest';
  note(`${w.name} moves to ${H(hid).name}.`); save(); render(); refreshSheetInfo();
}
function toggleMenu(id, act, on){
  const w = findW(id); if(!w) return;
  if(on && !canClient(w,act)) return toast(`${w.name} won't do that with clients.`);
  w.menu = w.menu.filter(x=>x!==act); if(on) w.menu.push(act);
  save(); refreshSheetInfo();
}

// Repeating the same kind of build gets pricier (count across all houses): permits, contractors who've noticed you have money...
// Bedrooms, staff quarters and extra beds also scale with how many this house already has.
function upgradeCost(h, k){
  const infl = 1 + 0.12*((S.builtBy||{})[k]||0);
  if(k==='room') return Math.round((250 + h.rooms*220) * infl);
  if(k==='quarters') return Math.round((200 + (h.quarters||0)*160) * infl);
  if(k==='roomTier') return Math.round((ROOM_TIER_COST[h.tier]||0) * infl);
  if(k==='beds') return Math.round((BEDS[Math.min(3,(h.beds||0)+1)].cost) * Math.max(1,bedsFor(h)/2) * infl);
  if(k==='extraBed') return Math.round((80 + (h.extraBeds||0)*60 + (BEDS[h.beds||0].cost||0)*0.25) * infl);
  if(k==='annex') return Math.round(2500 * infl);
  return Math.round((UPGRADES[k]?UPGRADES[k].cost:0) * infl);
}
function buyUpgrade(k){
  const h = curH(); let cost = upgradeCost(h,k), need = 0;
  if(k==='room'||k==='quarters') need = 1;
  else if(k==='roomTier'){ if(h.tier>=3) return toast('Bedrooms are already opulent.'); }
  else if(k==='beds'){ if((h.beds||0)>=3) return toast('Already the best beds in town.'); }
  else if(k==='annex'){ if(h.annex) return toast('Already expanded.'); }
  else if(k==='extraBed'){ if((h.extraBeds||0) >= maxExtraBeds(h)) return toast('The staff rooms are full. Add staff quarters first.'); }
  else { if(h.up[k]) return; need = AMENITY_SIZE[k]||1; }
  if(need && roomsUsed(h) + need > houseSize(h)) return toast(`${h.name} is out of space (${roomsUsed(h)}/${houseSize(h)} rooms used).`);
  if(S.gold < cost) return toast('Not enough gold.');
  S.gold -= cost; h.spent = (h.spent||0) + cost; S.built = (S.built||0) + 1; S.builtBy = S.builtBy||{}; S.builtBy[k] = (S.builtBy[k]||0) + 1;
  if(k==='room'){ h.rooms++; note(`${h.name}: a new bedroom is ready. (${h.rooms} total)`); }
  else if(k==='quarters'){ h.quarters=(h.quarters||0)+1; note(`${h.name}: new staff quarters. Beds for ${bedsFor(h)}.`); }
  else if(k==='roomTier'){ h.tier++; note(`${h.name}: bedrooms refurbished to ${ROOM_NAMES[h.tier]}.`); }
  else if(k==='beds'){ h.beds=(h.beds||0)+1; note(`${h.name}: staff now sleep on ${BEDS[h.beds].label.toLowerCase()}.`); }
  else if(k==='extraBed'){ h.extraBeds=(h.extraBeds||0)+1; note(`${h.name}: another bed squeezed into the staff rooms. Beds for ${bedsFor(h)}.`); }
  else if(k==='annex'){ h.annex=true; note(`${h.name}: annex built (+3 rooms of space).`); }
  else { h.up[k]=true; note(`${h.name}: ${UPGRADES[k].label} built.`); }
  save(); render();
  if(k==='bar' && !S.flags.hilde && !isHired('hilde')){ S.flags.hilde=true; EVQ.push(evHilde); runQueue(); }
}
// Demolish (balance.json → demolish): knocks down a built amenity, or the last bedroom / staff quarters above the house's starting count.
// Costs share x the item's base price (no inflation), lowers h.spent by that base price (improvement value for NG+), never refunds.
function demolishInfo(h, k){
  const D = HOUSES[h.id], share = BAL.demolish.share;
  let base = 0, why = '';
  if(k==='room'){ base = 250 + (h.rooms-1)*220; if(h.rooms <= D.rooms) why = 'These are the rooms the house started with.'; }
  else if(k==='quarters'){ base = 200 + ((h.quarters||0)-1)*160; if((h.quarters||0) <= D.quarters) why = 'These are the quarters the house started with.'; }
  else if(UPGRADES[k]){
    base = UPGRADES[k].cost; const jobOf = {bath:'bath', stage:'dancer', bar:'bartender'}[k];
    if(!h.up[k]) why = 'Not built.';
    else if((D.up||{})[k]) why = `${UPGRADES[k].label} came with the house.`;
    else if(jobOf && S.workers.some(w=>w.house===h.id && w.job===jobOf)) why = `Someone still works as ${JOBS[jobOf].label} here. Move her to another job first.`;
  } else why = 'Unknown.';
  return {base, cost:Math.round(base*share), ok:!why, why};
}
function demolish(k){
  const h = curH(), I = demolishInfo(h, k);
  if(!I.ok) return toast(I.why);
  if(S.gold < I.cost) return toast('Not enough gold to pay the demolition crew.');
  const label = k==='room' ? 'a bedroom' : k==='quarters' ? 'a set of staff quarters' : `the ${UPGRADES[k].label}`;
  if(!confirm(`Demolish ${label} in ${h.name}? It costs ${fmt(I.cost)} and nothing is refunded.`)) return;
  S.gold -= I.cost; h.spent = Math.max(0, (h.spent||0) - I.base);
  if(k==='room') h.rooms--;
  else if(k==='quarters'){ h.quarters--; h.extraBeds = Math.min(h.extraBeds||0, maxExtraBeds(h)); }
  else delete h.up[k];
  note(`${h.name}: ${label} demolished (${fmt(I.cost)}).`);
  save(); render();
}
function buyHouse(id){
  const D = HOUSES[id]; if(!D || H(id) || !houseOffered(id)) return;
  if(D.premium && ((S.sam.lvl||1) < D.level || S.rep < D.renown)) return toast(`${D.name} won't sell to Sam yet. Needs Sam level ${D.level} and renown ${D.renown}.`);
  if(S.gold < D.cost) return toast('Not enough gold.');
  if(!confirm(`Buy ${D.name} for ${fmt(D.cost)}?`)) return;
  S.gold -= D.cost; S.houses.push(makeHouse(id)); S.cur = id;
  note(`You now own ${D.name}!`);
  if(!isHired(D.npc)){
    const n = makeNamed(D.npc); n.house = id; n.locked = id; n.contract = 999; n.job = safeJob(n, NAMED[D.npc].job); if(MENU_JOBS.includes(n.job)) n.menu = getActs().filter(a=>clientStance(n,a.id)==='yes').map(a=>a.id);
    S.workers.push(n); checkUnlocks(true);
    EVQ.push(()=>({title:`${D.name}`, who:n.id, scene:'portrait', text:`${n.name} is waiting at the door when Sam arrives with the deed.\n\n${n.backstory}\n\nShe comes with the place.`, choices:[{label:'Welcome aboard', fx(){ n.trust=clamp(n.trust+5); return ''; }}]}));
  }
  save(); render(); runQueue();
}
// Pay the whole remaining debt at once: same win flow as the last regular payment (checkEnd sets S.won).
function payOffDebt(){
  const r = S.debt.remaining; if(r<=0 || S.gold < r) return toast('Not enough gold to pay it off.');
  S.gold -= r; S.debt.remaining = 0; S.debt.carry = 0;
  note(`Paid off the debt in full (${fmt(r)}).`); save(); render(); checkEnd();
}
function payExtra(){
  const el = $('#payamt'); const amt = Math.floor(+((el&&el.value)||0));
  if(amt<=0) return toast('Enter an amount.');
  if(amt > S.gold) return toast('You don\'t have that much.');
  const a = Math.min(amt, S.debt.remaining);
  S.gold -= a; S.debt.remaining -= a; S.debt.carry = Math.max(0, S.debt.carry - a);
  note(`Paid ${fmt(a)} toward the debt.`); save(); render(); checkEnd();
}

function buyOutfit(id, k){

function equipOutfit(id, k){

function buyUnder(id, k){

// Gift a piece from the house wardrobe to a lady: it becomes hers, and it counts as a gift (mood, trust, Greedy / gift-likers).
function giftHouseItem(id, kind, k){
  const w=findW(id); if(!w) return;
  const list = kind==='under' ? S.houseUnder : S.houseWardrobe, o = kind==='under' ? UNDER[k] : WARDROBE[k];

function setColor(id, which, c){ const w=findW(id); if(!w) return; w[which]=c; save(); openWardrobe(id); }
function openWardrobe(id){

  modal(`<h2>${esc(w.name)}'s Wardrobe</h2>

'use strict';
/* =====================================================================
   SAM
   ===================================================================== */
function useAP(cost=20){
  if(S.over) return false;
  if(S.ap<=0){ toast('Sam is out of actions this week. End the week to continue.'); return false; }
  if(S.sam.energy<cost){ toast('Sam is too tired. Have him rest, or end the week.'); return false; }
  S.ap--; S.sam.energy -= cost; samGainXP(6); return true;
}
const samLog = t => S.samWeek.acts.push(t);
const xpNeed = l => 60 + 40*l;
const apMax = () => 3 + ((S.sam.lvl||1)>=5?1:0) + ((S.sam.lvl||1)>=10?1:0) + (hasBoon('ap')?1:0);
function samGainXP(n){
  S.sam.xp = (S.sam.xp||0) + n; S.sam.lvl = S.sam.lvl || 1;
  while(S.sam.xp >= xpNeed(S.sam.lvl)){
    S.sam.xp -= xpNeed(S.sam.lvl); S.sam.lvl++;
    ['charm','business','strength','technique'].forEach(k=>samStat(k,BAL.sam.perLevel));
    if(S.sam.lvl===5 || S.sam.lvl===10) S.ap++;
    note(`⬆ Sam reached level ${S.sam.lvl}! All stats +${BAL.sam.perLevel}${S.sam.lvl===5||S.sam.lvl===10?', and +1 action per week':''}.`);
  }
}
function samXP(n){
  S.sam.appXP += n;
  const lv = S.sam.appXP>=200 ? 3 : S.sam.appXP>=60 ? 2 : 1;
  if(lv > S.sam.appraisal){ S.sam.appraisal = lv; note(`[Appraisal] leveled up to Lv ${lv}! ${lv===2?'Exact stats and lewdness are now visible.':'Hidden traits and everyone\'s preferences are now visible.'}`); }
}
function samStat(k,n){ S.sam[k] = clamp(S.sam[k]+n, 0, samCap()); }
function samWork(kind){
  if(!useAP(25)) return;
  let title='', text='';
  if(kind==='bartend'){
    const inc = Math.round((30 + S.sam.charm*1.2 + rnd(0,25)) * (hasPast('bartender')?1.5:1) * (1 + samUpFx('bartend'))); S.gold += inc; S.samWeek.income += inc; samStat('charm',2);
    title='Behind the Bar'; text=`Sam pours drinks all evening. ${hasPast('bartender')?'Old habits: he flips a bottle and the whole room cheers.':'He over-explains the menu to everyone, but people seem to find it charming.'}\n\n+${fmt(inc)} · Charm +2`;
    samLog(`Tended bar (+${fmt(inc)})`);
  } else if(kind==='security'){
    const sec = Math.round((20 + S.sam.strength) * (1 + samUpFx('watch'))); S.samWeek.security += sec; samStat('strength',2);
    title='On Watch'; text=`Sam makes the rounds of every house, looking as stern as a thin man in a hoodie can. Nobody starts anything, which he decides to count as a win.\n\nSecurity bonus +${sec} in all houses this week · Strength +2`;
    samLog('Stood watch');
  } else if(kind==='books'){
    S.samWeek.books = true; samStat('business',2);
    title='Doing the Books'; text=`Sam rebuilds the ledger as a spreadsheet, by hand, on parchment. The staff watch with a mix of horror and respect.\n\nUpkeep reduced by ${Math.round((0.1 + S.sam.business*0.003 + samUpFx('books'))*100)}% this week · Business +2`;
    samLog('Did the books');
  } else if(kind==='rounds'){
    // a word with everyone: small trust and mood for every lady in every house (balance.json → sam.rounds*)
    const B = BAL.sam, rm = 1 + samUpFx('rounds'), rt = B.roundsTrust * rm, rmood = B.roundsMood * rm; let n = 0;
    S.workers.forEach(w=>{ gainTrust(w, rt); moodAdd(w, rmood); n++; });
    samStat('charm',1);
    title='Making the Rounds'; text=`Sam walks through every house with a notebook, asking everyone how they're doing and actually writing down the answers. A leaky window gets fixed, someone's favorite tea gets restocked, and the whole staff notices that he noticed.\n\n${n} ladies: trust ${tDelta(rt)}, mood +${Math.round(rmood*10)/10} · Charm +1`;
    samLog('Made the rounds');
  } else if(kind==='lesson'){
    // a class for everyone whose job uses this skill (individual training is for services only)
    const sel = $('#lessonSel'), k = sel ? sel.value : 'service', map = {service:'charm', dance:'charm', bar:'charm', combat:'strength', manage:'business'}, sk = map[k] || 'charm';
    const who = S.workers.filter(w=>w.job!=='rest' && (JOBS[w.job]||{}).skill===k);
    const g = (4 + S.sam[sk]/25) * BAL.sam.lessonShare * (hasPast('massage') ? 1.15 : 1) * (1 + samUpFx('lesson'));
    who.forEach(w=>{ grow(w, k, g * pm(w,'train')); statXP(w, ({service:'charm', dance:'agility', bar:'charm', combat:'strength', manage:'refinement'})[k] || 'charm', g*0.4); minorTrust(w); });
    samStat(sk,2);
    title=`A Lesson: ${TECH_LABEL[k]}`; text = who.length ? `Sam gathers ${who.map(w=>w.name).join(', ')} for an afternoon on ${TECH_LABEL[k].toLowerCase()}. He brought handouts. Nobody asked for handouts.\n\n${TECH_LABEL[k]} +${Math.round(g*SKL)} each · Sam's ${cap(sk)} +2` : `Sam sets out chairs and handouts for a lesson on ${TECH_LABEL[k].toLowerCase()}. Nobody whose job uses it turns up. He reads the handout to himself.`;
    samLog(`Taught a lesson in ${TECH_LABEL[k]}${who.length?` (${who.length})`:''}`);
  } else if(kind==='scout'){
    const nc = 2 + Math.round(samUpFx('scout')); addCandidates(nc, 1.1 + S.sam.business/400); samXP(10); samStat('charm',1);
    title='Scouting'; text=`Sam walks the market and the guild hall, quietly using [Appraisal] on anyone who looks like they might want a job.\n\n+${nc} candidates · Appraisal XP +10`;
    samLog('Scouted for recruits');
  }
  save(); render(); showResult(title, text);
}
function samRest(){
  if(S.ap<=0) return toast('No actions left this week.');

  if(!confirm(`End things with ${w.name}? She'll stay on at the house, but it will hurt.`)) return;
  const B = BAL.breakup, starter = w.key && (S.partners||[S.partner]).includes(w.key);
  w.traits = w.traits.filter(t=>t!=='Devoted'); w.exLover = true; w.rekindleWk = S.week; w.neglect = 0;
  moodAdd(w, B.mood); w.trust = clamp(w.trust + B.trust * (has(w,'Loyal') ? 0.5 : 1));
  if(!starter){ w.isPartner = false; w.wage = wageFor(w); w.contract = 12; }
  samLog(`Ended things with ${w.name}`); save(); render(); closeModal();
  showResult(`${w.name}`, flavor('breakup', w) + `\n\n(No longer Devoted. Mood ${B.mood}, trust ${tDelta(B.trust*(has(w,'Loyal')?0.5:1))}.${starter?' She still works without wages.':` She now draws a wage of ${fmt(w.wage)}/wk on a 12-week contract.`})`, w.id, 'portrait', {kind:'breakup', wid:w.id});
}
function rekindle(id){
  const w = findW(id), B = BAL.breakup; if(!w || !w.exLover || has(w,'Devoted')) return;
  if(w.trust < B.rekindleTrust) return toast(`${w.name} isn't ready for that conversation.`);
  if(S.week - (w.rekindleWk||0) < B.rekindleCooldown) return toast(`Too soon. Give her a few more weeks.`);
  if(!useAP(15)) return;
  w.rekindleWk = S.week;
  const yes = Math.random() < B.rekindleChance + (w.mood-50)/200 + (has(w,'Romantic')?0.1:0);
  if(yes){ w.traits.push('Devoted'); w.exLover = false; w.isPartner = true; w.wage = 0; w.contract = 999; moodAdd(w, 10); }
  else moodAdd(w, -3);
  samLog(`Asked ${w.name} to try again`); save(); render(); closeModal();
  showResult(yes ? `${w.name}, Again` : `Not Yet`, flavor(yes ? 'rekindle_yes' : 'rekindle_no', w) + (yes ? `\n\n(${w.name} is Sam's lover again.)` : ''), w.id, yes ? 'sam_date' : 'portrait');
}

/* Sam's home (which house he sleeps in, his bed, home upgrades) and house feasts. Tuning: balance.json → samHome, samUps, feast. */
const samHouse = () => H(S.samHome) || H(homeHouse()) || S.houses[0];
const hasSamUp = k => !!(S.samUps && S.samUps[k]);
function samUpFx(key){
  let n = 0, any = false;
  Object.keys(BAL.samUps||{}).forEach(k=>{ if(!hasSamUp(k)) return; const v = (BAL.samUps[k].fx||{})[key]; if(typeof v==='number') n += v; else if(v) any = true; });
  return key==='reach' ? any : n;
}
const samReach = () => !!(samUpFx('reach') || hasBoon('clone'));
const nearSam = w => samReach() || !!(w && w.house === samHouse().id);
const hasSuite = h => !!(h && h.up && h.up.suite);
const samBedTier = () => Math.min(3, (samHouse().beds||0) + (hasSuite(samHouse()) ? 1 : 0) + (samUpFx('bedTier')||0));
const samBedRest = () => BEDS[samBedTier()].rest;
const samRecover = base => Math.round(base * samBedRest() / BAL.samHome.ref);
function moveSam(id){
  const h = H(id); if(!h) return;
  if(h.id === samHouse().id) return;
  if(S.flags.samMovedWk === S.week) return toast('Sam already moved this week.');
  S.samHome = h.id; S.flags.samMovedWk = S.week;
  toast(`Sam now sleeps at ${h.name}.`); save(); render();
}
function buySamUp(k){
  const u = BAL.samUps[k]; if(!u || hasSamUp(k)) return;
  if(S.gold < u.cost) return toast('Not enough gold.');
  S.gold -= u.cost; S.samUps = S.samUps || {}; S.samUps[k] = true;
  toast(`Bought: ${u.label}`); save(); render();
}
function throwFeast(tierId){
  const h = curH(), t = BAL.feast.tiers.find(x=>x.id===tierId); if(!h || !t) return;
  if(h.feastWk === S.week) return toast('This house already feasted this week.');
  const L = S.workers.filter(w=>w.house===h.id);
  if(!L.length) return toast('Nobody lives here to feast.');
  const total = t.cost * L.length;
  if(S.gold < total) return toast('Not enough gold.');
  S.gold -= total; h.feastWk = S.week;
  let tr = 0;
  L.forEach(w=>{ tr += gainTrust(w, t.trust); moodAdd(w, t.mood); });
  addLog(`🍽️ ${t.label} at ${h.name} (${L.length} ladies, −${fmt(total)})`);
  samLog(`Threw a ${t.label.toLowerCase()} at ${h.name}`);
  save(); render();
  showResult(t.label, `${t.text.replace(/\{house\}/g, h.name)}\n\n${L.length} ladies · Trust ${tDelta(tr/L.length)} each · Mood +${t.mood} each · −${fmt(total)}`);
}

function pickClass(h){
  const p = h.price, cw = HOUSES[h.id].cls;
  const ws = [Math.max(3,50-10*p), 30 + (S.flags.guild?8:0), 15+4*p, Math.max(1, 5+4*p+h.rep/10)];
  return weighted(CLASSES, c=>{ const i=CLASSES.indexOf(c); return ws[i]*cw[i]*(c.id==='merchant'&&h.bonus&&h.bonus.merchant||1); });
}
const SVC = BAL.svc;
// How the report phrases a service (services.json → ask): what HE asks for ("asked for oral") vs what SHE does when she's the one offering ("she offered to go down on him").
const askClient = id => { const a = actById(id); return (a && a.ask && a.ask.client) || 'for ' + actLabel(id).toLowerCase(); };
const askLady = id => { const a = actById(id); return (a && a.ask && a.ask.lady) || 'offered ' + actLabel(id).toLowerCase(); };
function pickWant(cls, w){ return weighted(getActs().filter(a=>!w || !actBanned(w, a.id)), a=>(cls.id==='commoner' ? 90/a.price : cls.id==='noble' ? a.price/80 : 1) * (a.want ?? 1) * ((cls.wants||{})[a.id] ?? 1)).id; }
function qualityOf(w, act){
  if(!act) return (s100(w.tech.service)*0.5 + s100(w.stats.beauty)*0.25 + s100(w.stats.charm)*0.25)/100;
  return (s100(actSkill(w,act))*0.5 + s100(w.stats.beauty)*0.3 + s100(w.stats.charm)*0.2)/100 * fxSub(w,'actQuality',act);
}
// How good this client is at it: 0.3-1.4 around his class's mean (data/economy.json → classes.tech). Regulars keep theirs.
function clientTech(cls, reg){
  if(reg && reg.tech !== undefined) return reg.tech;
  const t = clamp((cls.tech ?? 0.85) + (Math.random()+Math.random()-1)*0.55, SVC.techMin, SVC.techMax);
  if(reg) reg.tech = t;
  return t;
}
// Her expression during a service: bored / professional / into it / lost in it; personality can shift it (personalities.json → expr).
const EXPR_LABEL = {bored:'bored', professional:'professional', into:'into it', lost:'lost in it', flustered:'flustered', smug:'smug'};
function exprFor(w, act, reluct){
  const k = restless(w) ? 'lost' : (reluct || w.lust < LUST_LOW) ? 'bored' : (w.lust >= LUST_EAGER || w.fav===act) ? 'into' : 'professional';
  const m = (PERS[w.personality]||{}).expr;
  return (m && m[k]) || k;
}
function hlText(w, e){
  const who = e.reg ? `${e.reg}, one of the regulars,` : pick(CLIENT_DESC[e.cls]), N = w.name;
  const more = e.more ? ` She was in the mood for more afterward, and ${askLady(e.more)}.` : '';
  if(e.self) return `${flavor('self_prop', w)}${e.act ? ` She ${askLady(e.act)}, and he didn't need asking twice.${more}` : ' This time he politely passed.'}`;
  if(e.where){
    const where = PROP_WHERE[e.where];
    if(e.act) return `${cap(who)} propositioned ${N} ${where}, asking ${askClient(e.want)}. ${e.outcome==='alt' ? `She ${askLady(e.act)} instead, and he took it.` : 'She thought about it for exactly one second, then took his hand and led him upstairs.'}${more}`;
    return `${cap(who)} propositioned ${N} ${where}, asking ${askClient(e.want)}. She turned him down${(w.offDuty==='off' && !(JOBS[w.job]||{}).must)?' (she isn\'t open to propositions)':''}.`;
  }
  if(!e.want) return `${cap(who)} spent the evening with ${N} in the lounge: wine, conversation, and a lot of laughing. ${flavor('client_company', w)}`;
  if(e.outcome==='yes') return `${cap(who)} came for ${N} and asked ${askClient(e.act)}. ${(actById(e.act)&&actById(e.act).report&&actById(e.act).report.length) ? pick(actById(e.act).report) : flavor('client_yes', w)}${e.encore ? ' ' + flavor('encore', w) : ''}${more}`;
  if(e.outcome==='alt') return `${cap(who)} asked ${N} ${askClient(e.want)}. She said no to that, but ${askLady(e.act)} instead, and he happily took it.${more}`;
  return `${cap(who)} asked ${N} ${askClient(e.want)}. She politely declined, and he settled for her company over a bottle of wine.`;
}
// One service for one client, from her side: mood, lust (per service, technique, favorites), demon feeding, expression.
// o = {tech, reluct, pr, h}. Returns {note, expr, frustrated, fed, drained}.
function serveAct(w, a, o){
  const B = BAL.lust, act = a.id, pr = o.pr, fav = w.fav===act, dis = w.dislike===act, reck = restless(w), eager = w.lust >= LUST_EAGER;
  const expr = exprFor(w, act, o.reluct);
  let frustrated = false, fed = 0, drained = false;
  if(o.reluct){ moodAdd(w, -2); pr.reluct = (pr.reluct||0)+1; }
  if(fav){ moodAdd(w, 1.5); pr.favN = (pr.favN||0)+1; }
  if(dis){ moodAdd(w, -2.5); pr.disN = (pr.disN||0)+1; }
  if(eager && !o.reluct){ moodAdd(w, B.bonus.clientMood); pr.eagerN = (pr.eagerN||0)+1; }
  if(a.lust === undefined) spendLust(w, B.drop.client + (fav ? B.drop.fav : 0));
  else if(a.lust >= 0){   // giving, kissing, massages: with a client it's work, not foreplay. Only an insatiable lady (svcLustBuild fx) gets worked up by it.
    if(fxHas(w,'svcLustBuild')){ w.lust += a.lust * (0.4 + w.lewd/100) * (fav?1.5:1) * (dis?0.6:1) * fxMul(w,'lustBuild'); fitLust(w); }
  } else {
    const k = (o.tech ?? 0.85) * (fav?1.5:1) * (dis?0.6:1) * fxSub(w,'actQuality',act);
    frustrated = !!a.finish && (o.tech ?? 0.85) * (w.lust/60) < SVC.frustrateAt;
    if(frustrated){ w.lust += SVC.frustrateLust; fitLust(w); moodAdd(w, -1); pr.frustN = (pr.frustN||0)+1; }
    else spendLust(w, -a.lust * k);
  }
  if(a.energyBack) w.energy += a.energyBack;
  if(a.mood) moodAdd(w, a.mood);
  if(w.race==='demon' && a.finish){
    fed = reck ? SVC.demon.feedReckless : SVC.demon.feed; w.energy += fed;
    if(reck){ drained = true; pr.drains = (pr.drains||0)+1; if(o.h && !(o.h.up && o.h.up.sigil)) o.h.rep = clamp(o.h.rep - SVC.demon.repDrain); }
  }
  if(w.race==='demon' && a.kind==='kiss'){ fed += SVC.demon.kissFeed; w.energy += SVC.demon.kissFeed; }   // a kiss is a small sip
  countUp(w,'svc'); countUp(w,'svcByAct.'+act); if(a.kind==='massage') countUp(w,'massage');
  const note = drained ? 'drained' : frustrated ? 'frustrated' : fav ? 'fav' : o.reluct ? 'stretch' : dis ? 'dislike' : eager ? 'eager' : null;
  return {note, expr, frustrated, fed, drained};
}
const ENC_NOTE = k => k ? flavor('enc_'+k) : '';
const CLS_LABEL = id => ((CLASSES.find(c=>c.id===id)||{}).label || id);

/* ---------- jobs, propositions & rough clients (docs/OVERHAUL.md §5-6) ---------- */
// Reputation gains get harder as the house grows: max(gainMin, gainBase - rep/gainDiv). Losses are unchanged.
const repGain = (h, n) => n > 0 ? n * Math.max(BAL.rep.gainMin, BAL.rep.gainBase - h.rep/BAL.rep.gainDiv) : n;
function repAdd(h, n){ h.rep = clamp(h.rep + repGain(h, n)); }
// Each accepted proposition costs a non-must lady 8% of her main job's output that week (max 50%).
const outputMult = (w, pr) => (JOBS[w.job] && JOBS[w.job].must) ? 1 : Math.max(1 - BAL.props.maxPenalty, 1 - BAL.props.penalty*(pr.accProp||0));
// Courtesans work out of the mood; everyone else turns heavier services down below lust.low.
const moodFree = w => w.job === 'courtesan';
const nim = (w, id) => !moodFree(w) && notInMood(w, id);
// Menu used for must-offer staff: her menu, or what she's comfortable with if she never set one.
const offeredMenu = w => w.menu.length ? w.menu : getActs().filter(a=>clientStance(w,a.id)==='yes').map(a=>a.id);
// Would she take this proposition? Returns {kind:'yes'|'alt'|'no', act, why}.
function propDecide(w, want, X){
  const BP = BAL.props, must = !!(JOBS[w.job] && JOBS[w.job].must), reck = restless(w) && !has(w,'Devoted'), mode = w.offDuty || 'ask';
  let chance;
  if(must) chance = 1;
  else if(mode==='on') chance = BP.onChance;
  else if(mode==='off') chance = reck ? BP.offSlip : 0;
  else chance = clamp(BP.acceptBase + (w.lust - BP.acceptLustMid)/100 + fxAdd(w,'willing')/100 + (w.lust >= LUST_EAGER ? BP.acceptEager : 0) + (reck ? BP.acceptReckless : 0), 0.02, 0.95);
  if(Math.random() >= chance) return {kind:'no', why:'declined'};
  const menu = must ? offeredMenu(w) : w.menu, ok = id => menu.includes(id) && canClient(w,id) && !nim(w,id) && w.energy - actCost(w,id) > maxEnergy(w)*0.2;
  if(want && ok(want)) return {kind:'yes', act:want};
  if(want && menu.includes(want) && nim(w,want)) return {kind:'no', why:'nomood'};
  const alt = menu.filter(id=>ok(id) && actById(id) && actById(want) && actById(id).price <= actById(want).price).sort((a,b)=>actById(b).price-actById(a).price)[0];
  if(alt && Math.random() < BP.alt) return {kind:'alt', act:alt};
  return {kind:'no', why:'declined'};
}
// One service for one client: growth, energy, room, her side (serveAct), and an encore for a restless lady. Used by escorts,
// propositions and reckless self-propositions alike. o = {tech, reluct, inc, ecost, led}.
function runService(X, w, A, o){
  const pr = X.R.per[w.id], act = A.id, hr = X.hr;
  pr.acts[act] = (pr.acts[act]||0)+1; growAct(w, act, 0.7); lewdUp(w, o.reluct?0.6:0.3, svcLewdCap(act,'client'));
  w.energy -= o.ecost; X.useRoom(w);
  const reck0 = restless(w);
  const ser = serveAct(w, A, {tech:o.tech, reluct:o.reluct, pr, h:X.h});
  let note = ser.note, encore = null;
  const more = askMore(X, w, A, o);
  if(more && more.drained) note = 'drained';
  if(!more && A.finish && reck0 && w.lust >= LUST_EAGER && X.roomOK(w) && Math.random() < SVC.encoreBase + fxAdd(w,'encore')){
    const ids = offeredMenu(w).filter(id=>canClient(w,id) && !nim(w,id)), a2id = (!ids.length || (ids.includes(act) && Math.random()<0.5)) ? act : pick(ids), A2 = actById(a2id);
    const fee2 = Math.round(o.inc * (A2.price/A.price) * SVC.encoreFee);
    hr.income += fee2; X.R.led[o.led] += fee2; pr.earned += fee2; w.energy -= actCost(w, a2id); X.useRoom(w);
    pr.acts[a2id] = (pr.acts[a2id]||0)+1; countUp(w,'encore'); encore = a2id;
    const s2 = serveAct(w, A2, {tech:o.tech, reluct:false, pr, h:X.h}); if(s2.drained) note = 'drained';
  }
  return {ser, note, encore, reck0, more: more ? more.id : null};
}
// After a service that built her lust (giving, kissing, massages), a lady in the mood may ask the client for more: a heavier service from
// her menu that actually spends it. o.noRoom: it happens where she already is (the baths). Returns {id, drained} or null.
function askMore(X, w, A, o){
  const M = SVC.askMore;
  if(!M || (A.lust ?? -1) < 0 || w.lust < LUST_EAGER || w.lewd < M.lewd || Math.random() >= M.chance + fxAdd(w,'encore')*0.5) return null;
  if(!o.noRoom && !X.roomOK(w)) return null;
  const ids = offeredMenu(w).filter(id=>{ const B = actById(id); return B && (B.lust ?? -1) < 0 && canClient(w,id) && !nim(w,id) && w.energy - actCost(w,id) > maxEnergy(w)*0.15; });
  if(!ids.length) return null;
  const id = (w.fav && ids.includes(w.fav)) ? w.fav : pick(ids), B = actById(id), pr = X.R.per[w.id];
  const fee = Math.round(o.inc * (B.price/A.price) * M.fee);
  X.hr.income += fee; X.R.led[o.led] += fee; pr.earned += fee; w.energy -= actCost(w, id); if(!o.noRoom) X.useRoom(w);
  pr.acts[id] = (pr.acts[id]||0)+1; growAct(w, id, 0.5); countUp(w,'askedMore'); pr.moreN = (pr.moreN||0)+1;
  const s2 = serveAct(w, B, {tech:o.tech, reluct:false, pr, h:X.h});
  return {id, drained: s2.drained};
}

// The madame coaches her courtesans: if she is clearly more popular (balance.json → jobs.madamePopGap), every service skill

function simHouse(h, R){

  S.workers.forEach(w=>R.per[w.id]={id:w.id, name:w.name, job:w.job, house:w.house, served:0, comp:0, acts:{}, props:0, acc:0, earned:0, e0:Math.round(w.energy), m0:Math.round(w.mood), l0:Math.round(w.lust||0), enc:[], why:[], notes:[]});
  const log = t => R.lines.push(t);
  let satSum = 0;
  S.houses.forEach(h=>{ const hr = simHouse(h, R); R.houses.push(hr); R.income += hr.income; R.upkeep += hr.upkeep; R.served += hr.served; R.turned += hr.turned; satSum += hr.sat; });
  R.wages = S.workers.reduce((a,w)=>a+(isFree(w)?0:w.wage), 0);
  S.gold += R.income - R.wages - R.upkeep;

  const leaving = [], renew = [];
  S.workers.forEach(w=>{
    const pr = R.per[w.id], h = houseOf(w), hrw = R.houses.find(x=>x.id===w.house), tfx = hrw && hrw.tidyFx;
    const mad = S.workers.find(x=>x.house===w.house && x.job==='madame');
    // Sleep: bed quality x how much of the week she had to herself. No recovery while working.
    const mx = maxEnergy(w), spent = Math.max(0, pr.e0 - w.energy), freeFrac = clamp(1 - spent/mx, 0.1, 1, );
    let rest = (w._bed ?? BEDS[h.beds||0].rest);
    rest *= restMult(w) * (tfx ? tfx.rec : 1);
    let rec = w.job==='rest' ? rest*1.6 + (h.up.bath?10:0) : rest*(0.75 + 0.25*freeFrac);
    if(w.race==='spirit') rec = w.job==='rest' ? 55 : 30;
    if(w.race==='demon') rec = w.job==='rest' ? rec*0.35 : -SVC.demon.hunger;   // demons get nothing from sleep and burn energy every working week: they feed on desire instead (serveAct); on a week off, on men in town
    if(w.race==='demon' && w.job==='rest' && restless(w) && Math.random() < SVC.demon.restDrainChance){   // a restless one can overdo it, and the town notices
      S.rep = clamp(S.rep - SVC.demon.restRepDrain); pr.drains = (pr.drains||0)+1; (pr.notes = pr.notes||[]).push(flavor('rest_demon_drain', w));
      log(`😈 ${w.name} fed a little too hard on her week off. Talk around town is not kind (reputation −${SVC.demon.restRepDrain}).`); }
    const e0 = w.energy;
    if(w.race==='android' && w.job==='rest') rec = Math.max(rec, maxEnergy(w) - w.energy);   // resting androids charge to full
    w.energy += rec; pr.slept = w._bed===FLOOR_REST ? 'floor' : w.race==='spirit' ? 'spirit' : w.race==='android' ? 'charging' : w.race==='demon' ? 'none' : BEDS[h.beds||0].label;
    if(w.race==='android'){ const got = Math.max(0, Math.min(w.energy, energyCap(w)) - e0), A = SVC.android;
      if(got > 0){ const fee = Math.round((A.fee + A.perEnergy*got) * (h.up.charger ? 1 - A.chargerDiscount : 1)); S.gold -= fee; R.recharge += fee; pr.recharge = fee; } }
    const why = (t, good) => pr.why.push({t, good});
    if(w.job!=='rest'){ countUp(w,'weeksWorked'); countUp(w,'jobWeeks.'+w.job); }
    if(pr.favN) why('got to do her favorite', true);
    if(pr.eagerN) why('was in the mood for her clients', true);
    if(pr.disN) why('had to do things she dislikes', false);
    if(pr.reluct) why('did a few things as a favor', false);
    if(w.job==='rest'){ moodAdd(w, 8); w.health += 15; why('a week off', true); }
    w.health = clamp(w.health+5);
    if(w._bed===FLOOR_REST && w.race!=='spirit'){ moodAdd(w, -3); why('slept on the floor', false); }
    else if(housingShort(h) && !['spirit','android','demon'].includes(w.race)){ moodAdd(w, -BAL.quarters.moodPer*housingShort(h)); why('expects better quarters in a house this famous', false); }
    w.mood += (BAL.mood.restingPoint + fxAdd(w,'moodRest') + (has(w,'Loyal')?5:0) + (has(w,'Devoted')?10:0) - w.mood) * BAL.mood.drift * fxMul(w,'moodDrift');
    const work = pr.served + pr.acc - pr.comp*0.4, over = work - BAL.mood.overworkAt;
    if(over>0){ moodAdd(w, -over*(has(w,'Lazy')?5:2.5)); why(over>3 ? 'badly overworked' : 'a bit overworked', false); }
    if(!isFree(w) && w.wage < wageFor(w)*0.9){ moodAdd(w, -4); why('feels underpaid', false); }
    if(jobLikes(w).includes(w.job)){ moodAdd(w, 3); why('likes her job', true); } else if(jobDislikes(w).includes(w.job)){ moodAdd(w, -3); why("doesn't like her job", false); }
    if(mad && w!==mad) moodAdd(w, 3);
    if(tfx){ moodAdd(w, tfx.mood); why(tfx.mood > 0 ? 'a spotless house' : 'a grubby house', tfx.mood > 0); }
    if(pr.accProp && !(JOBS[w.job]||{}).must) why(`propositions took ${Math.round((1-outputMult(w,pr))*100)}% of her work time`, false);
    if(pr.noRoom) why('no free room for a client', false);
    if(pr.offMood) why('worked while not in the mood', false);
    if(h.up.bath) moodAdd(w, 3);
    Object.keys(h.up).forEach(k=>{ const u = UPGRADES[k]; if(h.up[k] && u && u.race===w.race && u.mood) moodAdd(w, u.mood); });   // race houses (tether, chapel, grove, den)
    if(hasPast('cook')) moodAdd(w, 2);
    const o = getOutfit(w); if(o.style===w.style){ moodAdd(w, 3); why('loves her outfit', true); }
    if(usesColor(o) && w.outColor===w.favColor) moodAdd(w, 2);
    if(w.under!=='none' && usesColor(getUnder(w)) && w.underColor===w.favColor) moodAdd(w, 1);
    if(has(w,'Greedy') && pr.earned>250){ moodAdd(w, 4); why('made good money', true); }
    if(w.energy <= 5 && w.race!=='demon'){ w.health -= 15; moodAdd(w, -10); why('exhausted', false); log(`⚠️ ${w.name} is exhausted. Give her some rest.`); }
    w.energy = clamp(w.energy, 0, energyCap(w)); w.mood = clamp(w.mood); w.health = clamp(w.health);
    if(w.race==='demon' && w.energy <= 5 && w.job!=='rest') log(`${w.name} is running on fumes. She needs clients to feed on, or time off.`);
    if(has(w,'Devoted')) w.mood = Math.max(w.mood, 45);
    if(w.mood>65) w.trust += 0.5 * fxMul(w,'trustGain');
    if(w.mood<30 && !has(w,'Loyal') && !isFree(w)) w.trust -= 2;
    w.trust = clamp(w.trust); capTrust(w);
    if(w.health<30 && w.job!=='rest'){ w.job='rest'; log(`🤒 ${w.name} is unwell and will rest next week.`); }
    if(w.job!=='rest' && w.trust < jobTrust(w,w.job) - 5){ log(`${w.name} doesn't trust Sam enough to keep working as ${JOBS[w.job].label} and stepped down.`); w.job='rest'; delete w.prevJob; }
    const dropped = w.menu.filter(a=>!canClient(w,a));
    if(dropped.length){ w.menu = w.menu.filter(a=>canClient(w,a)); log(`${w.name} took ${dropped.map(actLabel).join(', ')} off her menu for now.`); }
    if(w.job==='courtesan' && !getActs().some(a=>canClient(w,a.id))){ w.job = safeJob(w, 'attendant'); log(`${w.name} isn't comfortable offering services right now and moved to ${(JOBS[w.job]||{label:'rest'}).label} work.`); }
    if(!wardrobeOK(w,w.outfit)){ w.outfit = ownedOutfits(w).find(k=>wardrobeOK(w,k)) || w.outfit; log(`${w.name} changed into something she's more comfortable in.`); }
    if(!underOK(w,w.under)){ w.under='plain'; }
    // auto-rest
    if(w.autoRest){
      if(w.job!=='rest' && w.energy < maxEnergy(w)*0.35){ w.prevJob = w.job; w.job = 'rest'; log(`😴 ${w.name} is worn out and will rest next week.`); }
      else if(w.job==='rest' && w.prevJob && w.energy >= maxEnergy(w)*0.85){ const pj = w.prevJob; delete w.prevJob; if(!canDo(w,pj)){ w.job = pj; log(`💪 ${w.name} is rested and back to work as ${JOBS[pj].label}.`); } }
    }
    // how she took the week's clients, by personality (data/personalities.json goodNight/badNight, flavor good_night/bad_night)
    if(pr.served >= 2){
      const avg = pr.satSum/pr.served, P = PERS[w.personality]||{};
      const kind = avg>=72 && !pr.low ? 'good' : (pr.low>=2 || avg<38) ? 'bad' : null;
      if(kind){ moodAdd(w, kind==='good' ? (P.goodNight??3) : (P.badNight??-3)); pr.night = kind; why(kind==='good' ? 'her clients loved her' : 'difficult clients', kind==='good');
        if(Math.random()<0.6) R.hl.push({wid:w.id, text:flavor(kind+'_night', w), act:null, scene:'casual'}); }
    }
    // lust builds up, and is spent by services and time with Sam
    // (services and Sam's time already spent it as they happened; see spendLust)
    w.lust = w.lust + lustProfile(w).build; fitLust(w);
    if(w._samTime) why('spent time with Sam', true);
    if(has(w,'Devoted') && !w._samTime && restless(w)){ why('missed Sam', false); moodAdd(w, -BAL.lovers.missedMood); pr.missed = true; }
    if(has(w,'Devoted')) w.neglect = w._samTime ? 0 : (w.neglect||0) + 1;   // weeks in a row without Sam
    w._samTime = 0; pr.lust = Math.round(w.lust);
    pr.e1 = Math.round(w.energy); pr.m1 = Math.round(w.mood);
    w.earnedLast = pr.earned;
    if(w.mood<15 && !has(w,'Loyal') && !isFree(w) && !w.locked && !has(w,'Devoted')){ w.unhappy=(w.unhappy||0)+1; if(w.unhappy>=2) leaving.push(w); else log(`😠 ${w.name} is miserable. If nothing changes, she'll leave.`); }
    else w.unhappy = 0;
    if(!isFree(w) && !w.locked){ w.contract--; if(w.contract<=0 && !leaving.includes(w)) renew.push(w); }
    const enc = pr.enc.slice().sort(()=>Math.random()-0.5).sort((a,b)=>(b.act?2:b.want?0:1)+(b.reg?2:0)-(a.act?2:a.want?0:1)-(a.reg?2:0));
    enc.slice(0,2).forEach(e=>R.hl.push({wid:w.id, text:hlText(w,e) + (e.note ? ' ' + ENC_NOTE(e.note) : ''), act:e.act||null, cls:e.cls, note:e.note||null, scene: e.act ? 'act:'+e.act+'~'+(e.expr||'')+'~'+(e.ctx||'') : e.where ? 'job_'+e.where : 'companion'}));
    delete pr.enc;
    earnCheck(w).forEach(t=>{ log(`✨ ${w.name} has developed a knack: ${t}. ${TRAITS[t].desc}`); addLog(`${w.name} developed the trait ${t}.`); });
    // romance arcs
    if(ARCS[w.key] && (w.arc||0) < ARCS[w.key].length && !houseGate(w)){
      const i = w.arc||0, A = BAL.arcs, need = A.need[i], gap = A.gap[i];
      const extra = i===2 ? ((w.dates||0)>=A.dates[2] || (w.privateCount||0)>=1) : i===4 ? (w.dates||0)>=A.dates[4] : i===5 ? (w.privateCount||0)>=A.private[5] : true;
      if(w.trust>=need && S.week-(w.arcWk||0) >= gap && extra){ const at = i; EVQ.push(()=> (w.arc||0)===at ? evArc(w) : null); }
    }
  });
  leaving.forEach(w=>{ S.workers = S.workers.filter(x=>x!==w); log(`🚪 ${w.name} packed her things and left.`); addLog(`${w.name} quit.`); });

  (R.houses||[]).forEach(hr=>{
    if(hr.short) log(`🚪 ${flavor('rooms_short', null, {house:hr.name})} (${hr.short} client${hr.short>1?'s':''} turned away; ${hr.roomsUsed}/${hr.roomCap} room sessions used.)`);
    const T = BAL.tidy, tk = hr.tidy >= T.high ? 'high' : hr.tidy < T.bad ? 'bad' : hr.tidy < T.low ? 'low' : null;
    if(tk) log(`${tk==='high'?'✨':'🧹'} ${flavor('tidy_'+tk, null, {house:hr.name})} (tidiness ${Math.round(hr.tidy)})`);
    const pu = hr.pushy; if(pu && pu.total) log(`⚠️ ${hr.name}: ${pu.total} pushy client${pu.total>1?'s':''}. ${[pu.security&&`security walked ${pu.security} out`, pu.sam&&`Sam stepped in ${pu.sam}×`, pu.samfail&&`Sam's attempt went badly ${pu.samfail}×`, pu.samcall&&`security needed Sam ${pu.samcall}× (your call)`, pu.none&&`nobody was there ${pu.none}×`].filter(Boolean).join(', ')}.`);
  });
  { const calls = (R.houses||[]).flatMap(hr=>hr.calls||[]); if(calls.length) EVQ.unshift(()=>pushyEvent(calls)); }
  (R.houses||[]).forEach(hr=>{ if(hr.floor && hr.floor.length) log(`🛏️ ${hr.name} is short on beds: ${hr.floor.join(', ')} slept on the floor. Build staff quarters or add staff beds.`); });
  R.avgSat = R.served ? satSum/R.served : 50;
  const avgRep = S.houses.reduce((a,h)=>a+h.rep,0)/S.houses.length, maxRep = Math.max(...S.houses.map(h=>h.rep));
  S.rep = clamp(S.rep + ((maxRep*0.6 + avgRep*0.4) - S.rep)*0.35 + S.houses.length*0.1);
  R.rep = S.rep;

  S.houses.forEach(h=>{
    const st = STORIES[h.id]; if(!st || !h.story || h.story.beat>=st.beats.length) return;
    const need = STORY_REP[h.story.beat]||0, gap = storyGap(h);
    if(S.week - Math.max(h.since||1, h.story.wk||0) >= gap && h.rep>=need){ const b = h.story.beat; EVQ.push(()=>{ if(h.story.beat!==b) return null; const ev = st.beats[b](h); if(ev) ev.title = `${st.title} (${b+1}/${st.beats.length})`; return ev; }); }
  });
  seedBonds(); driftBonds();
  queueEncounters();
  renew.forEach(w=>EVQ.push(()=>evRenew(w)));
  if(Math.random()<0.6){ const ev = pickRandomEvent(); if(ev) EVQ.push(ev); }
  if(S.flags.poachCD>0) S.flags.poachCD--;

  if(debtWeek()%BAL.debt.every===0){
    const nd = nextDue();
    if(nd.amount>0){
      if(S.gold >= nd.amount){
        S.gold -= nd.amount; S.debt.remaining -= nd.amount; S.debt.carry = 0;
        log(`📜 Paid ${fmt(nd.amount)} to the Vane Credit House. Remaining: ${fmt(S.debt.remaining)}.`);
      } else {
        S.debt.strikes++; const pen = Math.round(nd.amount*BAL.debt.penalty);
        S.debt.carry = Math.min(S.debt.remaining + pen, nd.amount + pen); S.debt.remaining += pen;
        log(`❌ Missed a debt payment! Strike ${S.debt.strikes}/${BAL.debt.strikes}. A ${fmt(pen)} penalty was added.`);
        EVQ.push(evStrike);
      }
    }
  }
  if(R.income - R.wages - R.upkeep > 0) samGainXP(Math.min(30, Math.round((R.income - R.wages - R.upkeep)/60)));
  S.week++; S.ap = apMax(); S.sam.energy = Math.min(100, S.sam.energy + samRecover(BAL.samHome.weekly) + (samUpFx('weekly')||0) + (hasPast('gym')?20:0));
  S.samWeek = {security:0, books:false, income:0, acts:[]};
  refreshCandidates();
  checkUnlocks(false, R.lines);
  S.lastReport = R;
  addLog(`Week ${R.week}: income ${fmt(R.income)}, wages ${fmt(R.wages)}, upkeep ${fmt(R.upkeep)}${R.recharge?`, recharging ${fmt(R.recharge)}`:''}.`);
  save(); render();
  showReport(R, true);
}
function showReport(R, fromWeek){
  if(!R) return;
  const net = R.income - R.wages - R.upkeep - (R.recharge||0);
  const L = R.led;
  const ledger = [['Escort fees',L.escort],['Propositions',L.offduty],['Bar',L.bar],['Stage',L.dance],['Bathhouse',L.bath]].filter(x=>x[1]).map(([k,v])=>`<tr><td>${k}</td><td class="good">+${fmt(v)}</td></tr>`).join('')
    + `<tr><td>Wages</td><td class="warn">−${fmt(R.wages)}</td></tr><tr><td>Upkeep</td><td class="warn">−${fmt(R.upkeep)}</td></tr>` + (R.recharge ? `<tr><td>Recharging</td><td class="warn">−${fmt(R.recharge)}</td></tr>` : '')
    + (L.sam?`<tr><td class="muted">Sam's bar shifts (already in your purse)</td><td class="good">+${fmt(L.sam)}</td></tr>`:'')
    + `<tr><th>Net</th><th class="${net>=0?'good':'warn'}">${fmt(net)}</th></tr>`;
  const houseRows = (R.houses||[]).map(h=>`<tr><td>${esc(h.name)}</td><td>${h.served}${h.turned?` <span class="warn">(+${h.turned} turned away)</span>`:''}</td><td>${fmt(h.income)}</td><td>${fmt(h.upkeep)}</td><td>${Math.round(h.avgSat)}</td><td>${Math.round(h.rep)}</td></tr>`).join('');
  const houseExtra = (R.houses||[]).filter(h=>h.roomCap!==undefined).map(h=>{ const pu = h.pushy||{};
    return `<div class="muted"><b>${esc(h.name)}</b>: rooms ${h.roomsUsed}/${h.roomCap}${h.short?` <span class="warn">(short on rooms)</span>`:''} · tidiness ${Math.round(h.tidy0)}→<b class="${h.tidy>=BAL.tidy.high?'good':h.tidy<BAL.tidy.low?'warn':''}">${Math.round(h.tidy)}</b>${h.promoDraw?` · promoter draw +${Math.round(h.promoDraw)}`:''}${h.stepIn?` · stepped in for ${h.stepIn}`:''}${h.selfProps?` · restless ladies made ${h.selfProps} proposition${h.selfProps>1?'s':''} themselves`:''}${pu.total?` · pushy clients ${pu.total}: <span class="good">${(pu.security||0)+(pu.sam||0)} handled</span>${(pu.samfail||0)+(pu.none||0)?`, <span class="warn">${(pu.samfail||0)+(pu.none||0)} went badly</span>`:''}`:''}</div>`; }).join('');
  const blocks = (R.houses||[]).map(hh=>{
    const ps = Object.values(R.per).filter(p=>p.house===hh.id);
    if(!ps.length) return '';
    return `<h3 style="margin-top:12px">${esc(hh.name)}</h3>` + ps.map(p=>{
      const w = findAny(p.id) || {id:p.id, name:p.name};
      const svc = Object.entries(p.acts).map(([id,n])=>`<span class="tag act">${esc(actLabel(id))} ×${n}</span>`).join('') + (p.comp?`<span class="tag">Company ×${p.comp}</span>`:'') + (p.draw?`<span class="tag">Draw +${Math.round(p.draw)} clients${p.samples?' (samples)':''}</span>`:'') + (p.tidied?`<span class="tag">Tidied +${Math.round(p.tidied)}</span>`:'') + (p.stepIn?`<span class="tag">Stepped in ×${p.stepIn}</span>`:'') + (p.pushy?`<span class="tag">Pushy clients ×${p.pushy}</span>`:'');
      const hls = R.hl.map((h,i)=>({h,i})).filter(x=>x.h.wid===p.id).map(({h,i})=>`<div class="hl">${esc(h.text)} ${findAny(p.id)?`<button class="sm" id="hl${i}_t" onclick="toggleImgBtn('hl${i}','${p.id}','${h.scene}')">🖼 Show image</button>`:''}<div id="hl${i}" class="hlimg" data-ext="1"></div></div>`).join('')
        ;
      return `<div class="rep-w"><div class="head">${w.design?avatarHTML(w):''}<div><b>${esc(p.name)}</b> · ${JOBS[p.job]?JOBS[p.job].label:p.job}${p.earned?` · earned <b>${fmt(p.earned)}</b>`:''}
        <div class="muted">${p.served?`${p.served} client${p.served>1?'s':''} · `:''}${p.props?`propositioned ${p.props}× · accepted ${p.acc} · `:''}${p.reluct?`<span class="pink">${p.reluct} as a favor</span> · `:''}${p.notMood?`<span class="warn">not in the mood ×${p.notMood}</span> · `:''}${p.noRoom?`<span class="warn">no room ×${p.noRoom}</span> · `:''}Energy ${p.e0}→${p.e1} · Mood ${p.m0}→${p.m1}${p.why&&p.why.length?` <span class="muted">(${p.why.map(x=>`<span class="${x.good?'good':'warn'}">${esc(x.t)}</span>`).join(', ')})</span>`:''}${p.slept?` · slept: ${p.slept}`:''}${p.solo?' · <span class="pink">a night to herself</span>':''}${p.missed?' · <span class="warn">missed Sam</span>':''}${p.night==='good'?' · <span class="good">great week</span>':p.night==='bad'?' · <span class="warn">rough week</span>':''}${p.lust!==undefined?` · lust ${p.l0!==undefined?p.l0+'→':''}${p.lust}`:''}</div>
        <div>${svc}</div>${(p.notes||[]).map(n=>`<div class="muted">${esc(n)}</div>`).join('')}</div></div>${hls}</div>`;
    }).join('');
  }).join('');
  modal(`<h2>Week ${R.week} Report</h2>
    <div class="grid2"><div>Clients served: <b>${R.served}</b>${R.turned?` <span class="warn">(${R.turned} turned away; more staff or rooms needed)</span>`:''}</div>
      <div>Avg. satisfaction: <b>${Math.round(R.avgSat)}</b> · Renown: <b>${Math.round(R.rep)}</b></div></div>
    <div class="grid2"><div><h3 style="margin-top:10px">Ledger</h3><table>${ledger}</table></div>
      <div><h3 style="margin-top:10px">Houses</h3><table><tr><th>House</th><th>Clients</th><th>Income</th><th>Upkeep</th><th>Sat.</th><th>Rep</th></tr>${houseRows}</table></div></div>
    ${houseExtra?`<div style="margin-top:6px">${houseExtra}</div>`:''}
    ${R.samActs&&R.samActs.length?`<h3 style="margin-top:10px">Sam's week</h3><div class="muted">${R.samActs.map(esc).join(' · ')}</div>`:''}
    ${R.lines.length?`<h3 style="margin-top:10px">Notes</h3>${R.lines.map(l=>`<div>${esc(l)}</div>`).join('')}`:''}
    ${blocks || '<p class="muted">Nobody worked this week.</p>'}
    <div class="row" style="margin-top:12px"><button class="primary" onclick="closeModal();${fromWeek?'runQueue()':''}">Continue</button></div>`, {lock:!!fromWeek, wide:true});
}

'use strict';
/* =====================================================================
   EVENTS
   ===================================================================== */
function runQueue(){
  if(!EVQ.length){ CUR_EV=null; render(); checkEnd(); return; }
  let ev = null; try{ ev = EVQ.shift()(); }catch(e){ console.warn('event skipped', e); ev = null; }
  if(!ev) return runQueue();
  showEvent(ev);
}
function showEvent(ev){
  CUR_EV = ev;
  modal(`<h2>${esc(ev.title)}</h2>${ev.who?`<div id="evImg"></div>`:''}
    <p class="story">${esc(ev.text)}</p><div id="evRes"></div>
    <div class="row" id="evChoices">${ev.choices.map((c,i)=>`<button ${i===0?'class="primary"':''} onclick="evChoice(${i})">${esc(c.label)}</button>`).join('')}</div>`, {lock:true});
  if(ev.who) showImg('evImg', ev.who, ev.scene||'portrait', ev.cloth);
}
function evChoice(i){
  const ev = CUR_EV; if(!ev) return;
  const out = ev.choices[i].fx() || '';
  const res = typeof out==='object' ? (out.text||'') : out;
  checkUnlocks(); save(); render();
  $('#evChoices').innerHTML = `${out.ai?aiBtn('evAi', out.ai.kind, out.ai.wid, out.ai):''}<button class="primary" onclick="closeModal();runQueue()">Continue</button>`;
  $('#evRes').innerHTML = (res ? `<p class="story"><i>${esc(res)}</i></p>` : '') + (out.ai?'<div id="evAi"></div>':'') + (out.img?'<div id="evResImg"></div>':'');
  if(out.img) showImg('evResImg', out.img.wid, out.img.scene, out.img.cloth);
  if(out.ai && SET.ai.on && SET.ai.auto) aiWrite('evAi', out.ai.kind, out.ai.wid, out.ai);
}

/* ---- js/stories/houses.js ---- */
'use strict';
/* =====================================================================
   HOUSE STORYLINES — one unique 3-chapter story per house.
   Chapters trigger over time as the house's reputation grows (0 / 15 / 25).
   A failed check just means the chapter comes back a few weeks later.
   ===================================================================== */
const pct = (v,dc) => clamp(Math.round(55 + (v + ((S&&S.sam.lvl)||1)*2 - 2 - dc)*1.4), 15, 95);
const rollP = p => Math.random()*100 < p;
const resident = h => S.workers.find(w=>w.key===HOUSES[h.id].npc);
const secOf = h => Math.max(0, ...S.workers.filter(w=>w.house===h.id && w.job==='security').map(w=>s100(w.tech.combat) + s100(w.stats.strength)*0.3));
function storyAdvance(h, xp=40){ h.story.beat++; h.story.wk = S.week; samGainXP(xp); }
const storyGap = h => BAL.houseGate.gap[Math.min(h.story.beat, BAL.houseGate.gap.length-1)];
// A failed check comes back after houseGate.retry weeks (the wait check is week - story.wk >= gap, so shift wk by the difference).
function storyRetry(h){ h.story.wk = S.week + BAL.houseGate.retry - storyGap(h); }
function check(label, stat, val, dc, win, lose){ const p = pct(val,dc); return {label:`${label} [${stat} ${p}%]`, fx(){ return rollP(p) ? win() : lose(); }}; }
function pay(label, cost, h, win){ return {label:`${label} (${fmt(cost)})`, fx(){ if(S.gold<cost){ storyRetry(h); return 'You can\'t afford that right now. (This will come up again.)'; } S.gold-=cost; return win(); }}; }
function freeResident(h){ const R = resident(h); if(!R) return ''; R.free = true; R.wage = 0; R.contract = 999; R.trust = clamp(R.trust+15); if(!has(R,'Loyal')) R.traits.push('Loyal'); return `\n\n(${R.name} now works without wages.)`; }
function joinNamed(key, h, free){
  if(isHired(key)) return '';
  const w = makeNamed(key); w.house = h.id; w.locked = h.id; w.contract = 999; w.trust = clamp(w.trust+20);
  if(free){ w.free = true; w.wage = 0; w.contract = 999; }
  S.workers.push(w); assignStart(w, NAMED[key].job); delete NPCS['n_'+key]; checkUnlocks(true);
  return `\n\n(${w.name} joins ${h.name}${free?', working without wages':''}.)`;
}
const RN = h => { const R = resident(h); return R ? R.name : 'the staff'; };
const RID = h => { const R = resident(h); return R ? R.id : null; };
const SSTR = h => Math.max(S.sam.strength, secOf(h));
const STORIES = {
  lantern:{title:'The Grieve Debt', hint:['A stranger will come asking about the old owner\'s debts.','Mira is looking into the old ledgers.','Time to deal with Silas Grieve for good.'], beats:[
    h=>({title:'The Grieve Debt (1/3)', who:'npc_silas', text:`A broad man with a scarred jaw lets himself into ${h.name} like he owns it. "Silas Grieve. The old owner paid my employer for 'protection.' Payments stopped when he vanished. I assume you'll be resuming them."\n\nBehind the counter, ${RN(h)} has gone very pale.`, choices:[
      pay('Pay him', 200, h, ()=>{ storyAdvance(h,20); return '"Smart man." He pockets the coin. He will, it turns out, be back for more.'; }),
      check('Throw him out','Strength',SSTR(h),35, ()=>{ storyAdvance(h); h.rep=clamp(h.rep+2); return 'Silas ends up on the street, mostly out of surprise. "You\'ll regret that," he says, straightening his coat.'; }, ()=>{ S.sam.energy=Math.max(0,S.sam.energy-30); storyRetry(h); return 'It does not go well. Silas leaves anyway, laughing. "I\'ll be back for an answer."'; }),
      check('Talk him in circles','Charm',S.sam.charm,38, ()=>{ storyAdvance(h); return 'Sam buries him in so many questions about invoices and payment terms that Silas leaves to find a headache powder. Now Sam knows exactly what he wants.'; }, ()=>{ storyRetry(h); return 'Silas is not amused. "One week. Then we talk properly."'; })]}),
    h=>({title:'The Grieve Debt (2/3)', who:RID(h), scene:'job_madame', text:`${RN(h)} drops a second, hidden ledger on Sam's desk. "The old man kept two sets of books. I never knew. If there's anything in here about Grieve, it's buried in his chicken-scratch."`, choices:[
      check('Go through it yourself','Business',S.sam.business,45, ()=>{ S.gold+=600; storyAdvance(h); return 'Three pots of tea later, Sam finds it: proof the "protection" was extortion, and the location of 600g hidden under the floorboards. +600g'; }, ()=>{ storyRetry(h); return 'The numbers refuse to add up. Sam will try again with fresh eyes.'; }),
      check(`Let ${RN(h)} handle it`,'Management',resident(h)?s100(resident(h).tech.manage):0,50, ()=>{ S.gold+=600; storyAdvance(h); return `${RN(h)} cracks it in one evening: proof of extortion, and 600g hidden under the floorboards. +600g`; }, ()=>{ storyRetry(h); return `${RN(h)} needs more time with it.`; })]}),
    h=>({title:'The Grieve Debt (3/3)', who:'npc_silas', text:`Silas Grieve is back, with two large friends. "Last chance, Takahashi."\n\nSam has the ledger in his coat.`, choices:[
      check('Take the ledger to the city watch','Business',S.sam.business,55, ()=>{ storyAdvance(h,60); h.rep=clamp(h.rep+5); return `The watch is very interested in the ledger. Silas and friends spend the night in a cell and the rest of the month leaving town.\n\n${RN(h)} watches them go, then turns to Sam. "Keep my wages. This place is as much mine as yours now."` + freeResident(h); }, ()=>{ storyRetry(h); return 'The watch captain is "very busy." Silas smirks and gives Sam another week.'; }),
      check('Show him the door, for good','Strength',SSTR(h),60, ()=>{ storyAdvance(h,60); h.rep=clamp(h.rep+5); return `It's short and loud. When the dust settles, Silas is limping toward the docks and the regulars are buying Sam drinks.\n\n${RN(h)} squeezes his arm. "Keep my wages. This place is home."` + freeResident(h); }, ()=>{ S.sam.energy=0; storyRetry(h); return 'Sam ends up on the floor. Silas laughs. "Next week."'; }),
      check('Offer him a better deal','Charm',S.sam.charm,55, ()=>{ storyAdvance(h,60); h.rep=clamp(h.rep+5); return `Sam points out that his boss has been skimming from Silas too. It's in the ledger. Silas reads it twice, swears, and leaves to have a very different conversation.\n\n${RN(h)} lets out a long breath. "Keep my wages. I'm not going anywhere."` + freeResident(h); }, ()=>{ storyRetry(h); return 'Silas isn\'t buying it. Yet.'; })]})
  ]},
  castle:{title:'The Lady in the East Tower', hint:['Cecile is hiding something about the castle.','Someone is coming for Lady Seraphine.','Lady Seraphine has something to say.'], beats:[
    h=>({title:'The Lady in the East Tower (1/3)', who:storyNpc('seraphine'), text:`${RN(h)} finally admits it: "The last Rosenhal never left. Lady Seraphine lives in the east tower. She has nowhere else to go."\n\nThat night Sam meets her on the stairs: sharp eyes, threadbare silk, and absolutely furious that a commoner owns her home.`, choices:[

    h=>({title:'The Lady in the East Tower (2/3)', who:'npc_gerhardt', text:`Baron Gerhardt Kessel arrives with a contract. "The Rosenhal debts are mine now. Lady Seraphine will settle them as my bride, by the end of the month."\n\nSeraphine says nothing. Her hands are shaking.`, choices:[

      pay('Buy the debt outright', 1500, h, ()=>{ storyAdvance(h); return 'Sam pays the baron in full. Gerhardt counts it twice and leaves, disappointed. Seraphine doesn\'t speak to Sam for a day. Then she leaves a thank-you note on his pillow.'; }),
      check('Have him escorted off the grounds','Strength',SSTR(h),60, ()=>{ storyAdvance(h); h.rep=clamp(h.rep-2); return 'The baron is escorted out, loudly. Some guests are scandalized. Seraphine is not.'; }, ()=>{ storyRetry(h); return 'The baron\'s guards outnumber yours. "One week," he says.'; })]}),
    h=>({title:'The Lady in the East Tower (3/3)', who:storyNpc('seraphine'), text:`Seraphine finds Sam in the great hall. "I have no money, a title worth nothing, and no intention of leaving. But I know every noble in the kingdom, and I know how to host them." She holds out her hand. "Let me earn my keep, Mr. Takahashi."`, choices:[

  ]},
  onsen:{title:'Cold Springs', hint:['Something is wrong with the springs.','Someone upstream is responsible.','The springs need a proper celebration.'], beats:[

      check('Ask the regulars','Charm',S.sam.charm,34, ()=>{ storyAdvance(h); return 'An old woodcutter mentions "the Golden Crane\'s men" building something upstream.'; }, ()=>{ storyRetry(h); return 'Nobody knows anything. Or nobody\'s saying.'; })]}),
    h=>({title:'Cold Springs (2/3)', who:'npc_kurogane', text:`Master Kurogane of the Golden Crane Inn doesn't even pretend. "The mountain's water goes where it is most appreciated. My guests appreciate it more than yours."`, choices:[

    h=>({title:'Cold Springs (3/3)', who:RID(h), scene:'job_bath', text:`The water is back, hotter than ever. ${RN(h)} is practically glowing. "We should celebrate. A real spring festival, like back home. Lanterns, food stalls, everything!"`, choices:[
