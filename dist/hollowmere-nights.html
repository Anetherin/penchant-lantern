'use strict';
/* =====================================================================
   CHANCE ENCOUNTERS & RECKLESS NIGHTS
   - Late-night visits: ladies who aren't seeing clients this week (resting or on staff jobs),
     with enough trust, lewdness and lust, may come looking for Sam.
   - Rest visits: when Sam rests, someone may join him.
   - Reckless nights: when lust runs very high, a lewd lady acts on it, either pulling Sam
     away (draining his energy) or freelancing with clients off the books.
   Every outcome is consensual; "reckless" means impulsive, not unwilling.
   ===================================================================== */
const bestSamAct = w => (w.fav && canSam(w,w.fav) && samStance(w,w.fav)==='yes') ? w.fav
  : (getActs().filter(a=>samStance(w,a.id)==='yes').sort((a,b)=>b.th-a.th)[0] || getActs().find(a=>canSam(w,a.id)) || {}).id;
const idleForClients = w => JOBS[w.job] && JOBS[w.job].cat!=='escort';
function canVisit(w, trustMin, lewdMin, lustMin){
  return w.trust>=trustMin && w.lewd>=lewdMin && w.lust>=lustMin && w.energy>=maxEnergy(w)*0.3 && !!bestSamAct(w);
}
// one shared result: run privateCore without spending an action
function encounterResult(w, act, intro, kind, situation, drain){
  if(drain) S.sam.energy = Math.max(0, S.sam.energy - drain);
  const text = intro + '\n\n' + privateCore(w, act);
  w.lust = clamp(w.lust - 25);
  samLog(`${kind==='reckless'?'Swept off by':'A visit from'} ${w.name}`);
  return {text, img:{wid:w.id, scene:'samact:'+act}, ai:{kind, wid:w.id, act, scene:'samact:'+act, forSam:true, situation}};
}

/* ---------- Sam rests ---------- */
function restVisitor(){
  const c = S.workers.filter(w=>canVisit(w, 55, 40, 40));
  if(!c.length || Math.random() > 0.35) return null;
  return weighted(c, w=>w.trust + w.lust);
}
function restEncounter(w){
  const act = bestSamAct(w);
  modal(`<h2>Nap Time... Interrupted</h2><div id="resImg"></div>
    <p class="story">Sam is halfway to sleep when the door creaks. ${esc(w.name)} slips in, closes it behind her, and sits on the edge of the bed. "You looked lonely," she says. She does not look like she came here to sleep.</p>
    <div id="resAi"></div>
    <div class="row"><button class="primary" onclick="restAccept('${w.id}','${act}')">Make room for her</button><button onclick="restDecline('${w.id}')">"I really do need the nap"</button></div>`);
  showImg('resImg', w.id, 'casual');
}
function restAccept(id, act){
  const w = findW(id); if(!w) return;
  const out = encounterResult(w, act, `${w.name} curls up next to him. The nap does not happen. Sam does not mind.`, 'encounter', 'Sam was trying to take a nap; she slipped into his room uninvited.', 10);
  checkUnlocks(); save(); render();
  showResult(`A Visit from ${w.name}`, out.text + '\n\n(Sam still got some rest: Energy +40 overall)', w.id, out.img.scene, out.ai);
}
function restDecline(id){
  const w = findW(id); if(!w) return;
  w.mood = clamp(w.mood - 2); save(); render();
  showResult('Nap Time', `${w.name} pouts, then tucks the blanket around him and leaves. Sam sleeps like a rock.\n\nEnergy +50`);
}

/* ---------- weekly ---------- */
function queueEncounters(){
  let used = queueRegularDrama() ? 1 : 0;
  // lovers at high lust come looking for Sam (they wait for him rather than going it alone)
  const lovers = S.workers.filter(w=>has(w,'Devoted') && w.lust>=LUST_HIGH && w.energy>=maxEnergy(w)*0.2 && bestSamAct(w));
  if(lovers.length && Math.random() < 0.75){ const id = pick(lovers).id; used++; EVQ.push(()=>evLoverWaiting(findW(id))); }
  // two or more lovers: jealousy when one is left out, or a shared night when everyone's happy
  if(used<2) used += queueLoverDynamics();
  // reckless nights (very high lust)
  shuffle(S.workers).forEach(w=>{
    if(used>=1 || has(w,'Devoted') || w.lust < LUST_HIGH || w.lewd < 50 || Math.random() > 0.35) return;
    used++; const id = w.id; EVQ.push(()=>evReckless(findW(id)));
  });
  // late-night visits from ladies who weren't seeing clients
  const c = S.workers.filter(w=>idleForClients(w) && canVisit(w, 60, 45, 55));
  if(c.length && used<2 && Math.random() < 0.12 + 0.05*c.length){ const w = pick(c), id = w.id; EVQ.push(()=>evLateVisit(findW(id))); }
}
function evLateVisit(w){
  if(!w || !canVisit(w, 60, 45, 40)) return null;
  const act = bestSamAct(w);
  return {title:'A Knock After Midnight', who:w.id, scene:'casual', text:flavor('late_visit', w),
    choices:[
      {label:'Let her in', fx(){ return encounterResult(w, act, `${w.name} doesn't wait for an answer. The candle burns all the way down.`, 'encounter', 'Late at night, she came to his door on her own initiative.'); }},
      {label:'Not tonight', fx(){ w.mood = clamp(w.mood-4); w.lust = clamp(w.lust-5); return `${w.name} smiles a little ruefully. "Your loss, boss."`; }}]};
}
function evLoverWaiting(w){
  if(!w || !has(w,'Devoted')) return null;
  const act = bestSamAct(w); if(!act) return null;
  return {title:`${w.name} Has Been Waiting`, who:w.id, scene:'casual', text:flavor('lover_waiting', w),
    choices:[
      {label:'Go to her', fx(){ return encounterResult(w, act, flavor('lover_reunion', w), 'encounter', 'She is his lover and had been waiting for him all week; she came to his room.'); }},
      {label:'"Tomorrow, I promise"', fx(){ w.mood = clamp(w.mood-5); w.lust = clamp(w.lust-5); return `${w.name} sighs and kisses his cheek. "You'd better mean it."`; }}]};
}
function evReckless(w){
  if(!w || w.lust < LUST_HIGH-10) return null;
  const act = bestSamAct(w), h = houseOf(w);
  if(act && w.trust>=40 && Math.random()<0.55){
    return {title:`${w.name} Can't Wait`, who:w.id, scene:'casual', text:`${w.name} has been restless for days, and tonight she's done waiting. She catches Sam in the hallway between errands, pushes him into the nearest storeroom, and locks the door behind them.`,
      choices:[
        {label:'Go along with it', fx(){ return encounterResult(w, act, `It is not quick. Sam emerges much later, extremely tired. (Sam's energy −35)`, 'reckless', 'She ambushed Sam in a storeroom after days of pent-up desire.', 35); }},
        {label:'"Not here, not now"', fx(){ w.mood = clamp(w.mood-6); w.lust = clamp(w.lust-8); return `${w.name} lets him go with a frustrated groan. She is going to be distracted all week.`; }}]};
  }
  // freelancing: took clients off the books
  const n = ri(2,4), cut = Math.round(n * rnd(15,30) * (1 + (h?h.rep:10)/100));
  return {title:`${w.name} Freelances`, who:w.id, scene:'companion', text:`On her night off, ${w.name} got restless, went down to the lounge, and quietly took ${n} clients of her own choosing. Off the books. She's back now, glowing, slightly guilty, and holding out an envelope: ${fmt(cut)}.`,
    choices:[
      {label:'Take the money and let it slide', fx(){ S.gold += cut; w.energy = clamp(w.energy-25, 0, maxEnergy(w)); w.lust = clamp(w.lust-45); w.mood = clamp(w.mood+6); if(h) h.rep = clamp(h.rep-1); return {text:`+${fmt(cut)}. She's thrilled. One of the clients complained about the "irregular service," though (−1 reputation).`, ai:{kind:'reckless', wid:w.id, scene:'companion', situation:`on her night off she slipped down to the lounge and took ${n} clients of her own choosing, off the books.`}}; }},
      {label:'Talk to her about it', fx(){ S.gold += cut; w.energy = clamp(w.energy-25, 0, maxEnergy(w)); w.lust = clamp(w.lust-45); gainTrust(w, 2); w.mood = clamp(w.mood-3); return `+${fmt(cut)}. Sam explains why the house needs to know who's where. She listens. She also asks to work more evenings.`; }}]};
}

/* ---------- lovers: jealousy & harmony ---------- */
const PRICKLY = ['Proud and sharp-tongued','Hot-blooded and competitive','Mysterious and aloof'];
function queueLoverDynamics(){
  const L = S.workers.filter(w=>has(w,'Devoted'));
  if(L.length < 2) return 0;
  const left = L.filter(w=>(w.neglect||0) >= BAL.lovers.neglectWeeks).sort((a,b)=>b.neglect-a.neglect)[0], fav = L.filter(w=>!w.neglect);
  if(left && fav.length && Math.random() < BAL.lovers.jealousyChance){ const a = left.id, b = pick(fav).id; EVQ.push(()=>evLoverJealous(findW(a), findW(b))); return 1; }
  const pair = L.filter(w=>!w.neglect && w.trust>=BAL.lovers.sharedMinTrust && w.lust>=60 && w.energy>=maxEnergy(w)*0.3 && bestSamAct(w));
  if(pair.length >= 2 && Math.random() < BAL.lovers.sharedChance){ const [a,b] = shuffle(pair); const ia=a.id, ib=b.id; EVQ.push(()=>evLoverShared(findW(ia), findW(ib))); return 1; }
  return 0;
}
function evLoverJealous(w, o){
  if(!w || !o) return null;
  const easy = !PRICKLY.includes(w.personality) && !PRICKLY.includes(o.personality) && w.trust>=85 && o.trust>=85;
  return {title:`${w.name} Feels Left Out`, who:w.id, scene:'casual', text:flavor('lover_jealous', w, {other:o.name}),
    choices:[
      {label:'Make it up to her (−20 energy, 40g)', fx(){ S.sam.energy = Math.max(0, S.sam.energy-20); S.gold -= 40; w.neglect = 0; w.mood = clamp(w.mood+8); gainTrust(w,2); w._samTime = (w._samTime||0)+1; return `Sam takes ${w.name} out for the evening and doesn't talk about work once. She forgives him somewhere around dessert.`; }},
      {label:`Talk to her and ${o.name} together`, fx(){
        if(easy){ gainTrust(w,2); gainTrust(o,2); w.neglect = 0; w.mood = clamp(w.mood+4); o.mood = clamp(o.mood+2); return `It's awkward for about five minutes. Then ${o.name} laughs, ${w.name} laughs, and the three of them end up drafting a schedule. It has a lot of hearts on it.`; }
        w.mood = clamp(w.mood-5); o.mood = clamp(o.mood-4); return `That went badly. ${w.name} and ${o.name} are now very politely not speaking to each other, or to Sam.`; }},
      {label:'Let it blow over', fx(){ w.mood = clamp(w.mood-8); w.trust = clamp(w.trust-3); return `${w.name} stops bringing it up. That's worse.`; }}]};
}
function evLoverShared(a, b){
  if(!a || !b) return null;
  return {title:'A Knock, Twice', who:a.id, scene:'casual', text:flavor('lover_shared', a, {other:b.name}),
    choices:[
      {label:'Let them both in', fx(){
        S.sam.energy = Math.max(0, S.sam.energy-30);
        const ta = privateCore(a, bestSamAct(a)), tb = privateCore(b, bestSamAct(b));
        [a,b].forEach(w=>{ w.lust = clamp(w.lust-30); w.mood = clamp(w.mood+5); gainTrust(w,2); });
        samLog(`A night with ${a.name} and ${b.name}`);
        return {text:`Nobody gets much sleep. (Sam's energy −30)\n\n${ta.split('\n\n').pop()}\n${tb.split('\n\n').pop()}`, img:{wid:a.id, scene:'samact:'+bestSamAct(a)}, ai:{kind:'shared', wid:a.id, other:b.id, act:bestSamAct(a), scene:'samact:'+bestSamAct(a), forSam:true}}; }},
      {label:'"One at a time, please"', fx(){ a.mood = clamp(a.mood-1); b.mood = clamp(b.mood-1); return `They exchange a look, decide he's adorable, and agree to take turns. Sam is not sure he won anything.`; }}]};
}

    {label:'Let her go', fx(){ S.workers=S.workers.filter(x=>x!==w); addLog(`${w.name}'s contract ended.`); return `${w.name} says goodbye.`; }}]};

function agendaHTML(){
  const nm = w => `<a href="#" onclick="openSheet('${w.id}');return false">${esc(w.name.split(' ')[0])}</a>`;
  const list = (ws) => ws.map(nm).join(', ');
  const W = S.workers, lines = [];
  const waiting = W.filter(w=>has(w,'Devoted') && w.lust>=LUST_HIGH);
  const restless = W.filter(w=>!has(w,'Devoted') && w.lust>=LUST_HIGH);
  const worn = W.filter(w=>w.job!=='rest' && w.energy < maxEnergy(w)*0.3);
  const unhappy = W.filter(w=>w.mood < 25);
  const ending = W.filter(w=>!isFree(w) && !w.locked && w.contract<=2);
  const neglected = W.filter(w=>has(w,'Devoted') && (w.neglect||0) >= Math.max(1, BAL.lovers.neglectWeeks-1));
  if(waiting.length) lines.push(`💗 Waiting for Sam: ${list(waiting)}`);
  if(neglected.length) lines.push(`💔 Feeling neglected: ${list(neglected)}`);
  if(restless.length) lines.push(`🔥 Restless: ${list(restless)}`);
  if(worn.length) lines.push(`😴 Worn out: ${list(worn)}`);
  if(unhappy.length) lines.push(`😠 Unhappy: ${list(unhappy)}`);
  if(ending.length) lines.push(`📜 Contract ending: ${ending.map(w=>`${nm(w)} (${w.contract} wk)`).join(', ')}`);
  lines.push(`🧑 Sam: ${S.ap} action${S.ap===1?'':'s'} left · energy ${Math.round(S.sam.energy)}`);

function sheetScenes(w){

      ${f('c_pers','Personality',d.personality,'dl_pers')}
      <label>Clothing style<select id="c_style">${STYLES.map(s=>`<option ${s===d.style?'selected':''}>${s}</option>`).join('')}</select></label>
      ${colSel('c_fcol','Favorite color',d.favColor)}
    </div>
    <h3 style="margin-top:10px">Clothes</h3><div class="form">

      <label>Undergarments<select id="c_un">${unOpts}</select></label>${f('c_unc','Custom undergarment text',d.customUnder||'')}${colSel('c_ucol','Undergarment color',d.underColor||'white')}
    </div>
    <label class="muted" style="display:block;margin-top:8px">Backstory<textarea id="c_back">${esc(d.backstory)}</textarea></label>

    <div class="form" style="margin-top:6px">${getActs().map(a=>num('c_a_'+a.id,a.label+' skill',actSkill(d,a.id))).join('')}</div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="c_named" ${d.named?'checked':''}> Named character (★, stays in the candidate pool until hired)</label>
    <div class="row" style="margin-top:10px"><button onclick="creatorRandom()">🎲 Randomize</button><button onclick="creatorPreview()">🎨 Preview portrait</button>
      ${EDIT?`<button class="primary" onclick="creatorSaveEdit()">Save changes</button><button onclick="cancelEdit()">Cancel</button>`:`<button class="primary" onclick="creatorAdd('roster')">Add to roster</button><button onclick="creatorAdd('pool')">Add to candidates</button><button onclick="creatorAdd('lib')">Save to library</button>`}</div>
    <div id="c_img" style="max-width:360px"></div>
    ${dl('dl_sub',RACES.beastkin.subs)}${dl('dl_build',BUILDS)}${dl('dl_hs',HAIR_STYLES)}${dl('dl_hc',HAIR_COLORS)}${dl('dl_eyes',EYES)}${dl('dl_skin',SKINS.concat(DEMON_SKINS))}${dl('dl_feat',FEATURES)}${dl('dl_pers',PERSONALITIES)}
  </section>
  <section class="card"><h2>Library (${LIB.length})</h2><p class="muted">Saved characters, shared across save files. ${SET.libraryInPool?'They sometimes show up as candidates.':''}</p>

}
function readCreator(){
  const g = id => { const e=$('#'+id); return e ? e.value : ''; };
  const race = RACES[g('c_race')] ? g('c_race') : 'human', R = RACES[race];
  const w = CDRAFT ? clone(CDRAFT) : genWorker({race});
  w.race = race; w.sub = race==='beastkin' ? (cleanText(g('c_sub'))||'fox') : '';
  w.age = Math.max(R.age[0], parseInt(g('c_age'))||R.age[0]);
  w.name = cleanText(g('c_name')) || genName(race);
  w.design = {build:cleanText(g('c_build')), hairStyle:cleanText(g('c_hairStyle')), hairColor:cleanText(g('c_hairColor')), eyes:cleanText(g('c_eyes')), skin:cleanText(g('c_skin')), features:cleanText(g('c_features'))};
  w.personality = cleanText(g('c_pers')) || pick(PERSONALITIES);
  w.backstory = cleanText(g('c_back'));
  w.style = g('c_style') || w.style; w.favColor = g('c_fcol') || w.favColor;
  w.outfit = g('c_out') || w.outfit; w.customOutfit = cleanText(g('c_outc')); w.outColor = g('c_ocol') || w.outColor;
  if(w.outfit==='custom' && !w.customOutfit) w.customOutfit = 'an elegant dress';
  if(w.outfit!=='custom' && !w.owned.includes(w.outfit)) w.owned.push(w.outfit);
  w.under = g('c_un') || w.under; w.customUnder = cleanText(g('c_unc')); w.underColor = g('c_ucol') || w.underColor;
  if(w.under==='custom' && !w.customUnder) w.customUnder = 'simple lace underwear';
  if(w.under!=='custom' && !w.ownedUnder.includes(w.under)) w.ownedUnder.push(w.under);
  w._mr = 1; w.traits = [...document.querySelectorAll('.c_trait:checked')].map(x=>x.value).concat((w.traits||[]).filter(t=>TRAITS[t]&&TRAITS[t].story));
  STAT_KEYS.forEach(k=>w.stats[k]=clamp(parseInt(g('c_s_'+k))||0));
  TECH_KEYS.forEach(k=>w.tech[k]=clamp(parseInt(g('c_t_'+k))||0));
  w.popularity = clamp(parseInt(g('c_pop'))||0); w.lewd = clamp(parseInt(g('c_lewd'))||0); w.trust = clamp(parseInt(g('c_trust'))||0);
  w.fav = g('c_fav')||null; w.dislike = g('c_dis')||null; w.lovers = g('c_lov')||null;
  if(w.dislike && w.dislike===w.fav) w.dislike = null;
  ensureWorker(w);
  getActs().forEach(a=>{ const v=parseInt(g('c_a_'+a.id)); if(!isNaN(v)) w.acts[a.id].skill = clamp(v); });
  w.named = !!($('#c_named')&&$('#c_named').checked); w.keep = w.named;
  return w;
}
function creatorRandom(){ CDRAFT = genWorker(); render(); }
function creatorPreview(){ const id = CDRAFT ? CDRAFT.id : null; CDRAFT = readCreator(); if(id) CDRAFT.id = id; render(); const real = CDRAFT.id; CDRAFT.id='draft'; showImg('c_img','draft','portrait','dressed','auto').then(()=>{ if(CDRAFT) CDRAFT.id = real; }); }
function finalize(w){ w.id=uid(); w.wage=wageFor(w); w.energy=maxEnergy(w); w.mood=60; w.health=100; w.contract=12; w.job='rest'; w.seen={}; w.unhappy=0; w.privateCount=0; w.menu=[]; w.house=curH().id; delete w.key; delete w.isPartner; return w; }
function creatorAdd(dest){
  const w = finalize(readCreator());
  if(dest==='roster'){ S.workers.push(w); checkUnlocks(true); note(`${w.name} added to ${curH().name}.`); }
  else if(dest==='pool'){ w.signing = signingFor(w); w.keep = true; S.candidates.push(w); note(`${w.name} added to candidates.`); }
  else { LIB.push(w); saveLib(); note(`${w.name} saved to the library.`); }
  CDRAFT = null; save(); render();
}
function creatorSaveEdit(){
  const t = findW(EDIT.id); if(!t){ cancelEdit(); return; }
  const w = readCreator();
  ['name','race','sub','age','design','personality','backstory','traits','stats','tech','popularity','lewd','trust','named','style','fav','dislike','lovers','acts','favColor','outfit','customOutfit','outColor','under','customUnder','underColor','owned','ownedUnder'].forEach(k=>t[k]=clone(w[k]===undefined?null:w[k]));
  t.energy = Math.min(t.energy, maxEnergy(t)); t.menu = t.menu.filter(a=>canClient(t,a));
  EDIT = null; CDRAFT = null; checkUnlocks(); save(); note(`${t.name} updated. (Saved images keep their old look; regenerate them to update.)`); TAB='roster'; render();
}
function libTo(i, dest){ const w = finalize(ensureWorker(clone(LIB[i]))); if(dest==='roster'){ S.workers.push(w); checkUnlocks(true); } else { w.signing=signingFor(w); w.keep=true; S.candidates.push(w); } note(`${w.name} added to ${dest==='roster'?curH().name:'candidates'}.`); save(); render(); }
function libLoad(i){ EDIT=null; CDRAFT = ensureWorker(clone(LIB[i])); render(); }
function libDel(i){ if(!confirm(`Delete ${LIB[i].name} from the library?`)) return; LIB.splice(i,1); saveLib(); render(); }

    <div class="row"><label class="chk"><input type="checkbox" id="ai_on" ${SET.ai.on?'checked':''}> Enable AI text buttons (✨)</label>
      <label class="chk"><input type="checkbox" id="ai_auto" ${SET.ai.auto?'checked':''}> Write scenes automatically (private time, training, encounters, date invitations)</label>
      <label class="chk"><input type="checkbox" id="ai_bs" ${SET.ai.autoBackstory!==false?'checked':''}> Write backstories for generic characters automatically</label></div>

  <section class="card"><h2>Images</h2><p class="muted">Generated and uploaded images live in this browser. Export them to back up or move them to another browser.</p>
    <div class="row"><button onclick="exportImages()">⬇ Export images</button><button onclick="importImages()">⬆ Import images</button><button onclick="cleanImages()">Clean up unused images</button></div></section>
  <section class="card"><h2>Save File</h2><p class="muted">The game autosaves every week in this browser. Export to back up or move between browsers.</p>

}
function saveSettingsUI(){
  SET.style = $('#s_style').value; SET.negative = $('#s_neg').value; SET.resolution = $('#s_res').value;
  SET.autoPortrait = $('#s_auto').checked; SET.libraryInPool = $('#s_lib').checked; saveSettings(); toast('Settings saved.');
}

  SET.ai.on = $('#ai_on').checked; SET.ai.auto = $('#ai_auto').checked; SET.ai.autoBackstory = $('#ai_bs').checked;

// Older versions kept snippets/templates in the browser. They still override the data files until cleared.
function browserEdits(){
  const nz = o => Object.entries(o||{}).filter(([k,v])=>v && String(v).trim());
  const sn = nz(SET.snippets), cl = nz(SET.clothText), tp = nz(SET.ai.tpl), g = (SET.ai.guidance||'').trim(), ca = SET.customActs||[];
  const what = [sn.length&&`${sn.length} scene snippet${sn.length>1?'s':''}`, cl.length&&'clothing wording', (tp.length||g)&&'AI prompts', ca.length&&`${ca.length} custom service${ca.length>1?'s':''}`].filter(Boolean);
  return {n: sn.length + cl.length + tp.length + (g?1:0) + ca.length, what, sn, cl, tp, g, ca};
}
function exportEdits(){
  const e = browserEdits(), out = {};
  if(e.sn.length || e.cl.length) out['data/snippets.json'] = Object.assign({}, DATA.snippets, {scenes:Object.assign({}, DATA.snippets.scenes, Object.fromEntries(e.sn)), clothing:Object.assign({}, DATA.snippets.clothing, Object.fromEntries(e.cl))});
  if(e.tp.length || e.g) out['data/ai-prompts.json'] = Object.assign({}, DATA['ai-prompts'], Object.fromEntries(e.tp), e.g?{guidance:e.g}:{});
  if(e.ca.length) out['data/services.json'] = Object.assign({}, DATA.services, {services: DATA.services.services.concat(e.ca)});
  const txt = Object.entries(out).map(([k,v])=>`===== ${k} (replace the whole file) =====\n${JSON.stringify(v,null,2)}`).join('\n\n');
  modal(`<h2>Your browser edits</h2><p class="muted">Each block is the full file with your edits merged in. Paste it over that file in the repo, push, then come back and clear the browser edits.</p><textarea id="exp" style="min-height:260px">${esc(txt)}</textarea>
    <div class="row"><button class="primary" onclick="try{navigator.clipboard.writeText($('#exp').value);toast('Copied.')}catch(e){toast('Select and copy manually.')}">Copy</button><button onclick="dlText($('#exp').value,'hollowmere-browser-edits.txt')">Download file</button></div>`);
}
function clearEdits(){
  if(!confirm('Clear the snippets, clothing wording, AI prompts and custom services saved in this browser? The data files take over. Export first if you haven\'t.')) return;
  SET.snippets = {}; SET.clothText = {}; SET.ai.tpl = {}; SET.ai.guidance = ''; SET.customActs = []; saveSettings(); toast('Cleared. The data files are in charge now.'); render();
}
function exportBox(kind){
  const data = kind==='save' ? S : kind==='lib' ? LIB : {snippets:SET.snippets, clothText:SET.clothText, customActs:SET.customActs};
  modal(`<h2>Export ${kind}</h2><p class="muted">Copy this text and keep it somewhere safe.</p><textarea id="exp" style="min-height:200px">${esc(JSON.stringify(data))}</textarea>
    <div class="row"><button class="primary" onclick="try{navigator.clipboard.writeText($('#exp').value);toast('Copied.')}catch(e){toast('Select and copy manually.')}">Copy</button><button onclick="dlText($('#exp').value,'hollowmere-${kind}.json')">Download file</button></div>`);
}
function dlText(text, name){
  try{ const blob = new Blob([text],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ toast('Download blocked here. Copy the text instead.'); }
}
function importBox(kind){ modal(`<h2>Import ${kind}</h2><textarea id="imp" style="min-height:200px" placeholder="Paste exported text here"></textarea><div class="row"><button class="primary" onclick="doImport('${kind}')">Import</button></div>`); }
function doImport(kind){
  let d; try{ d = JSON.parse($('#imp').value); }catch(e){ return toast('That text isn\'t valid.'); }
  if(kind==='save'){ if(!d || !Array.isArray(d.workers)) return toast('That doesn\'t look like a save.'); S = migrate(d); SETUP=null; save(); }
  else if(kind==='lib'){ if(!Array.isArray(d)) return toast('That doesn\'t look like a library.'); LIB = d; saveLib(); }
  else { if(typeof d!=='object' || Array.isArray(d)) return toast('That doesn\'t look like snippets.');
    if(d.snippets){ SET.snippets = d.snippets; SET.clothText = d.clothText||{}; SET.customActs = d.customActs||[]; } else SET.snippets = d; saveSettings(); }
  closeModal(); toast('Imported.'); render();
}
async function exportImages(){
  const imgs = await idbAll('imgs'), thumbs = await idbAll('thumbs');
  const n = Object.keys(imgs).length; if(!n) return toast('No saved images yet.');
  dlText(JSON.stringify({imgs, thumbs}), `hollowmere-images-wk${S.week}.json`);
  toast(`Exported ${n} images.`);
}
function importImages(){
  const inp = $('#upJson'); inp.value='';
  inp.onchange = ()=>{ const f=inp.files[0]; if(!f) return; const fr=new FileReader();
    fr.onload = async ()=>{ let d; try{ d=JSON.parse(fr.result); }catch(e){ return toast('That file isn\'t valid.'); }
      let n=0; for(const [k,v] of Object.entries(d.imgs||{})){ await imgPut(k,v); n++; }
      for(const [k,v] of Object.entries(d.thumbs||{})){ await idbReq('thumbs','readwrite',s=>s.put(v,k)); THUMBS[k]=v; }
      toast(`Imported ${n} images.`); render(); };
    fr.readAsText(f); };
  inp.click();
}
async function cleanImages(){
  const keep = new Set([...S.workers, ...S.candidates, ...LIB].map(w=>w.id).concat(Object.keys(NPCS)));
  const imgs = await idbAll('imgs'); let n=0;
  for(const k of Object.keys(imgs)){ const id=k.split('|')[0]; if(!keep.has(id) && !id.startsWith('n_')){ await imgDel(k); n++; } }
  const th = await idbAll('thumbs');
  for(const k of Object.keys(th)){ if(!keep.has(k) && !k.startsWith('n_')){ await idbReq('thumbs','readwrite',s=>s.delete(k)); delete THUMBS[k]; } }
  toast(`Removed ${n} unused images.`);
}
