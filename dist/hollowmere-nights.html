<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollowmere Nights</title>
<!-- Built from github.com/Anetherin/penchant-lantern by tools/build.mjs. Lists panel: t2i = {import:text-to-image-plugin} / ai = {import:ai-text-plugin} -->
<style>
:root{--bg:#141019;--panel:#1f1826;--panel2:#2a2133;--ink:#efe6f3;--muted:#a898b3;--gold:#e6b85c;--gold2:#b8862f;--red:#e86b84;--green:#6fd39a;--blue:#6ab0ff;--pink:#e58fb8;--line:#3a2e45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--gold);margin:.2em 0 .5em;font-weight:normal}
h2{font-size:1.2em}h3{font-size:1.05em}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--gold2)}
button.primary{background:linear-gradient(#c9973d,#9c6f22);border-color:#e6b85c;color:#1b1206;font-weight:600}
button.sm{padding:3px 8px;font-size:12px}
button.on{border-color:var(--gold2);color:var(--gold);background:#3a2c1c}
button:disabled{opacity:.45;cursor:not-allowed}
textarea{width:100%;min-height:60px;resize:vertical}
input[type=number]{width:80px}
#app{max-width:1150px;margin:0 auto;padding:0 12px 90px}
header{position:sticky;top:0;z-index:5;background:rgba(20,16,25,.96);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-family:Georgia,serif;color:var(--gold);font-size:1.15em}
.hstats{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted)}.hstats b{color:var(--ink)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav button{background:transparent}nav button.on{background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.muted{color:var(--muted)}.warn{color:var(--red)}.good{color:var(--green)}.pink{color:var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px}
.wcard{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.wcard:hover{border-color:var(--gold2)}
.wcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.avatar{flex:0 0 56px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111;border:2px solid var(--gold2);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.winfo{flex:1;min-width:0}.wname{font-weight:600}
.tag{display:inline-block;font-size:.75em;padding:1px 6px;border-radius:9px;background:#3b2c18;color:var(--gold);border:1px solid var(--gold2);margin:1px 2px}
.tag.hid{background:#1b2b40;color:var(--blue);border-color:var(--blue)}
.tag.act{background:#3a1b2c;color:var(--pink);border-color:#8a4466}
.tag.guest{background:#241f3a;color:#b9a6ff;border-color:#7a66c8}
.tag.house{background:#1d2a22;color:var(--green);border-color:#3f8f6a}
.bar{position:relative;height:15px;background:#120e16;border-radius:8px;overflow:hidden;margin:3px 0;border:1px solid var(--line)}
.bar span{position:absolute;inset:0 auto 0 0;background:#6b5a7a}
.bar.e span{background:#3f8f6a}.bar.m span{background:#b8862f}.bar.t span{background:#4a7cc0}.bar.l span{background:#b54f78}.bar.h span{background:#8f3f3f}
.bar em{position:relative;font-style:normal;font-size:11px;padding-left:6px;line-height:15px}
.status{background:linear-gradient(180deg,rgba(40,80,160,.22),rgba(20,40,90,.18));border:1px solid rgba(106,176,255,.6);box-shadow:0 0 14px rgba(106,176,255,.18) inset;border-radius:10px;padding:10px 12px}
.status h3{color:var(--blue);font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:2px 12px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.sgrid div{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(106,176,255,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border:1px solid var(--gold2);border-radius:14px;max-width:580px;width:100%;padding:16px;position:relative}
.modal-box.wide{max-width:1040px}
.xbtn{position:absolute;top:8px;right:10px;background:transparent;border:none;font-size:20px;color:var(--muted)}
.sheet{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px}
@media(max-width:760px){.sheet{grid-template-columns:1fr}}
.imgbox{background:#0e0b11;border:1px solid var(--line);border-radius:10px;min-height:120px;overflow:hidden}
.imgbox iframe,.imgbox img{width:100%;border:0;display:block}
.imgph{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.imgph.small{padding:6px 10px;font-size:12px}
.prompt textarea{font-size:12px;min-height:80px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(20,16,25,.97);border-top:1px solid var(--line);padding:10px;display:flex;justify-content:center;gap:10px;z-index:6}
footer button{min-width:170px;padding:10px 16px}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#2d2238;border:1px solid var(--gold2);padding:8px 14px;border-radius:9px;box-shadow:0 4px 18px #0008;max-width:90vw}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:13px}
.form label input,.form label select{width:100%}
.chk{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;color:var(--ink)}
.chk input{width:auto}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.loglist div{border-bottom:1px solid var(--line);padding:4px 0}
.story{white-space:pre-line}
.rep-w{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.rep-w .head{display:flex;gap:10px;align-items:center}
.hl{border-left:3px solid var(--gold2);padding:4px 10px;margin:6px 0;background:rgba(0,0,0,.15)}
.hlimg{max-width:320px}
.hsel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0006;vertical-align:middle;margin-right:3px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.pick:hover{border-color:var(--gold2)}
.pick.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.bar.p span{background:#c0567a}
.agenda div{margin:2px 0}.agenda a{color:inherit;text-decoration:underline dotted}
</style>
</head>

<script>
window.PL_DATA = {"balance":{"_readme":["Tuning numbers. Change them and reload; no code needed.","solo: energyCost = share of her max energy a solo night costs; clientCap = most clients she'll see that week afterward; lustDrop = how much it lowers her lust.","lovers: neglectWeeks = weeks in a row without Sam before she feels left out (when another lover isn't); missedMood = mood lost each week she's restless and Sam doesn't see her; jealousyChance = weekly odds of that event. Shared scenes are tuned in bonds.json.","breakup: mood / trust = what ending it costs her (Loyal ladies lose half the trust); rekindleTrust = trust she needs before Sam can ask her back; rekindleChance = base odds she says yes (better if she's happy); rekindleCooldown = weeks between attempts.","lust: low = below this she turns down the heavier services; eager = she's in the mood (bonuses below); high = 'restless' (solo nights, reckless nights, lovers come looking for Sam).","lust.build: weekly gain = base + lewdness*perLewd (+eagerTrait for Eager/Exhibitionist, +resting), times her personality's lustBuild and her lustBuild fx (races, traits: data/races.json, data/traits.json).","lust.drop: how much each thing lowers it right away: private = private time with Sam, train = practicing with Sam. Client services now use the per-service 'lust' value in services.json (x technique etc.); client/fav here are the legacy fallback for services without one. Giving services, kisses and massages build lust only with Sam (with clients, only for ladies with the svcLustBuild fx, e.g. Insatiable). Lewder ladies drop less per act (dropAtLewd0 → dropAtLewd100). samRelease: Sam's private time and practice spend drop.private / drop.train x (min + (max-min) x his Technique/100).","lust.profile.floorPerLewd: her lust never falls below lewdness × this (a very lewd lady is never fully sated).","Insatiable / Slow to Warm and the race multipliers are now fx in data/traits.json and data/races.json (lustBuild, lustDrop, lustFloor, lustMax). lust.traitChance = odds a generic lady has the trait.","lust.bonus: extra mood/trust from private time with Sam when she's eager or restless (trainMult scales it for practice sessions); clientMood = mood per client service while eager.","renewal: her willingness = (trust×0.6 + mood×0.4)/100 (+loyal for Loyal ladies). At freeAt or above she re-signs for free; below that the fee scales up toward feeWeeks × her wage; below refuseBelow she's thinking of leaving and may say no. raise = size of the raise option; raiseBoost = how much it helps her willingness.","wages: contracts renew at her current going rate (wageFor, which rises with her skills and popularity). Between renewals she asks for a raise once her wage falls below askAt × her going rate (askAtAmbitious for Ambitious/Greedy).","mood: restingPoint = the mood she drifts back toward each week (drift = how fast); overworkAt = how many clients a week before she feels overworked.","income.escort: multiplier on all escort and off-duty service fees.","demolish: share = fraction of an item's base price (no inflation) it costs to demolish a built amenity, or the last bedroom / staff quarters above the house's starting count. Frees the space, lowers h.spent by the base price, never refunds. Built-in amenities can't be demolished; neither can the Bathhouse, Stage or Bar while someone holds the job that needs it.","ngplus: New Game+ (after paying off the debt). Sam always keeps his home house; his starter houses (S.starters: the first house plus the new house taken each cycle) and any house whose story is finished are kept by default but the player can surrender them on the Houses step (NGS.keep) (rooms, tier, upgrades, beds); other houses are sold for saleValue x their price (0 = surrendered), which reduces the new debt instead of adding gold. New debt = home house debt x debtShare x (1 + perCycle for each cycle after the second) + improvementsValue x improveShare (improvementsValue = gold spent on rooms, tiers, quarters, beds, annex and upgrades in all kept houses, tracked in h.spent). purse = Sam's starting gold (same as a new game; his savings stay behind; the Deep Pockets perk adds 2,500). samReset: stats = Sam keeps his level but his stats are rebuilt as sam.base + sam.perLevel x (level-1) + his past lives; appraisal = Appraisal level and XP start over (past lives such as otaku re-apply their floor). Only Devoted lovers come along (they draw wages again, stats reset: named ones to their data values, generic ones to 50%, popularity 0, trust and lewdness back to where they started: named from data, generic from when they were rolled, else baseTrust/baseLewd) and each picks one NG+ perk (traits.json ngPerk). NG+ houses (economy.json ngplus) and NG+ partners (characters.json ngplus) only appear from cycle 2; NG+ houses are bought during the cycle.Sam also takes a new house each cycle (houseOffers deeds, no premium ones; its debt x newHouseShare x (1 + perCycle for each cycle after the second) joins the new debt; its resident comes along) and may add one more past life (economy.json pasts, each once). reborn: every lady who carries over gains a stack of the Reincarnated perk (w.reborn): trust gain x (1 + trust x stacks), skill gain x (1 + skill x stacks), stat gain x (1 + stat x stacks), lewdness gain x (1 + lewd x stacks). friends: old friends: non-lover guests (guests) and generic ladies (generics) whose trust is at least trust (0-100 internal, 100 = maxed) also get a Reincarnated stack but no perk, and wait in S.alumni; each weekly candidate refresh one of them turns up among the candidates with probability chance (extra to the normal candidates, at most max at a time, and she stays until hired). The first NG+ week always shows one.","svc: per-service rules. tech* = the range of a client's technique; frustrateAt = a finishing service leaves her frustrated when technique x (her lust/60) is below this (her lust rises by frustrateLust). encore* = chance (+ her encore fx) and fee share of a reckless lady's second round. race* = enthusiast / put-off clients (data/races.json client). demon: demons don't sleep: each working week costs them hunger energy, and they gain energy per finishing service (feed, or feedReckless when restless, which costs house reputation repDrain unless the house has a Binding Sigil); with Sam she gains samGain and Sam loses samExtra more energy. android: recharge fee (fee + perEnergy x energy restored; the Charging Alcove takes chargerDiscount off). refusalMood = beastkin mood loss when Sam turns down a restless request (a Grooming Den halves it).","jobs: courtesanTh = how many points lower a courtesan's comfort lines sit; propWant = chance a client asks for a service (courtesans vs. everyone else who steps in); promoter draw = promoterBase + (charm+service)/promoterDiv clients, samples multiply it (samplesDraw) and cost samplesEnergy energy and samplesLust lust, rep change = (quality-0.5) x samplesRep; attendant: courtesans spend attendantEnergy x energy and clients are attendantSat happier; a house can have as many attendants as courtesan positions, and each courtesan with her own attendant (most popular first) gets attendantOwnMood mood and attendantOwnTrust trust a week; madame: cuts the house's mood losses to madameMoodLoss, matches clients to a fitting lady (+madameMatchSat sat), and coaches courtesans she out-ranks by madamePopGap popularity: each skill she is better at grows by madameCoach x the difference (rounded down); stepIn* = how many clients a madame/attendant takes when courtesans are swamped and the energy she needs; bar*: each bartender with a Bar adds this to the house proposition rate (barProp), rowdy chance (barRowdy) and client recklessness (barReckless); bath*: massage offers to bathers (bathShare of visitors, bathCap each); tipsBase / danceRep: dancer tips and reputation.","rooms.perRoom: room-service sessions per bedroom per week; Exhibitionist ladies don't use a room.","tidy: starting value, losses (perService room service, perVisitor), maid gain per week = (maidBase + service skill x maidPerSkill) x outfit bonus x her tidy fx, and the three effect tiers (rep per week, mood, energy recovery multiplier) at high (>=75), low (<45) and bad (<20).","rep: positive reputation changes are scaled by max(gainMin, gainBase - rep/gainDiv). Losses are not.","props: propositions. penalty/maxPenalty = main-job output lost per accepted proposition (non-must jobs). accept* = chance a non-must lady accepts (acceptBase + (lust-acceptLustMid)/100 + willing fx, +acceptEager when eager, +acceptReckless when reckless); onChance / offSlip = chance when \"Open to propositions\" is on / off-but-reckless; alt / altMust = chance of a counter-offer. attendantExpect = share of attendant propositions where the client expected her to offer (expectSat if she declines). self* = reckless ladies propositioning clients. Pushy resolution: security power vs a roll in securityRoll; else Sam (if his energy >= samEnergyMin) checks strength + charm/2 + roll(0..samRoll) >= samCheck; else none. Costs/mood effects follow. When security fails a pushy client and Sam has the energy, he is sent for and the player decides after the report (one event for the week): step in (the old samCheck roll), call the town watch (watchFee per incident, watchRep reputation each), or let her handle it (none penalties).","houseGate: ladies who come with a house (role 'house') can't trust Sam past base + perBeat x (that house's story beat) until the house story is finished (3 beats: 40 + 20 x 3 = 100). Arc beats for them wait for the story too. gap = weeks before beat 1 / 2 / 3 can start (first, later, later); retry = weeks before a beat comes back after a failed check.","wardrobe: costMult scales every outfit/underwear price (lower = easier to get clothes). eventChance = relative weight of each of the 'someone gave her an outfit' random events (data/events.json).","svc.askMore: after a service that builds her lust (giving, kissing, massages), a lady with lust >= lust.eager and lewdness >= lewd may ask the client for more (chance), offering a heavier service from her menu that spends lust; it pays fee x its normal price.","svc.demon: kissFeed = energy a demon draws from a client's kiss; kissSam (+ kissSamDraw when she's eager, costing Sam kissSamCost extra) from Sam's. restDrainChance / restRepDrain: a restless demon on her week off may drain some poor man in town (town reputation loss; a Demon Sigil doesn't help outside). studCost / studGain / studLust: Sam pays for a stud for the night (sheet button, once a week).","again: after a visit or encounter, a lady who is still worked up may want another round (chance by race, other = everyone else except spirits, + her encore fx; beastkin only need to be eager, others nearly restless). samCost = Sam's energy; mood = her mood gain (twice for beastkin). Once a week each. Ladies who come to Sam because they are restless only pick services that spend lust (releaseSamAct).","sam: Sam's house-wide actions. roundsTrust / roundsMood = what Making the rounds gives every lady (trust is 0-100 here, so 0.4 shows as 4); lessonShare = share of a one-on-one training gain that each lady in a lesson gets. base = Sam's starting stats in a new game (and the base for the NG+ rebuild); perLevel = each stat gained per level (samGainXP).","lewd: lewdness gains go through lewdUp(w, n, cap) (character.js): see its _note. Dates add their own caps (dates.json lewdCap, spicy cap).","jobs.bathJoinLewd / bathJoinFee: a bath attendant comfortable with massages and at least this lewd joins bathers in the water (bath massage, x fee), and may ask for more like anyone else.","debt: 'payments' payments every 'every' weeks from when the debt started (NG+ restarts it). Payment n = total x share_n; shares ramp linearly from 1 to 'ramp' (the last is ramp x the first) and sum to 1, so there is no balloon; the last payment clears whatever remains (penalties included). A missed payment adds penalty x its amount to the debt and carries over to the next; 'strikes' misses end the game.","clients: pickier customers as a house gets famous: satisfaction loses (effective reputation - pickFrom) x pickPer.","quarters: staff expect better lodging as the house gets famous: expected comfort = floor(house rep / repPerLevel), max 3; comfort = min(bed level, bedroom refurbishment tier). Each level short costs moodPer mood a week (not for ladies who don't sleep, nor those already on the floor).","arcs: romance arcs. need[i] = trust for beat i, gap[i] = weeks since her last beat. Extras: beat 2 needs a date or private time with Sam, dates['4'] dates for beat 4, private['5'] private times for beat 5.","ngplus.carry: share of what a carried lady (lover or old friend) gained in stats, job skills and service skills above her starting values that she keeps into the next cycle; Sam keeps the same share of his training/story stat gains. ngplus.cap: stats and skills top out at base + perCycle x (cycle-1) (ladies 1000, 1100, 1200...; Sam's 0-100 stats use a tenth of that). Trust, lewdness, mood, energy and health are unaffected.","feast: Throw a feast (house tab), once per house per week, no action. Each tier: cost per lady in that house, trust (0-100 scale, still capped by house stories) and mood each lady gets. Wording is in each tier's text.","samHome: Sam sleeps in one house (S.samHome, default his home house). His weekly recovery (weekly) and naps (nap) scale with that house's staff bed quality: x rest/ref (economy.json beds). Late-night encounters only come from ladies in his house unless he has a 'reach' upgrade or boon. samUps: things Sam can buy (Sam tab); carry = kept in New Game+; fx: bedTier (+tiers for Sam's own bed), weekly (+energy every week), reach (ladies from every house can visit him at night); tool fx (summed by samUpFx, each boosts one Sam-tab action): bartend (+share of Tend bar income), watch (+share of Stand watch security), books (extra upkeep cut, as a fraction, on top of Do the books), rounds (+share of Make the rounds trust and mood), lesson (+share of Hold a lesson skill gains), scout (+candidates from Scout recruits). Sam's Owner's Suite is a house amenity (economy.json → upgrades.suite): +1 bed tier when he sleeps in that house."],"lewd":{"_note":"Lewdness diminishing returns (lewdUp). Each source has a cap: full gain below cap-band, half at the cap, none past cap+band. Services: cap = service th + capOver. softCap: default cap for sources without one; past it only daring dates, traits and stories push her further.","band":10,"softCap":85,"lowBoostBelow":20,"lowBoost":1.3,"capOver":{"sam":25,"client":20},"stretchCap":10,"dance":50,"danceExhib":90,"bath":45},"startLewd":{"_note":"Generic ladies' starting lewdness: min + span x r^pow (r uniform 0-1). pow > 1 skews low. Race/sub mods still add on top.","min":8,"span":47,"pow":1.5},"lust":{"low":20,"high":85,"eager":60,"build":{"base":6,"perLewd":0.083,"eagerTrait":3,"resting":3},"drop":{"client":4,"fav":2,"private":22,"train":12},"samRelease":{"min":0.5,"max":1.6},"profile":{"floorPerLewd":0.16,"dropAtLewd0":1.2,"dropAtLewd100":0.8},"traitChance":{"Insatiable":0.1,"Slow to Warm":0.1},"bonus":{"eager":{"mood":4,"trust":0.5},"restless":{"mood":8,"trust":1.5},"trainMult":0.5,"clientMood":1}},"solo":{"energyCost":0.15,"clientCap":6,"lustDrop":40},"again":{"beastkin":0.6,"other":0.2,"samCost":20,"mood":3},"sam":{"roundsTrust":0.4,"roundsMood":1.5,"lessonShare":0.6,"base":{"charm":20,"business":35,"strength":15,"technique":0},"perLevel":2},"lovers":{"neglectWeeks":4,"missedMood":4,"jealousyChance":0.6},"breakup":{"mood":-20,"trust":-10,"rekindleTrust":80,"rekindleChance":0.55,"rekindleCooldown":4},"renewal":{"freeAt":0.85,"refuseBelow":0.3,"feeWeeks":6,"loyal":0.15,"raise":0.2,"raiseBoost":0.15},"wages":{"askAt":0.85,"askAtAmbitious":0.95},"mood":{"restingPoint":50,"drift":0.2,"overworkAt":4},"income":{"escort":1.25},"trust":{"_note":"Tru ll). {house} eats together for once. Nobody talks about work."},{"id":"banquet","label":"Banquet","cost":100,"trust":2,"mood":10,"text":"Roast, three kinds of pie and a cask of something sweet. The {house} staff toast Sam twice and mean it once."},{"id":"gala","label":"Grand feast","cost":200,"trust":3,"mood":16,"text":"Musicians, a hired cook and a cake taller than Sam. {house} talks about it for weeks."}]},"samHome":{"ref":42,"weekly":40,"nap":50},"samUps":{"coffee":{"label":"Otherworld Coffee Maker","cost":9000,"carry":true,"desc":"He rebuilt a drip machine from memory and two dwarven pipes. +10 energy every week.","fx":{"weekly":10}},"circle":{"label":"Teleport Circle","cost":2500,"carry":false,"desc":"A chalk circle in every house that the Credit House does not know about. Ladies from any of his houses can find Sam at night. Left behind in New Game+.","fx":{"reach":true}},"kit":{"label":"Bartender's Kit","cost":2500,"carry":true,"tool":true,"desc":"Proper shakers, a good knife, a bar towel with a history. Tend bar earns x1.3.","fx":{"bartend":0.3}},"whistle":{"label":"Watchman's Whistle","cost":2000,"carry":true,"tool":true,"desc":"Loud enough to end an argument two streets away. Stand watch gives x1.5 security.","fx":{"watch":0.5}},"ledger":{"label":"Enchanted Ledger","cost":3000,"carry":true,"tool":true,"desc":"It adds itself up and sulks when the sums are wrong. Do the books cuts upkeep a further 10 percentage points.","fx":{"books":0.1}},"notebook":{"label":"Little Black Notebook","cost":4000,"carry":true,"tool":true,"desc":"Everyone's favorite tea, birthdays and grudges, all in one place. Make the rounds gives x1.5 trust and mood.","fx":{"rounds":0.5}},"chalkboard":{"label":"Slate Chalkboard","cost":3500,"carry":true,"tool":true,"desc":"Big enough for the back row and the handouts. Hold a lesson gives x1.3 skill gains.","fx":{"lesson":0.3}},"pass":{"label":"Guild Hall Pass","cost":3000,"carry":true,"tool":true,"desc":"The clerk waves Sam straight to the good noticeboard. Scout recruits finds +1 candidate.","fx":{"scout":1}}}},"economy":{"_readme":["Jobs, houses and money. Numbers here are the main balance levers.","jobs: label, cat (rest / staff / escort), energy (weekly cost), skill (which skill she uses), needs (amenity required), room (uses a bedroom), must (must-offer role: she serves propositions from her menu and expects them; other jobs choose, see data/balance.json → props), desc. jobTrust: trust she needs for a job she doesn't particularly like. Removed jobs: companion (now courtesan), reception (now promoter).","slots: positions per house. Keys: base, amenity ids (bar, stage, guard, bath), perSize (one more per N building size), perRoom (per bedroom), min / perRooms (one per N bedrooms, at least min), as (same number as another job). A job with no entry (promoter, maid) is unlimited. Courtesans: 2 + bedrooms; attendants: one per courtesan position.","propRate / propWhere: base chance per client visit that a staff job gets propositioned, and where it happens (reports). The bar, her propRate fx and her appeal multiply it. Courtesans are asked through the normal client flow (balance.json → jobs.propWant), so their entry is 0.","classes: client classes; mult = how much they pay; wants = how much more (or less) often they ask for a service, by service id; tech = mean technique (0.3-1.4); prop = chance a visiting client of this class makes a proposition to staff; rowdy = chance of bar trouble; reckless = how reckless/forceful (adds half to pushy; a Bar adds more); pushy = chance to try to force it after hearing no.","upgrades with a \"race\" field are race houses (tether = spirits, charger = androids, chapel, sigil, grove, hearth, den). Races with \"needs\" in races.json can't be recruited into or moved to a house without that upgrade. upgrades.mood (race houses): weekly mood bonus for ladies of that race working or living in the house.","beds / floorRest: staff beds and how much they rest. amenitySize: building space each amenity takes. racePerks: shown on sheets (the effects live in data/races.json and code).","roomMult / roomNames / roomTierCost: client room tiers. prices: house price levels (mult = fee multiplier, demand = client multiplier).","houses: every house. cls = clientele weights [commoner, adventurer, merchant, noble]. npc = the named lady who comes with it (characters.json). setting = image backdrop. starter = pickable at the start; premium houses unlock with level / renown.","pasts: Sam's past lives at the start; sam = his starting stat bonuses. Other past perks (cook's free dinners, massage training bonus) are in code.","upgrades.mood (race houses): weekly mood bonus for ladies of that race working or living in the house.","hauntRep (haunted houses): reputation at which the haunting stops scaring clients off (demand ramps from 45% to 125% of normal by then; default 40).","lodging: weekly room-and-board income from travelers, x(1 + rep/50). sat: flat satisfaction bonus for every client (a welcoming house)."],"jobs":{"rest":{"label":"Rest","cat":"rest","desc":"Recover energy, health and mood."},"madame":{"label":"Madame","cat":"staff","energy":20,"skill":"manage","desc":"Runs the house: calmer moods, clients matched to the right lady, and coaching for courtesans she out-ranks in popularity and skill. Steps in for overwhelmed courtesans; can be propositioned."},"promoter":{"label":"Promoter","cat":"staff","energy":15,"skill":"service","desc":"Draws clients in. With free samples the draw is bigger, but it tires her and shows in the house's reputation. Unlimited positions."},"attendant":{"label":"Attendant","cat":"staff","energy":15,"skill":"service","desc":"Helps the courtesans (they tire less, clients are happier); a courtesan with her own attendant is happier and trusts the house more. Steps in when they are swamped. Doesn't expect propositions, though some clients expect her to offer."},"security":{"label":"Security","cat":"staff","energy":20,"skill":"combat","desc":"Walks troublemakers out and handles pushy clients. Builds trust."},"bartender":{"label":"Bartender","cat":"staff","energy":20,"skill":"bar","needs":"bar","desc":"Sells drinks. Needs a Bar. The house gets more propositions, more rowdiness and more reckless clients."},"dancer":{"label":"Dancer","cat":"staff","energy":25,"skill":"dance","needs":"stage","desc":"Draws crowds, earns tips, builds popularity. Expects propositions and serves them from her menu.","must":true},"bath":{"label":"Bath Attendant","cat":"staff","energy":12,"skill":"service","needs":"bath","desc":"Tends the bathhouse; always offers bathers a massage. Expects propositions and serves them from her menu.","must":true},"maid":{"label":"Maid","cat":"staff","energy":15,"skill":"service","desc":"Keeps the house tidy (tidiness drives reputation, mood and rest). Wears a maid uniform while on the job. Unlimited positions."},"courtesan":{"label":"Courtesan","cat":"escort","room":true,"must":true,"desc":"Offers her service menu to everyone. Lowest comfort lines, can work when not in the mood. Uses a room for services."}},"jobTrust":{"courtesan":30,"bartender":10,"promoter":10,"attendant":10,"maid":5,"security":20,"dancer":25,"bath":25,"madame":40},"slots":{"madame":{"base":1},"security":{"base":1,"guard":2},"bartender":{"base":1,"bar":1},"dancer":{"base":0,"stage":2},"bath":{"base":0,"bath":2},"courtesan":{"base":2,"perRoom":1},"attendant":{"as":"courtesan"}},"beds":[{"label":"Straw cots","rest":30,"cost":0},{"label":"Proper beds","rest":42,"cost":400},{"label":"Feather beds","rest":55,"cost":1000},{"label":"Luxury beds","rest":70,"cost":2200}],"floorRest":18,"amenitySize":{"bar":1,"stage":1,"guard":1,"bath":2,"tether":1,"charger":1,"chapel":1,"sigil":1,"grove":1,"hearth":1,"den":1,"suite":1},"racePerks":{"human":{"label":"Adaptable","desc":"Trust and skills grow 15% faster. A few clients are especially fond of her."},"elf":{"label":"Long-lived","desc":"Mood changes slowly, for better and worse."},"be
