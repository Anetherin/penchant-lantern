<!DOCTYPE html>
<html lang="en">
<head>

<!-- Built from github.com/Anetherin/penchant-lantern by tools/build.mjs. Lists panel: t2i = {import:text-to-image-plugin} / ai = {import:ai-text-plugin} -->
<style>
:root{--bg:#141019;--panel:#1f1826;--panel2:#2a2133;--ink:#efe6f3;--muted:#a898b3;--gold:#e6b85c;--gold2:#b8862f;--red:#e86b84;--green:#6fd39a;--blue:#6ab0ff;--pink:#e58fb8;--line:#3a2e45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--gold);margin:.2em 0 .5em;font-weight:normal}
h2{font-size:1.2em}h3{font-size:1.05em}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--gold2)}
button.primary{background:linear-gradient(#c9973d,#9c6f22);border-color:#e6b85c;color:#1b1206;font-weight:600}
button.sm{padding:3px 8px;font-size:12px}
button.on{border-color:var(--gold2);color:var(--gold);background:#3a2c1c}
button:disabled{opacity:.45;cursor:not-allowed}
textarea{width:100%;min-height:60px;resize:vertical}
input[type=number]{width:80px}
#app{max-width:1150px;margin:0 auto;padding:0 12px 90px}
header{position:sticky;top:0;z-index:5;background:rgba(20,16,25,.96);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-family:Georgia,serif;color:var(--gold);font-size:1.15em}
.hstats{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted)}.hstats b{color:var(--ink)}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
nav button{background:transparent}nav button.on{background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.muted{color:var(--muted)}.warn{color:var(--red)}.good{color:var(--green)}.pink{color:var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px}
.wcard{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.wcard:hover{border-color:var(--gold2)}
.wcard.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.avatar{flex:0 0 56px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111;border:2px solid var(--gold2);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.winfo{flex:1;min-width:0}.wname{font-weight:600}
.tag{display:inline-block;font-size:.75em;padding:1px 6px;border-radius:9px;background:#3b2c18;color:var(--gold);border:1px solid var(--gold2);margin:1px 2px}
.tag.hid{background:#1b2b40;color:var(--blue);border-color:var(--blue)}
.tag.act{background:#3a1b2c;color:var(--pink);border-color:#8a4466}
.tag.house{background:#1d2a22;color:var(--green);border-color:#3f8f6a}
.bar{position:relative;height:15px;background:#120e16;border-radius:8px;overflow:hidden;margin:3px 0;border:1px solid var(--line)}
.bar span{position:absolute;inset:0 auto 0 0;background:#6b5a7a}
.bar.e span{background:#3f8f6a}.bar.m span{background:#b8862f}.bar.t span{background:#4a7cc0}.bar.l span{background:#b54f78}.bar.h span{background:#8f3f3f}
.bar em{position:relative;font-style:normal;font-size:11px;padding-left:6px;line-height:15px}
.status{background:linear-gradient(180deg,rgba(40,80,160,.22),rgba(20,40,90,.18));border:1px solid rgba(106,176,255,.6);box-shadow:0 0 14px rgba(106,176,255,.18) inset;border-radius:10px;padding:10px 12px}
.status h3{color:var(--blue);font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:2px 12px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.sgrid div{display:flex;justify-content:space-between;border-bottom:1px dotted rgba(106,176,255,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border:1px solid var(--gold2);border-radius:14px;max-width:580px;width:100%;padding:16px;position:relative}
.modal-box.wide{max-width:1040px}
.xbtn{position:absolute;top:8px;right:10px;background:transparent;border:none;font-size:20px;color:var(--muted)}
.sheet{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px}
@media(max-width:760px){.sheet{grid-template-columns:1fr}}
.imgbox{background:#0e0b11;border:1px solid var(--line);border-radius:10px;min-height:120px;overflow:hidden}
.imgbox iframe,.imgbox img{width:100%;border:0;display:block}
.imgph{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.imgph.small{padding:6px 10px;font-size:12px}
.prompt textarea{font-size:12px;min-height:80px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(20,16,25,.97);border-top:1px solid var(--line);padding:10px;display:flex;justify-content:center;gap:10px;z-index:6}
footer button{min-width:170px;padding:10px 16px}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#2d2238;border:1px solid var(--gold2);padding:8px 14px;border-radius:9px;box-shadow:0 4px 18px #0008;max-width:90vw}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}
.form label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:13px}
.form label input,.form label select{width:100%}
.chk{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;color:var(--ink)}
.chk input{width:auto}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.loglist div{border-bottom:1px solid var(--line);padding:4px 0}
.story{white-space:pre-line}
.rep-w{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.rep-w .head{display:flex;gap:10px;align-items:center}
.hl{border-left:3px solid var(--gold2);padding:4px 10px;margin:6px 0;background:rgba(0,0,0,.15)}
.hlimg{max-width:320px}
.hsel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0006;vertical-align:middle;margin-right:3px}
.pick{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.pick:hover{border-color:var(--gold2)}
.pick.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.bar.p span{background:#c0567a}
.agenda div{margin:2px 0}.agenda a{color:inherit;text-decoration:underline dotted}
</style>
</head>

ine. \"Back in my party, nobody ever had my back. Then this skinny guy in a hoodie jumps in front of a goblin for me.\" She bumps his shoulder. \"Idiot.\" She doesn't move away.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Wrong Door","scene":"shower","text":"Sam opens the washroom door and finds Kaede mid-towel, every hair on her tail standing straight up.","choices":[{"label":"Apologize and bolt","t":1,"m":-2,"res":"Kaede laughs about it for ten straight minutes. Through the door. Loudly."},{"label":"Compliment her","if":{"lewd":40},"t":2,"m":6,"l":3,"res":"She grins, not bothering with the towel very hard. \"Smooth, boss.\"","else":{"t":-2,"m":-4,"res":"\"GET OUT.\" The towel hits him in the face."}},{"label":"Stand there like an idiot","m":3,"l":2,"res":"\"Take a picture, it lasts longer.\" Sam has no idea how she knows that phrase."}]},{"title":"Getting Closer","scene":"casual","text":"Kaede shows up at Sam's door with a bandaged hand and a grin, from sparring \"for fun.\" While he patches her up, her tail keeps brushing his arm. Neither of them mentions it.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"The Old Party","scene":"portrait","text":"Kaede's old party leader turns up at the bar: a new contract, a deep dungeon, and a spot for her if she wants it. Kaede looks at Sam and waits.","choices":[{"label":"\"Go, if it's what you want.\"","t":4,"m":-4,"res":"She stays. Later she grumbles: \"You weren't supposed to make it easy.\""},{"label":"\"Stay. Please.\"","t":6,"m":6,"res":"Kaede turns the leader down without even looking at him."},{"label":"Say nothing","t":-6,"m":-10,"res":"She leaves for two days without a word. When she comes back, she doesn't mention it. Neither does he. It sits between them for a while."}]},{"title":"Rooftops","scene":"sam_date","text":"Kaede teaches Sam to run the rooftops of Hollowmere at night. He is very, very bad at it.","choices":[{"label":"Keep trying","sam":{"strength":1},"t":3,"m":6,"res":"By the end of the night he makes one jump cleanly. She cheers loud enough to wake the street."},{"label":"Fake a sprained ankle so she carries you","m":8,"l":2,"res":"She sees right through it. She carries him anyway, the whole way home."}]},{"title":"Together","scene":"final","text":"After closing, Kaede corners Sam in the kitchen. \"I'm bad at this, so I'll just say it. I'm not going anywhere. Not for the money. For you.\" Her ears are bright red. She takes his hand and leads him upstairs, and the door closes behind them.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"yui":[{"title":"Opening Up","scene":"sam_date","text":"Yui finds Sam on the back steps with two cups of something that is almost, but not quite, coffee. They talk about home for hours: trains, convenience stores, the vending machine on the 4th floor. She cries a little. So does he.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Bath Time Budget Meeting","scene":"walkin","text":"Hunting for the ledger, Yui walks straight into the washroom while Sam is in the tub. She does not leave. She stares fixedly at the ceiling. Then the floor. Then the ceiling again.","choices":[{"label":"\"Could you pass me a towel?\"","t":2,"m":3,"res":"She throws it directly at his face and flees."},{"label":"Act completely casual","m":5,"l":2,"res":"She stammers through the entire weekly budget review, right there, without once looking down. It's honestly impressive."},{"label":"Yell","t":-2,"m":-3,"res":"She flees, mortified, and avoids him for three days."}]},{"title":"Getting Closer","scene":"casual","text":"Yui reveals she's been \"recreating\" instant ramen in the kitchen for a month. It is terrible. They eat all of it. \"Remember when you covered my shift that time?\" she asks. \"I liked you before the truck, you know.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"The Way Home","scene":"portrait","text":"A traveling mage claims he can send otherworlders home. Yui shows Sam the flyer with shaking hands. \"If it's real... would you go?\"","choices":[{"label":"\"I'd stay. This is home now.\"","t":5,"m":5,"res":"She lets out a breath she's been holding for a week."},{"label":"\"I don't know.\"","t":-3,"m":-8,"res":"Honest. It still hurts. She nods and doesn't bring it up again."},{"label":"\"Only if you came with me.\"","t":7,"m":8,"res":"She laughs and wipes her eyes. (The mage turns out to be a fraud. Neither of them is disappointed.)"}]},{"title":"Festival Night","scene":"sam_date","text":"Yui drags Sam to the harvest festival and wins him a prize at the ring toss: a deeply ugly stuffed wyvern. She insists he carry it all night.","choices":[{"label":"Wear it like a hat, proudly","m":9,"t":2,"res":"She laughs so hard she has to sit down."},{"label":"Win her one back","t":3,"m":6,"res":"It takes eleven tries. She keeps the slightly-less-ugly griffin on her desk forever."}]},{"title":"Together","scene":"final","text":"Yui takes Sam's hand under the table during the staff meeting and doesn't let go. Afterward, in the empty office: \"Second life. Second chance. I'm not wasting this one being shy.\" She kisses him, and pulls him toward her room.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"nerys":[{"title":"Opening Up","scen ght market and buys him every cursed snack she can find.","choices":[{"label":"Eat everything she hands you","m":9,"t":2,"res":"One of them makes his ears glow for an hour. She has never been happier."},{"label":"Buy her a hair ribbon","t":4,"m":6,"res":"She acts unimpressed. She wears it every day after."}]},{"title":"Together","scene":"final","text":"A demon scholar offers to dissolve the contract. Nerys tears up his paperwork in front of him. \"I'll keep it,\" she tells Sam afterward, looking anywhere but at him. \"I've grown... attached.\" Then she looks at him, and stops pretending.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"elowen":[{"title":"Opening Up","scene":"sam_date","text":"Elowen insists on a \"check-up\" and spends most of it nervously talking about herbs. At the end she admits she's never been this far from home, and that Sam makes it feel less far.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Tea Service","scene":"walkin","text":"Elowen brings herbal tea to Sam's room at exactly the moment he's changing. The tray hits the floor.","choices":[{"label":"Laugh it off","t":3,"m":4,"res":"She laughs too, eventually, from behind both hands."},{"label":"Apologize profusely","t":2,"m":1,"res":"They both apologize to each other for ten minutes."},{"label":"\"You're a healer. You've seen it all, right?\"","if":{"lewd":30},"m":4,"l":3,"res":"\"Not... all,\" she says faintly.","else":{"m":-4,"l":2,"res":"She turns red to the tips of her ears and mutters something about anatomy textbooks."}}]},{"title":"Getting Closer","scene":"casual","text":"They go flower-picking outside the walls \"for medicine.\" Elowen makes him a flower crown. He makes a terrible one back. She wears it all day.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Burnout","scene":"portrait","text":"Elowen has been healing the dock workers for free, every night, for weeks. Today she collapses in the kitchen.","choices":[{"label":"Scold her","t":-4,"m":-6,"res":"She cries. Not because he's wrong."},{"label":"Take care of her for a day","energy":"full","t":7,"m":8,"res":"Sam makes soup (badly), reads to her (badly), and doesn't leave her side. She sleeps for fourteen hours."},{"label":"Fund a free clinic night (150g)","gold":-150,"t":6,"m":10,"res":"One night a week, with help. She hugs him so hard his ribs creak.","cantAfford":{"t":2,"m":2,"res":"You can't afford it. She thanks you for trying."}}]},{"title":"Starlight","scene":"sam_date","text":"Elowen takes Sam to a hill outside town and names the constellations of her homeland, one by one.","choices":[{"label":"Listen to every single one","t":4,"m":7,"res":"There are a lot of them. He doesn't mind."},{"label":"Make up a constellation for her","t":3,"m":8,"res":"\"The Clumsy Healer.\" She shoves him. She uses the name forever."}]},{"title":"Together","scene":"final","text":"Elowen kisses Sam first, very quickly, then hides her face in his shirt. \"Elves live a long time,\" she mumbles. \"I'd like to spend some of it with you.\" She doesn't let go of his hand all the way to her room.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"adelheid":[{"title":"Opening Up","scene":"sam_date","text":"Adelheid insists on tasting all of Sam's food for poison. Every meal. She eventually admits she has started looking forward to dinner time.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Rain Barrel","scene":"shower","text":"Sam cuts through the training yard and finds Adelheid washing off after practice at the rain barrel. She snaps to attention. With the hand holding the towel.","choices":[{"label":"Turn around immediately","t":3,"m":2,"res":"\"Thank you, my lord,\" she says, in a very small voice."},{"label":"Salute back","m":6,"t":1,"res":"She laughs: a real, startled laugh, the first he's ever heard from her."},{"label":"Stammer helplessly","m":3,"l":1,"res":"They stand there stammering at each other until a goose interrupts."}]},{"title":"Getting Closer","scene":"casual","text":"Sam finds Adelheid's secret stash of romance novels. Every one is about a knight and her lord. She threatens him with her sword. Then asks, very quietly, if he's read the third one.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"The Report","scene":"portrait","text":"The Order demands Adelheid report on \"the sinful nature\" of Sam's business. She's been staring at a blank page for three hours.","choices":[{"label":"\"Tell them the truth.\"","t":6,"m":3,"res":"She writes three pages: fair wages, rest days, no one here against her will. She reads them twice and seals them with pride."},{"label":"\"Could you... leave some things out?\"","t":-8,"m":-10,"res":"Her face goes hard. \"I will not lie, my lord. Not even for you.\" It's a long, cold week."},{"label":"Go to the Order with her","t":8,"m":5,"res":"Sam answers their questions himself, politely, for four hours. Adelheid stands beside him the entire time."}]},{"title":"Swordplay","scene":"sam_training","text":"Adelheid decides her lord must be able to defend himself, and hands Sam a practice sword.","choices":[{"label":"Practice until you drop","sam":{"strength":2},"t":3,"m":6,"res":"He drops. Twice. She is quietly, enormously proud."},{"label":"Let her win on purpose","m":-3,"res":"She knows. She hates that. \"Again, and properly this time.\""}]},{"title":"Together","scene":"final","text":"Adelheid kneels to renew her oath, then stays kneeling. \"My oath was to serve you. I would like to amend it.\" She takes his hand. \"To stand beside you.\" She rises, and doesn't let go.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"marisol":[{"title":"Opening Up","scene":"sam_date","text":"Marisol shows Sam her father's old ledgers and her own corrections in the margins, years of them. \"He never listened. You actually do.\" It sounds like an accusation. It isn't.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Invoice Ambush","scene":"walkin","text":"Marisol barges into the washroom mid-argument about invoices, sees Sam in the tub, and keeps arguing.","choices":[{"label":"Argue back from the tub","m":6,"t":2,"res":"He wins, for once. She claims it doesn't count."},{"label":"Ask for some privacy","t":1,"res":"She rolls her eyes, leaves the invoice on the stool, and shuts the door. Firmly."},{"label":"Splash her","m":8,"l":2,"res":"War is declared. The washroom floods. Mira is not amused."}]},{"title":"Getting Closer","scene":"casual","text":"Marisol beats Sam at cards four times in a row, then lets him win once, badly. \"I wanted to see your face,\" she says, and laughs until she can't breathe.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"A Letter","scene":"portrait","text":"A letter arrives from Marisol's father. He's alive, across the sea, and in debt again. She wants to sell something, anything, to bail him out.","choices":[{"label":"\"No. He left you with all of this.\"","t":-5,"m":-8,"res":"\"He's not YOUR father.\" She slams the door. She apologizes the next day; so does he."},{"label":"Send him 300g","gold":-300,"t":8,"m":6,"res":"She stares at the coins for a long time. \"You didn't have to.\" \"I know.\"","cantAfford":{"t":2,"m":-2,"res":"You can't spare it. She understands. Mostly."}},{"label":"Help her write back","t":5,"m":3,"res":"It takes all night. The letter says no, kindly. She sleeps better than she has in years."}]},{"title":"Her Mother","scene":"sam_date","text":"Marisol takes Sam to a small grave on the hill above town. Her mother's. She doesn't say much.","choices":[{"label":"Bring flowers","t":4,"m":6,"res":"She tells him three stories about her mother on the walk back. She has never told anyone."},{"label":"Just stand with her","t":5,"m":4,"res":"After a while she leans against his shoulder."}]},{"title":"Together","scene":"final","text":"Marisol tears the old deed in half and writes a new one with both their names. \"Partners,\" she says. \"In every sense. Don't make me say it twice.\" Then she kisses him, and says nothing else for a long while.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"natsuki":[{"title":"Opening Up","scene":"sam_date","text":"Natsuki shows Sam the scar she got her first week here, three years ago, alone. \"I kept thinking: if Sam were here, he'd do something dumb and it'd somehow be fine.\" She laughs. \"Then you showed up and did something dumb.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Incoming","scene":"shower","text":"Sam walks into the washroom. Natsuki is in the bath. A bar of soap is already in the air at adventurer speed.","choices":[{"label":"Duck","m":4,"res":"He doesn't duck fast enough. She feels terrible. She laughs anyway."},{"label":"Take it like a man","t":2,"m":6,"res":"Direct hit. \"Nice reflexes, hero,\" she says, sinking up to her nose in the water."},{"label":"Apologize through the door","t":2,"res":"\"Knock next time, idiot!\" She sounds like she's grinning."}]},{"title":"Getting Closer","scene":"casual","text":"They find a stall selling something almost like taiyaki. Natsuki buys ten. Halfway through the fifth she goes quiet. \"Back home I always figured I'd end up with you someday. Dumb, right?\" She doesn't look at him.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Solo Run","scene":"portrait","text":"Natsuki took a dangerous dungeon contract without telling anyone. She comes back three days later with a broken arm and a sack of gold.","choices":[{"label":"Yell at her","t":-4,"m":-8,"res":"\"You don't get to disappear on me twice!\" It comes out wrong. They don't talk for a while."},{"label":"Patch her up, quietly","health":20,"t":6,"m":6,"res":"He doesn't say anything. He doesn't have to. She leans her head against his."},{"label":"Make her promise","t":4,"m":2,"res":"\"Next time, you come with me,\" she says. \"Deal?\""}]},{"title":"Fireworks","scene":"sam_date","text":"Natsuki bribes an alchemist to make fireworks \"like the summer festival back home.\" They watch from the town wall.","choices":[{"label":"Hold her hand","t":4,"m":8,"res":"Her hand is shaking. Then it isn't."},{"label":"Tell her you missed her, all three years","t":6,"m":6,"res":"She punches his arm. Then she cries. Then she laughs."}]},{"title":"Together","scene":"final","text":"Natsuki kicks Sam's door open at dawn, red-faced, sword still on her hip. \"I spent three years here thinking I'd never see you again. I'm not wasting another day.\" She kicks the door shut behind her.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"kanako":[{"title":"Opening Up","scene":"sam_date","text":"Kanako ruffles Sam's hair and calls him \"Sammy\" in front of the whole staff. Again. Later she finds him on the back steps. \"You've grown up a lot, haven't you? When did that happen?\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Shampoo","scene":"walkin","text":"Kanako walks in on Sam in the bath, doesn't blink, sets the shampoo on the edge of the tub, and keeps chatting about the bar schedule, like it's nothing.","choices":[{"label":"Insist she leave","t":2,"res":"\"So shy!\" she giggles, and goes."},{"label":"Act just as casual","m":5,"l":2,"res":"She falters. Just a little. Her eyes flick down, then away. Interesting."},{"label":"\"I'm a grown man, Kanako.\"","t":3,"m":-2,"res":"She stops mid-sentence. Looks at him. Leaves without a word."}]},{"title":"Getting Closer","scene":"casual","text":"A drunk client gets grabby with Kanako and Sam steps in without thinking. Afterward she's quiet for a long time. \"Since when do you protect me?\" She doesn't ruffle his hair. She just looks at him, like she's seeing him for the first time.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Matchmaker","scene":"portrait","text":"Kanako has found Sam \"a nice girl\" and set up a dinner. She's very proud of herself.","choices":[{"label":"Go on the date to make her happy","t":-3,"m":-6,"res":"She asks how it went. Twice. She doesn't seem happy with either answer."},{"label":"\"It's always been you. You know that.\"","t":5,"m":-4,"res":"Kanako opens her mouth, closes it, and leaves. She doesn't sleep that night. Neither does he."},{"label":"Politely refuse","t":2,"res":"\"You're impossible,\" she sighs. She looks relieved."}]},{"title":"Last Call","scene":"sam_date","text":"Kanako finds a bar that's almost like a snack bar back home and takes Sam there, just the two of them. There's a lute, and a very drunk bard willing to lend it.","choices":[{"label":"Sing, badly","m":9,"t":3,"res":"She joins in. They are both terrible. It's the best night either of them has had in this world."},{"label":"Ask her to sing","t":4,"m":6,"res":"Her voice is soft. She sings the whole song looking at him."}]},{"title":"Together","scene":"final","text":"Kanako corners Sam in the kitchen, flustered for once in her life. \"I spent six years telling myself you were the boy next door. You're not. You haven't been for a long time.\" She kisses him, laughs at her own blush, and kisses him again.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"mio":[{"title":"Opening Up","scene":"sam_date","text":"Mio admits she followed Sam and her brother to the crosswalk that day just to say hi. \"So technically, the truck is your fault.\" She grins. \"I forgive you.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"What a Coincidence","scene":"shower","text":"Mio is in the bath. She is obviously waiting. \"Oh no. Sam. You've caught me. What a coincidence.\"","choices":[{"label":"Leave","t":1,"m":-4,"res":"\"Coward!\" she yells after him."},{"label":"\"You're Kenta's sister.\"","t":-2,"m":-6,"res":"\"I KNOW whose sister I am.\" A sponge hits the door as it closes."},{"label":"Laugh","m":5,"t":2,"res":"She tries to stay offended. She can't."}]},{"title":"Getting Closer","scene":"casual","text":"Mio insists on trying every job in the house and is bad at all of them. She is completely undeterred. \"I'm going to be useful to you. Watch me.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}]},{"title":"Useless","scene":"portrait","text":"A client complains about Mio. Loudly. Later Sam finds her crying in the linen closet. \"I'm useless. I'm just the kid sister who followed you here.\"","choices":[{"label":"\"You don't have to do this. You can quit.\"","t":-6,"m":-10,"res":"\"That's not what I wanted you to say.\" She doesn't come out for an hour."},{"label":"Train her yourself","grow":{"service":6},"t":6,"m":6,"res":"Every evening for a week. She gets better. She gets a lot better."},{"label":"Tell her about your own failures","t":5,"m":8,"res":"He has many. By the end she's laughing through her tears."}]},{"title":"Drama Date","scene":"sam_date","text":"Mio demands a \"proper date, like in the dramas\": umbrella in the rain, a dramatic run to the station (there is no station), the works.","choices":[{"label":"Commit to every cliché","m":10,"t":3,"res":"He even trips into her arms at the end. On purpose. She nearly dies of happiness."},{"label":"Do it your own way","t":4,"m":5,"res":"A walk, a bakery, a quiet bench. \"...Okay,\" she admits. \"This is better.\""}]},{"title":"Together","scene":"final","text":"Mio climbs onto the roof where Sam is hiding from paperwork. \"I've had a crush on you for years, and I'm done keeping it to myself. I'm a grown woman and I know what I want. It's you.\" This time, Sam doesn't climb down.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}]},"regulars":{"_readme":["Regular clients: named men who keep coming back to a house, usually for one favorite lady.","A good visit can turn a client into a regular (up to max per house). Each regular visits most weeks, asks for his favorite, and pays with his quirk's tip multiplier. Bad visits wear his loyalty down until he stops coming.","quirks: label and desc show in the Houses tab. tip multiplies what he pays. drama = chance per week of his quirk's event (text in events below).","events: {name} = the lady, {regular} = his name, {house} = the house, {gold} = money involved. Choice logic is in js/events/regulars.js; the words are all here."],"maxPerHouse":4,"visitChance":0.6,"names":{"first":["Bertram","Osric","Tobias","Edmund","Hollis","Garrick","Lucan","Ambrose","Fenwick","Rowan","Silas","Corwin","Dorian","Alaric","Percival","Wendel","Matthias","Leopold","Cassian","Tamsin"],"last":["Hale","Marsh","Crane","Ashby","Pell","Wren","Fairweather","Thorne","Vane","Holloway","Bramble","Quill","Stroud","Kettering","Lark"]},"quirks":{"generous":{"label":"Generous","desc":"Tips well and brings gifts.","tip":1.35,"drama":0.12},"jealous":{"label":"Jealous","desc":"Hates sharing his favorite.","tip":1.15,"drama":0.18},"lingering":{"label":"Lingers","desc":"Never wants the night to end.","tip":1,"drama":0.15},"smitten":{"label":"Smitten","desc":"Has fallen for his favorite. Might try to take her away.","tip":1.2,"drama":0.08},"talker":{"label":"Talker","desc":"Mostly comes for conversation, and tells everyone about the house.","tip":1,"drama":0.1},"shy":{"label":"Shy","desc":"Took him weeks to say hello. Very loyal once he does.","tip":1.1,"drama":0}},"events":{"new":["{regular} keeps asking for {name}. Looks like he's a regular now."],"generous":{"title":"A Gift for {name}","text":["{regular} arrived with a velvet box for {name}: a bracelet worth at least {gold}. She's turning it over in her hands, delighted and a little unsure."],"keep":"She keeps it. She hasn't stopped smiling.","split":"She hands it to Sam to sell for the house, a little wistfully. +{gold}."},"jealous":{"title":"{regular} Wants {name} to Himself","text":["{regular} saw {name} going upstairs with someone else, and he's at the front desk, red in the face. He wants her to see no one else on his nights, and he'll pay for it."],"pay":"He pays {gold} for his nights to be hers alone. {name} rolls her eyes but takes the money.","refuse":"Sam tells him {name} isn't anyone's property. {regular} storms out. He may not come back.","calm":"{name} talks him down herself, sweetly. He leaves soothed, and she leaves tired."},"lingering":{"title":"{regular} Won't Leave","text":["It's past dawn and {regular} is still in {name}'s room, talking about his mother."],"charge":"Sam bills him for the whole night. He pays {gold} without blinking. {name} is exhausted.","escort":"Security walks him out, politely. He's embarrassed, and a little hurt.","letit":"Sam lets it go. {name} gets no sleep, but {regular} tips extra out of guilt."},"smitten":{"title":"{regular} Proposes","text":["{regular} has offered to buy out {name}'s contract and marry her. He's put {gold} on the table and is waiting for an answer."],"stays":"{name} looks at the money, then at Sam, and gently tells {regular} no. She's staying.","goes":"{name} hesitates a long time, then says yes. She leaves with {regular}, and the house keeps the {gold}.","refuse":"Sam refuses the offer outright. {regular} leaves, heartbroken. {name} looks relieved, and a little annoyed nobody asked her."},"talker":{"title":"{regular} Spreads the Word","text":["{regular} has been telling everyone in town about {house}, and about {name} in particular. A few new faces have turned up asking for her."],"thanks":"Sam stands him a drink. Reputation +2."}}},"snippets":{"_readme":["Your own text, appended to the image prompt for that scene. Empty = default prompt only.","scenes: act_<serviceId> for each service, pov (every Sam/POV scene), bath, mishap (shower / walk-in), solo (a lady alone in her room at max lust).","clothing: how each clothing state is described. {outfit} and {underwear} are filled in from her wardrobe; commando becomes \"bare skin, nothing underneath\". nude falls back to partial while empty.","clothing.aside / aside_commando: used for Modest ladies during services, when her clothes are pulled aside instead of taken off."],"scenes":{"act_caress":"","act_manual":"","act_oral":"","act_paizuri":"","act_missionary":"","act_cowgirl":"","act_doggy":"","pov":"","bath":"","mishap":"","solo":""},"clothing":{"dressed":"wearing {outfit}","partial":"wearing {outfit}, partially undressed, clothes loosened and slipping off to show {underwear}","under":"wearing only {underwear}","nude":"","aside":"still wearing {outfit}, her clothes pulled aside rather than taken off, {underwear} pushed aside","aside_commando":"still wearing {outfit}, her clothes pulled aside rather than taken off, nothing underneath"}},"ai-prompts":{"_readme":["AI text prompts (sent to Perchance's ai-text-plugin). The game fills in the {placeholders} and sends the result as the instruction.","Placeholders: {name} {race} {age} {appearance} {clothing} {outfit} {personality} {traits} {trust} {lewd} {mood} {service} {stance} {client} {setting} {house} {relationship} {guidance} {hook} {backstory} {date} {situation} {lust} {other} {otherDesc}","{other} / {otherDesc}: the second lady in scenes with two of them (shared). guidance is inserted wherever {guidance} appears: tone, length, how descriptive, etc.","Which prompt is used where: scene (client highlights), private (private time), train, proposition (date invitations), encounter (visits, lovers waiting), reckless, shared (two lovers with Sam), breakup, backstory."],"guidance":"","scene":"Write a short scene (about 120 words, third person, past tense) for a fantasy isekai pleasure-house game. {name} is a {race} working at {house}: {appearance}. She is wearing {clothing}. Personality: {personality}. Her client: {client}. Service: {service}, which is {stance}. Setting: {setting}. {guidance} All characters are consenting adults. Output only the scene.","private":"Write a short scene (about 150 words, third person, past tense) for a 'use strict';
/* =====================================================================

   role: 'house' (comes with a house), 'partner' (starter choice / recruitable), 'story', 'guild', 'drifter' (turns up among candidates)
   ===================================================================== */
// Named characters live in data/characters.json.
const NAMED = Object.fromEntries(Object.entries(noMeta(needData('characters'))).map(([k,c])=>{ const {outfits, ...rest} = c; return [k, rest]; }));
const PARTNERS = Object.keys(NAMED).filter(k=>NAMED[k].role==='partner');
/* ARCS: partner romance arcs, loaded from data/arcs.json in js/stories/partners.js. */
let ARCS;

/* ---- js/logic/character.js ---- */
'use strict';
/* =====================================================================
   CHARACTER LOGIC
   ===================================================================== */
const maxEnergy = w => Math.round(60 + w.stats.stamina*0.6 + (has(w,'Tough')?20:0) + (w.race==='dwarf'?25:0));
// Energy per client: depends on the service, her stamina, and how she feels about it.
function actCost(w, act){
  let c = act ? ((actById(act)||{}).energy || 10) : 5;
  c *= 1.2 - w.stats.stamina/250;
  if(act){ if(w.fav===act) c *= 0.75; if(w.dislike===act) c *= 1.35; if(clientStance(w,act)==='ask') c *= 1.25; }
  if(w.race==='demon') c *= 0.5;
  return Math.max(1, c);
}
const clientCost = w => actCost(w, null) * 1.8;
const appeal = w => w.stats.beauty*0.4 + w.stats.charm*0.3 + w.popularity*0.5;
const lewdMult = w => (has(w,'Shy') ? 0.5 : has(w,'Eager') ? 1.25 : 1) * (w.race==='beastkin'?1.15:1) * ((PERS[w.personality]||{}).lewd || 1) * ((S && HOUSES[(houseOf(w)||{}).id]||{}).lewdBoost || 1);
const isFree = w => !!(w.isPartner || w.free);
// Trust from Sam's attention: personality, race, and diminishing returns near the top.
function gainTrust(w, n){ const g = n * pTrust(w) * (w.race==='human'?1.15:1) * (n>0 ? Math.max(0.15, 1 - w.trust/140) : 1); w.trust = clamp(w.trust + g); return g; }
const moodMod = w => (w.mood-50)/10;
// CONSENT MODEL
// inclination = her own appetite for a service (lewdness + likes + mood). That decides what she enjoys.
// Up to 25 below a service's line, she'll do it because Sam asked, if she trusts him enough (costs mood).
// Further below that is a line she won't cross, whatever her trust.
const ASK_BAND = 25;
function inclination(w,id){ return w.lewd + comfortOf(w,id) + (has(w,'Eager')?8:0) - (has(w,'Shy')?5:0) + moodMod(w); }
const trustNeed = gap => Math.round(40 + gap*2);
function clientStance(w,id){
  const a = actById(id); if(!a) return 'no';
  const inc = inclination(w,id) - (w.lovers===id ? 30 : 0);
  if(inc >= a.th) return 'yes';
  if(inc >= a.th - ASK_BAND && w.trust >= trustNeed(a.th - inc)) return 'ask';
  return 'no';
}
function samLean(w,id){ return inclination(w,id) + w.trust*0.3 + (w.lovers===id && w.trust>=40 ? 15 : 0) + (has(w,'Devoted')?20:0) - (has(w,'Oblivious')?45:0); }
function samStance(w,id){
  const a = actById(id); if(!a) return 'no';
  if(has(w,'Oblivious') && id!=='caress') return 'no';
  const inc = samLean(w,id);
  if(inc >= a.th) return 'yes';
  if(inc >= a.th - ASK_BAND && w.trust >= trustNeed(a.th - inc) - 10) return 'ask';
  return 'no';
}
function comfortOf(w,id){ const a = w.acts&&w.acts[id]; return (a?a.comfort:0) + (w.fav===id?10:0) - (w.dislike===id?15:0); }
const canClient = (w,id) => clientStance(w,id) !== 'no';
const canSam = (w,id) => samStance(w,id) !== 'no';
const STANCE = {yes:'<span class="good" title="She enjoys this">✓</span>', ask:'<span class="pink" title="She\'ll do it because she trusts Sam, but it costs her mood">~</span>', no:'<span class="muted" title="A line she won\'t cross yet">✗</span>'};
const actSkill = (w,id) => (w.acts&&w.acts[id]) ? w.acts[id].skill : 0;

/* ---------- wardrobe logic ---------- */
function getOutfit(w){ if(w.outfit==='custom') return {label:'Her own outfit', style:w.style, prompt:w.customOutfit||'an elegant dress', bonus:{}, custom:true}; return WARDROBE[w.outfit] || BASE_OUTFITS.b_corset; }
function getUnder(w){ if(w.under==='custom') return {label:'Custom', prompt:w.customUnder||'simple lace underwear', bonus:{}, style:w.style}; return UNDER[w.under] || UNDER.plain; }
const usesColor = o => /\{color\}/.test(o.prompt||'');
function outfitText(w){ return getOutfit(w).prompt.replace(/\{color\}/g, w.outColor||'black'); }
function underText(w){ return w.under==='none' ? null : getUnder(w).prompt.replace(/\{color\}/g, w.underColor||'white'); }
function ob(w,k){ return ((getOutfit(w).bonus||{})[k]||1) * ((getUnder(w).bonus||{})[k]||1); }
function spUnlocked(w,k){ return w.trust>=60 || has(w,'Devoted'); }
function wardrobeAvail(w){
  return Object.entries(WARDROBE).filter(([k,o])=>!o.owner || o.owner===w.key);
}
function wardrobeOK(w,k){ const o = k==='custom' ? {lewd:0} : WARDROBE[k]; return !!o && clothLimit(w,false) >= (o.lewd||0); }
function underOK(w,k){ return !!UNDER[k] && clothLimit(w,false) >= UNDER[k].lewd || k==='custom'; }

function clothLimit(w, withSam){ return w.lewd + (has(w,'Exhibitionist')?15:0) - (has(w,'Shy')?10:0) + (withSam ? w.trust*0.35 + (has(w,'Devoted')?20:0) - (has(w,'Oblivious')?30:0) : (w.trust>=60?8:0)); }
function clothOK(w,c,withSam){
  if(c==='under' && w.under==='none') return false;
  return clothLimit(w,withSam) >= CLOTH.find(x=>x.id===c).lv;
}
function maxCloth(w, withSam){ return [...CLOTH].reverse().find(c=>clothOK(w,c.id,withSam)).id; }
// Modest ladies would rather keep their clothes on: during intimate scenes their comfort line sits w.modesty
// points lower (clothes pulled aside at worst). Lewdness still pushes it down, and with Sam, trust does too.
function comfortCloth(w, withSam, intimate){
  if(!has(w,'Modest')) return maxCloth(w, withSam);
  const lim = clothLimit(w, withSam) - (w.modesty||30) + (withSam ? w.trust*0.25 : 0);
  const c = ([...CLOTH].reverse().find(x=>lim>=x.lv && !(x.id==='under' && w.under==='none'))||CLOTH[0]).id;
  return intimate && c==='dressed' ? 'partial' : c;
}
function defaultCloth(w, scene){
  if(scene.startsWith('act:')) return comfortCloth(w, false, true);
  if(scene.startsWith('samact:')) return comfortCloth(w, true, true);
  if(scene==='solo') return comfortCloth(w, false, true);
  if(scene==='bath') return clothOK(w,'nude',false) ? 'nude' : 'dressed';
  return 'dressed';
}
function wageFor(w){
  if(isFree(w)) return 0;
  const st = STAT_KEYS.reduce((a,k)=>a+w.stats[k],0)/6;
  const tc = Math.max(...TECH_KEYS.map(k=>w.tech[k]||0), ...Object.values(w.acts||{}).map(a=>a.skill*0.8));
  return Math.round((8 + st*0.3 + tc*0.2 + w.popularity*0.3 + (has(w,'Ambitious')?8:0) + (has(w,'Greedy')?6:0)) * (w.race==='beastkin'?0.75:w.race==='dwarf'?1.1:1));
}
function signingFor(w){ return Math.max(60, Math.round(w.wage * rnd(5,8) * (0.9 + (S?S.rep:10)/150))); }
function grow(w,k,n){ n *= (w.race==='human'?1.15:1); w.tech[k] = clamp((w.tech[k]||0) + n*(1 - (w.tech[k]||0)/130)); }
function growAct(w,id,n){ if(!w.acts[id]) return; n *= (w.race==='human'?1.15:1); const s=w.acts[id].skill; w.acts[id].skill = clamp(s + n*(1 - s/130)); }
function allNames(){ return S ? [...S.workers, ...S.candidates].map(w=>w.name) : []; }
function genName(race){ const n = NAMES[race]; let name, t=0; do { name = pick(n.f) + (n.l && Math.random()<0.8 ? ' '+pick(n.l) : ''); t++; } while(allNames().includes(name) && t<25); return name; }

function ensureWorker(w){
  w.tech = w.tech || {}; TECH_KEYS.forEach(k=>{ if(w.tech[k]===undefined) w.tech[k]=ri(0,20); });
  w.acts = w.acts || {};
  const base = w.actSkill!==undefined ? w.actSkill : (w.tech.intimacy!==undefined ? w.tech.intimacy : ri(0,25));
  getActs().forEach(a=>{ if(!w.acts[a.id]) w.acts[a.id] = {skill: clamp(Math.round(base*0.8 + (base<10 ? ri(0,10) : ri(8,22)))), comfort: ri(-10,10)}; });
  const ids = getActs().map(a=>a.id).filter(id=>id!=='caress');
  if(w.fav===undefined){ w.fav = pick(ids); if(w.acts[w.fav]) w.acts[w.fav].skill = clamp(w.acts[w.fav].skill+10); }
  if(w.dislike===undefined){ let d=null; if(Math.random()<0.7){ do d=pick(ids); while(d===w.fav); } w.dislike=d; }
  if(w.lovers===undefined){ let l=null; if(Math.random()<0.45){ do l=pick(ids); while(l===w.fav); } w.lovers=l; }
  if(!w.menu) w.menu = [];
  if(w.offDuty===undefined) w.offDuty = false;
  if(!w.style) w.style = pick(STYLES);
  if(!w.favColor) w.favColor = pick(COLOR_KEYS);
  // Modest: rolled once per lady from her personality (data/personalities.json → modest)
  if(w._mr===undefined){ w._mr = 1; if(!has(w,'Modest') && !has(w,'Exhibitionist') && Math.random() < ((PERS[w.personality]||{}).modest||0)) (w.traits = w.traits||[]).push('Modest'); }
  if(has(w,'Modest') && w.modesty===undefined) w.modesty = ri(20,45);
  w.design = w.design || {};
  // wardrobe migration / defaults
  if(!w.owned) w.owned = [];
  if(!w.outfit || (w.outfit!=='custom' && !WARDROBE[w.outfit])){
    if(w.design.outfit){ w.outfit='custom'; w.customOutfit=w.design.outfit; }
    else { const b = pick(Object.keys(BASE_OUTFITS).filter(k=>k!=='b_robe' || w.lewd>=20)); w.outfit = b; }
  }
  if(w.outfit && w.outfit!=='custom' && !w.owned.includes(w.outfit)) w.owned.push(w.outfit);
  if(!w.outColor) w.outColor = Math.random()<0.4 ? w.favColor : pick(COLOR_KEYS);
  if(!w.ownedUnder) w.ownedUnder = ['plain'];
  if(!w.under){ if(w.design.underwear){ w.under='custom'; w.customUnder=w.design.underwear; } else w.under = pick(['plain','plain','lace','silk','sports']); }

function ageLook(w){
  const R = RACES[w.race]||RACES.human;
  if(R.age[1] > 60) return 'appearing to be a mature woman in her mid-twenties';
  if(w.age < 25) return 'in her early-to-mid twenties';
  if(w.age < 30) return 'in her late twenties';
  return 'in her thirties';
}
function raceLook(w){ if(w.race==='beastkin'){ const s=w.sub||'fox'; return `beastkin woman with ${s} ears and a ${s} tail`; } return (RACES[w.race]||RACES.human).look; }
function clothText(w, cloth, scene){
  if((scene==='bath'||scene==='shower'||scene==='date_springs') && cloth==='dressed') return 'wrapped only in a white towel';
  const T = Object.assign({}, DEFAULT_CLOTH_TEXT, Object.fromEntries(Object.entries(SET.clothText||{}).filter(([k,v])=>v)));
  let t = T[cloth];
  if(!t && cloth==='nude') t = T.partial;
  const ut = underText(w);
  // Modest ladies during intimate scenes: clothes pulled aside rather than removed
  if(has(w,'Modest') && (cloth==='dressed'||cloth==='partial') && /^(act:|samact:|solo$)/.test(scene||'')){
    t = (!ut && T.aside_commando) || T.aside || t;
  }
  return (t||T.dressed).replace(/\{outfit\}/g, outfitText(w)).replace(/\{underwear\}/g, ut || 'bare skin, nothing underneath');
}
function charDesc(w){
  const d = w.design || {};
  return [`beautiful adult ${raceLook(w)}`, ageLook(w), d.build && `${d.build} build`,
    (d.hairStyle||d.hairColor) && `${d.hairStyle||''} ${d.hairColor||''} hair`, d.eyes && `${d.eyes} eyes`,
    d.skin && `${d.skin} skin`, d.features].filter(Boolean).join(', ');
}
const getSnippet = k => (SET.snippets[k] || SCENE_SNIPPETS[k] || '').trim();
function buildPrompt(w, sceneKey, cloth){
  const sc = sceneInfo(sceneKey, w);
  if(w.male) return cleanText([SET.style, 'adult man', w.look, 'upper body portrait, looking at viewer', 'dramatic lighting'].join(', '));
  cloth = cloth || defaultCloth(w, sceneKey);
  const parts = [SET.style];
  if(sc.pov) parts.push("first-person POV, from the viewer's perspective");
  parts.push(charDesc(w), clothText(w, cloth, sceneKey));
  if(sc.sam && !sc.pov) parts.push('together with ' + SAM_DESC);
  if(sc.client) parts.push(sc.client);
  parts.push(sc.comp, sc.setting);
  if(sc.snip) parts.push(getSnippet(sc.snip));
  if(sc.pov) parts.push(getSnippet('pov'));
  return cleanText(parts.filter(Boolean).join(', '));
}

'use strict';
function getPlugin(){
  const P = window.PL_PLUGINS; if(P && typeof P.t2i === 'function') return P.t2i;
  try{ if(typeof t2i === 'function') return t2i; }catch(e){}
  if(typeof window.t2i === 'function') return window.t2i;
  return null;
}
function extractUrl(d){
  if(!d) return null;
  if(typeof d==='string') return /^(data:image|blob:|https?:)/.test(d) ? d : null;
  for(const k of ['dataUrl','dataURL','imageDataUrl','imageUrl','url','src']) if(typeof d[k]==='string' && /^(data:image|blob:|https?:)/.test(d[k])) return d[k];
  for(const k of ['canvas','imageCanvas']) if(d[k] && d[k].toDataURL){ try{ return d[k].toDataURL('image/jpeg',0.92); }catch(e){} }
  if(d.image && d.image.src) return d.image.src;
  return null;
}
function findAny(id){
  if(id==='draft') return CDRAFT;
  if(SETUP && SETUP.prev && SETUP.prev[id]) return SETUP.prev[id];
  if(!S) return null;
  return S.workers.find(w=>w.id===id) || S.candidates.find(w=>w.id===id) || NPCS[id] || LIB.find(w=>w.id===id) || null;
}
// Images are saved per scene + clothing state + what she's wearing, so each outfit gets its own pictures.
function lookKey(w, cloth){
  if(w.male || !w.outfit) return '';
  const o = `o:${w.outfit}:${usesColor(getOutfit(w))?w.outColor:''}`;
  const u = w.under==='none' ? 'u:none' : `u:${w.under}:${usesColor(getUnder(w))?w.underColor:''}`;
  return cloth==='nude' ? '-' : cloth==='under' ? u : cloth==='partial' ? o+'+'+u : o;
}
const imgKey = (w,scene,cloth) => { const l = lookKey(w,cloth); return `${w.id}|${scene}|${cloth}` + (l?'|'+l:''); };
const legacyKey = (w,scene,cloth) => `${w.id}|${scene}|${cloth}`;
function imgCountFor(w, prefix){ let n=0; const p1 = `${w.id}|`; IMGKEYS.forEach(k=>{ if(k.startsWith(p1) && k.includes('|'+prefix)) n++; }); return n; }
async function saveImage(key, url, w, scene){
  const small = await shrink(url, 768, 0.88);
  if(!small){ toast('Couldn\'t read that image to save it. Download it, then use ⬆ Upload.'); return false; }
  await imgPut(key, small);
  if(w && w.id!=='draft' && (scene==='portrait' || !THUMBS[w.id])) await setThumb(w.id, small);
  return true;
}
async function showImg(boxId, id, scene, cloth, mode){
  const box = $('#'+boxId); const w = findAny(id); if(!box || !w) return;
  cloth = cloth || defaultCloth(w, scene);
  let key = imgKey(w, scene, cloth);
  box.dataset.key = key;
  const prompt = buildPrompt(w, scene, cloth);
  let saved = mode==='new' ? null : await imgGet(key), legacy = false;
  if(!saved && mode!=='new' && key!==legacyKey(w,scene,cloth)){ saved = await imgGet(legacyKey(w,scene,cloth)); if(saved){ legacy = true; } }
  if(box.dataset.key !== key) return;
  const newKey = key; if(legacy) key = legacyKey(w,scene,cloth);
  box.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='imgbox'; box.appendChild(wrap);
  const A = `'${boxId}','${id}','${scene}','${cloth}'`;
  if(saved){ wrap.innerHTML = `<img src="${saved}" alt="">` + (legacy?`<div class="imgph small">Saved before outfits were tracked. Regenerate to save one for her current outfit.</div>`:''); }
  else if(mode==='new' || mode==='auto'){ generateInto(wrap, w, newKey, prompt, scene, mode==='new', boxId, id, cloth); }
  else wrap.innerHTML = `<div class="imgph">No saved image for this scene yet.</div>`;
  const bar = document.createElement('div'); bar.className='row';
  bar.innerHTML = `<button class="sm" onclick="showImg(${A},'new')">🎨 ${saved?'Regenerate':'Generate'}</button>
    <button class="sm" onclick="uploadImg(${A})">⬆ Upload</button>
    ${saved?`<button class="sm" onclick="downloadImg('${key}','${esc(w.name).replace(/'/g,'')}')">⬇ Save file</button>${id!=='draft'?`<button class="sm" onclick="useAvatar('${key}','${id}')">👤 Avatar</button>`:''}<button class="sm" onclick="deleteImg('${key}',${A})">🗑</button>`:''}`;
  box.appendChild(bar);
  const det = document.createElement('details'); det.className='prompt'; if(!getPlugin()&&!saved) det.open = true;
  det.innerHTML = `<summary class="muted">Prompt</summary><textarea readonly>${esc(prompt)}</textarea>`;
  const cb = document.createElement('button'); cb.className='sm'; cb.textContent='Copy prompt';
  cb.onclick = ()=>{ try{ navigator.clipboard.writeText(prompt); toast('Prompt copied.'); }catch(e){ toast('Select the text and copy manually.'); } };
  det.appendChild(cb); box.appendChild(det);
}
function generateInto(wrap, w, key, prompt, scene, reroll, boxId, id, cloth){
  const plug = getPlugin();
  if(!plug){ wrap.innerHTML = `<div class="imgph">🎨 Image generator not connected.<br>In Perchance, add <code>t2i = {import:text-to-image-plugin}</code> to the lists panel.<br>You can still ⬆ Upload an image, or copy the prompt.</div>`; return; }
  w.imgVar = w.imgVar || {};
  if(reroll) w.imgVar[key] = (w.imgVar[key]||0) + 1;
  const seed = ((w.seed||1) + (w.imgVar[key]||0)*7919) % 2147483647;
  let done = false;
  const onFinish = async (data)=>{
    if(done) return; const url = extractUrl(data); if(!url) return; done = true;
    if(await saveImage(key, url, w, scene)){ toast('Image saved.'); const b=$('#'+boxId); if(b && b.dataset.key===key) showImg(boxId, id, scene, cloth); }
  };
  try{
    const r = plug({prompt, negativePrompt:SET.negative, seed, resolution:SET.resolution, onFinish});
    const html = (r && typeof r==='object' && 'evaluateItem' in r) ? r.evaluateItem : String(r);
    wrap.innerHTML = html + `<div class="imgph small">Generating… it saves automatically when finished. If it doesn't, use the image's own download button, then ⬆ Upload.</div>`;
  }catch(e){ wrap.innerHTML = `<div class="imgph">Image plugin error: ${esc(e.message)}</div>`; }
  if(S && w.id!=='draft') save();
}
function uploadImg(boxId, id, scene, cloth){
  const inp = $('#upFile'); inp.value='';

    fr.readAsDataURL(f); };
  inp.click();
}
async function downloadImg(key, name){ const d = await imgGet(key); if(!d) return; const a=document.createElement('a'); a.href=d; a.download=`${name||'image'}-${key.split('|').slice(1).join('-').replace(/[^a-z0-9-]/gi,'_')}.jpg`; document.body.appendChild(a); a.click(); a.remove(); }

function migrate(s){
  if(!s.houses){
    s.houses = [{id:'lantern', name:HOUSES.lantern.name, rooms:s.rooms||2, tier:s.roomTier||0, up:s.up||{}, price:s.price??1, rep:s.rep||10}];

    (s.workers||[]).forEach(w=>{ w.house='lantern'; if(w.id==='n_mira'||w.id==='n_kaede'||w.id==='n_hilde'||w.id==='n_rhoswen'||w.id==='n_hanna'){ w.key=w.id.slice(2); } });
    s.debt.total = s.debt.total || 15470;

  }
  if(s.v<5) s.lastReport = null;
  if(s.v<6) s.built = s.built || 0;
  if(s.v<7){
    (s.workers||[]).concat(s.candidates||[]).forEach(w=>{ if(w.key && ['kaede','yui','nerys','elowen','adelheid','marisol','natsuki','kanako','mio'].includes(w.key)) w.arc = [0,1,3,6][w.arc||0] ?? 0; });
    s.houses.forEach(h=>{ if(h.story) h.story.beat = [0,2,3,4][h.story.beat] ?? h.story.beat; });
  }
  s.v = 10; s.regulars = s.regulars || []; s.flags = Object.assign({partnerCD:3}, s.flags||{});
  s.sam.lvl = s.sam.lvl || 1; s.sam.xp = s.sam.xp || 0;
  s.houses.forEach(h=>{ h.since = h.since || 1; h.story = h.story || {beat:0,wk:0}; h.bonus = h.bonus || {};
    if(h.quarters===undefined){ h.quarters = Math.max(HOUSES[h.id].quarters, Math.ceil((s.workers||[]).filter(w=>w.house===h.id).length/2)); h.beds = HOUSES[h.id].beds; }
    (s.workers||[]).forEach(w=>{ if(w.key===HOUSES[h.id].npc){ w.locked = h.id; w.house = h.id; } }); });
  s.samWeek = Object.assign({security:0,books:false,income:0,acts:[]}, s.samWeek||{}); if(!s.samWeek.acts) s.samWeek.acts=[];
  (s.workers||[]).concat(s.candidates||[]).forEach(w=>{ if(w.key && NAMED[w.key] && (!w.outfit || w.outfit==='custom' || !WARDROBE[w.outfit])){ w.outfit='sig_'+w.key; w.owned=Array.from(new Set([...(w.owned||[]),'sig_'+w.key])); } ensureWorker(w); if(!w.house) w.house = s.houses[0].id; });
  if(s.lastReport && !s.lastReport.v5) s.lastReport = null;
  return s;
}
function save(){ if(S) store.set(KEY_SAVE, S); }
function saveSettings(){ store.set(KEY_SET, SET); }
function saveLib(){ store.set(KEY_LIB, LIB); }
function addLog(t){ S.log.unshift({wk:S.week, t}); if(S.log.length>250) S.log.length=250; }
function note(t){ addLog(t); toast(t); }
const findW = id => S.workers.find(w=>w.id===id);

function refreshCandidates(extra=0, quality=1){
  S.candidates = S.candidates.filter(c=>c.keep);
  const bonus = S.houses.reduce((a,h)=>a+(HOUSES[h.id].recruit||0),0);
  for(let i=0;i<3+extra+bonus;i++){ const c = genWorker({quality: quality*(0.85 + S.rep/200 + ((S.sam.lvl||1)-1)*0.02)}); c.signing = signingFor(c); S.candidates.push(c); }
  if(SET.libraryInPool && LIB.length && Math.random()<0.25){
    const src = pick(LIB);
    if(!allNames().includes(src.name)){ const c = ensureWorker(clone(src)); c.id=uid(); c.keep=false; c.signing=signingFor(c); S.candidates.push(c); }
  }
  // other partners occasionally turn up looking for work (paid, normal trust, still have their story)
  if(S.flags.partnerCD>0) S.flags.partnerCD--;
  else if(Math.random()<0.35){
    const open = PARTNERS.filter(k=>!isHired(k));
    if(open.length){ const k = pick(open); const c = makeNamed(k); c.signing = signingFor(c); S.candidates.push(c); S.flags.partnerCD = 5; addLog(`${c.name} is looking for work. (Candidates)`); }
  }
  // drifters (data/characters.json role "drifter") wander in now and then
  const drift = Object.keys(NAMED).filter(k=>NAMED[k].role==='drifter' && !isHired(k));
  if(drift.length && Math.random()<0.15){ const c = makeNamed(pick(drift)); c.signing = signingFor(c); S.candidates.push(c); addLog(`${c.name} is looking for work. (Candidates)`); }
}
function addCandidates(n, quality=1){ for(let i=0;i<n;i++){ const c=genWorker({quality}); c.signing=signingFor(c); S.candidates.push(c); } }
function checkUnlocks(silent, sink){
  const msgs = [];
  S.workers.forEach(w=>{
    ensureWorker(w);
    getActs().forEach(a=>{
      if(canClient(w,a.id) && !w.seen['c_'+a.id]){ w.seen['c_'+a.id]=true; if(!silent) msgs.push(`${w.name} is now open to ${a.label} with clients.`); }
      if(canSam(w,a.id) && !w.seen['s_'+a.id]){ w.seen['s_'+a.id]=true; if(!silent) msgs.push(`${w.name} is now open to ${a.label} with Sam.`); }
    });
    CLOTH.forEach(c=>{ if(c.lv && clothOK(w,c.id,false) && !w.seen['w_'+c.id]){ w.seen['w_'+c.id]=true; if(!silent) msgs.push(`${w.name} is now comfortable ${c.id==='under'?'in her undergarments':c.label.toLowerCase()} for clients.`); } });
    if(w.key && WARDROBE['sp_'+w.key] && spUnlocked(w) && !w.seen.sp){ w.seen.sp=true; if(!w.owned.includes('sp_'+w.key)) w.owned.push('sp_'+w.key); if(!silent) msgs.push(`${w.name} unlocked her special outfit: ${WARDROBE['sp_'+w.key].label}.`); }
  });
  msgs.forEach(m=>addLog(m));
  if(sink){ msgs.forEach(m=>sink.push('🔓 '+m)); return; }
  if(msgs.length) toast(msgs[0] + (msgs.length>1 ? ` (+${msgs.length-1} more in the Log)` : ''));
}
function nextDue(){
  const wk = S.week%4===0 ? S.week : Math.ceil(S.week/4)*4;
  const inst = Math.round((220+130*(wk/4)) * S.debt.total/15470);
  const amount = wk>=52 ? S.debt.remaining : Math.min(S.debt.remaining, inst + S.debt.carry);
  return {week:wk, amount};
}

function canDo(w, job){
  const J = JOBS[job]; if(!J) return 'Unknown job.';
  const h = houseOf(w);
  if(job!=='rest' && w.health<30) return `${w.name} is too unwell to work.`;
  if(job!=='rest' && w.trust < jobTrust(w,job)) return `${w.name} doesn't trust Sam enough for that yet (needs trust ${jobTrust(w,job)}).`;
  if(job==='courtesan' && !getActs().some(a=>canClient(w,a.id))) return `${w.name} isn't comfortable with that yet.`;
  if(J.needs && !h.up[J.needs]) return `${h.name} needs a ${UPGRADES[J.needs].label}.`;
  const used = S.workers.filter(x=>x!==w && x.house===h.id && x.job===job).length, max = slotsFor(h, job);
  if(used >= max) return job==='courtesan' ? `No free bedrooms in ${h.name}.` : `No open ${J.label} positions in ${h.name} (${max}).`;
  return null;
}
function setJob(id, job){

  if(msg) toast(msg); else {
    w.job = job;

}
function setHouse(id, hid){

function hire(id){

function dismiss(id){

// Every construction project makes the next one pricier (permits, contractors who've noticed you have money...).
function upgradeCost(h, k){
  const infl = 1 + 0.12*(S.built||0);
  if(k==='room') return Math.round((250 + h.rooms*220) * infl);
  if(k==='quarters') return Math.round((200 + (h.quarters||0)*160) * infl);
  if(k==='roomTier') return Math.round((ROOM_TIER_COST[h.tier]||0) * infl);
  if(k==='beds') return Math.round((BEDS[Math.min(3,(h.beds||0)+1)].cost) * Math.max(1,h.quarters||1) * infl);
  if(k==='annex') return Math.round(2500 * infl);
  return Math.round((UPGRADES[k]?UPGRADES[k].cost:0) * infl);
}
function buyUpgrade(k){
  const h = curH(); let cost = upgradeCost(h,k), need = 0;
  if(k==='room'||k==='quarters') need = 1;
  else if(k==='roomTier'){ if(h.tier>=3) return toast('Bedrooms are already opulent.'); }
  else if(k==='beds'){ if((h.beds||0)>=3) return toast('Already the best beds in town.'); }
  else if(k==='annex'){ if(h.annex) return toast('Already expanded.'); }
  else { if(h.up[k]) return; need = AMENITY_SIZE[k]||1; }
  if(need && roomsUsed(h) + need > houseSize(h)) return toast(`${h.name} is out of space (${roomsUsed(h)}/${houseSize(h)} rooms used).`);
  if(S.gold < cost) return toast('Not enough gold.');
  S.gold -= cost; S.built = (S.built||0) + 1;
  if(k==='room'){ h.rooms++; note(`${h.name}: a new bedroom is ready. (${h.rooms} total)`); }
  else if(k==='quarters'){ h.quarters=(h.quarters||0)+1; note(`${h.name}: new staff quarters. Beds for ${bedsFor(h)}.`); }
  else if(k==='roomTier'){ h.tier++; note(`${h.name}: bedrooms refurbished to ${ROOM_NAMES[h.tier]}.`); }
  else if(k==='beds'){ h.beds=(h.beds||0)+1; note(`${h.name}: staff now sleep on ${BEDS[h.beds].label.toLowerCase()}.`); }
  else if(k==='annex'){ h.annex=true; note(`${h.name}: annex built (+3 rooms of space).`); }
  else { h.up[k]=true; note(`${h.name}: ${UPGRADES[k].label} built.`); }
  save(); render();
  if(k==='bar' && !S.flags.hilde && !isHired('hilde')){ S.flags.hilde=true; EVQ.push(evHilde); runQueue(); }
}
function buyHouse(id){
  const D = HOUSES[id]; if(!D || H(id)) return;
  if(D.premium && ((S.sam.lvl||1) < D.level || S.rep < D.renown)) return toast(`${D.name} won't sell to Sam yet. Needs Sam level ${D.level} and renown ${D.renown}.`);
  if(S.gold < D.cost) return toast('Not enough gold.');
  if(!confirm(`Buy ${D.name} for ${fmt(D.cost)}?`)) return;
  S.gold -= D.cost; S.houses.push(makeHouse(id)); S.cur = id;
  note(`You now own ${D.name}!`);
  if(!isHired(D.npc)){
    const n = makeNamed(D.npc); n.house = id; n.locked = id; n.contract = 999; n.job = canDo(n, NAMED[D.npc].job) ? 'companion' : NAMED[D.npc].job;
    S.workers.push(n); checkUnlocks(true);
    EVQ.push(()=>({title:`${D.name}`, who:n.id, scene:'portrait', text:`${n.name} is waiting at the door when Sam arrives with the deed.\n\n${n.backstory}\n\nShe comes with the place.`, choices:[{label:'Welcome aboard', fx(){ n.trust=clamp(n.trust+5); return ''; }}]}));
  }
  save(); render(); runQueue();
}
function payExtra(){
  const el = $('#payamt'); const amt = Math.floor(+((el&&el.value)||0));
  if(amt<=0) return toast('Enter an amount.');
  if(amt > S.gold) return toast('You don\'t have that much.');
  const a = Math.min(amt, S.debt.remaining);
  S.gold -= a; S.debt.remaining -= a; S.debt.carry = Math.max(0, S.debt.carry - a);
  note(`Paid ${fmt(a)} toward the debt.`); save(); render(); checkEnd();
}

'use strict';
/* =====================================================================

   ===================================================================== */
function useAP(cost=20){
  if(S.over) return false;
  if(S.ap<=0){ toast('Sam is out of actions this week. End the week to continue.'); return false; }
  if(S.sam.energy<cost){ toast('Sam is too tired. Have him rest, or end the week.'); return false; }
  S.ap--; S.sam.energy -= cost; samGainXP(6); return true;
}
const samLog = t => S.samWeek.acts.push(t);
const xpNeed = l => 60 + 40*l;
const apMax = () => 3 + ((S.sam.lvl||1)>=5?1:0) + ((S.sam.lvl||1)>=10?1:0);
function samGainXP(n){
  S.sam.xp = (S.sam.xp||0) + n; S.sam.lvl = S.sam.lvl || 1;
  while(S.sam.xp >= xpNeed(S.sam.lvl)){
    S.sam.xp -= xpNeed(S.sam.lvl); S.sam.lvl++;
    ['charm','business','strength','technique'].forEach(k=>samStat(k,2));
    if(S.sam.lvl===5 || S.sam.lvl===10) S.ap++;
    note(`⬆ Sam reached level ${S.sam.lvl}! All stats +2${S.sam.lvl===5||S.sam.lvl===10?', and +1 action per week':''}.`);
  }
}
function samXP(n){

  return weighted(CLASSES, c=>{ const i=CLASSES.indexOf(c); return ws[i]*cw[i]*(c.id==='merchant'&&h.bonus&&h.bonus.merchant||1); });

function simHouse(h, R){
  const HD = HOUSES[h.id], W = S.workers.filter(w=>w.house===h.id), P = PRICES[h.price];
  const hr = {id:h.id, name:h.name, income:0, served:0, turned:0, sat:0, upkeep:0};
  const byJob = j => W.filter(w=>w.job===j);
  const mad = byJob('madame')[0];
  const madF = mad ? (0.5 + (mad.tech.manage + mad.stats.charm)/200) * ob(mad,'madame') : 0;
  const recF = byJob('reception').reduce((a,w)=>a + (0.3 + (w.tech.service + w.stats.charm)/250)*ob(w,'reception'), 0);
  const danceDraw = byJob('dancer').reduce((a,w)=>a + (1 + w.popularity/30 + w.tech.dance/50)*ob(w,'dancer'), 0);
  let secPow = byJob('security').reduce((a,w)=>a + (w.tech.combat + w.stats.strength*0.5 + (has(w,'Former Adventurer')?20:0))*ob(w,'security'), 0);
  if(h.up.guard) secPow *= 1.8;
  secPow += S.samWeek.security;
  const repEff = h.rep*0.75 + S.rep*0.25;
  let demand = (10 + repEff*0.4 + (h.up.lounge?4:0) + danceDraw*1.5) * HD.demand * (P.demand + (h.price>=2 ? repEff/250 : 0)) * (1 + 0.25*recF) * rnd(0.85,1.15);
  if(HD.haunted) demand *= 0.45 + Math.min(1, h.rep/40)*0.8;
  demand *= (h.bonus&&h.bonus.demand) || 1;
  demand = W.length ? Math.max(1, Math.round(demand)) : 0;
  const escorts = W.filter(w=>JOBS[w.job].cat==='escort');
  const capc = {}; escorts.forEach(w=>capc[w.id] = 10);

  W.forEach(w=>{
    if(w.lust < LUST_HIGH || has(w,'Devoted') || Math.random() >= soloChance(w)) return;   // lovers wait for Sam

    if(capc[w.id]!==undefined) capc[w.id] = Math.min(capc[w.id], BAL.solo.clientCap);
    R.hl.push({wid:w.id, text:flavor('solo', w), act:null, scene:'solo'});
  });
  const roomM = ROOM_MULT[h.tier];

}

/* ---- js/events/core.js ---- */
'use strict';
/* =====================================================================
   EVENTS
   ===================================================================== */
function runQueue(){
  if(!EVQ.length){ CUR_EV=null; render(); checkEnd(); return; }
  let ev = null; try{ ev = EVQ.shift()(); }catch(e){ console.warn('event skipped', e); ev = null; }
  if(!ev) return runQueue();
  showEvent(ev);
}
function showEvent(ev){
  CUR_EV = ev;
  modal(`<h2>${esc(ev.title)}</h2>${ev.who?`<div id="evImg"></div>`:''}
    <p class="story">${esc(ev.text)}</p><div id="evRes"></div>
    <div class="row" id="evChoices">${ev.choices.map((c,i)=>`<button ${i===0?'class="primary"':''} onclick="evChoice(${i})">${esc(c.label)}</button>`).join('')}</div>`, {lock:true});
  if(ev.who) showImg('evImg', ev.who, ev.scene||'portrait', ev.cloth);
}
function evChoice(i){
  const ev = CUR_EV; if(!ev) return;
  const out = ev.choices[i].fx() || '';
  const res = typeof out==='object' ? (out.text||'') : out;
  checkUnlocks(); save(); render();
  $('#evChoices').innerHTML = `${out.ai?aiBtn('evAi', out.ai.kind, out.ai.wid, out.ai):''}<button class="primary" onclick="closeModal();runQueue()">Continue</button>`;
  $('#evRes').innerHTML = (res ? `<p class="story"><i>${esc(res)}</i></p>` : '') + (out.ai?'<div id="evAi"></div>':'') + (out.img?'<div id="evResImg"></div>':'');
  if(out.img) showImg('evResImg', out.img.wid, out.img.scene, out.img.cloth);
  if(out.ai && SET.ai.on && SET.ai.auto) aiWrite('evAi', out.ai.kind, out.ai.wid, out.ai);
}

/* ---- js/stories/houses.js ---- */
'use strict';
/* =====================================================================
   HOUSE STORYLINES — one unique 3-chapter story per house.
   Chapters trigger over time as the house's reputation grows (0 / 15 / 25).
   A failed check just means the chapter comes back a few weeks later.
   ===================================================================== */
const pct = (v,dc) => clamp(Math.round(55 + (v + ((S&&S.sam.lvl)||1)*2 - 2 - dc)*1.4), 15, 95);
const rollP = p => Math.random()*100 < p;
const resident = h => S.workers.find(w=>w.key===HOUSES[h.id].npc);
const secOf = h => Math.max(0, ...S.workers.filter(w=>w.house===h.id && w.job==='security').map(w=>w.tech.combat + w.stats.strength*0.3));
function storyAdvance(h, xp=40){ h.story.beat++; h.story.wk = S.week; samGainXP(xp); }
function storyRetry(h){ h.story.wk = S.week; }
function check(label, stat, val, dc, win, lose){ const p = pct(val,dc); return {label:`${label} [${stat} ${p}%]`, fx(){ return rollP(p) ? win() : lose(); }}; }
function pay(label, cost, h, win){ return {label:`${label} (${fmt(cost)})`, fx(){ if(S.gold<cost){ storyRetry(h); return 'You can\'t afford that right now. (This will come up again.)'; } S.gold-=cost; return win(); }}; }
function freeResident(h){ const R = resident(h); if(!R) return ''; R.free = true; R.wage = 0; R.contract = 999; R.trust = clamp(R.trust+15); if(!has(R,'Loyal')) R.traits.push('Loyal'); return `\n\n(${R.name} now works without wages.)`; }
function joinNamed(key, h, free){
  if(isHired(key)) return '';
  const w = makeNamed(key); w.house = h.id; w.locked = h.id; w.contract = 999; w.trust = clamp(w.trust+20);
  if(free){ w.free = true; w.wage = 0; w.contract = 999; }
  S.workers.push(w); assignStart(w, NAMED[key].job); delete NPCS['n_'+key]; checkUnlocks(true);
  return `\n\n(${w.name} joins ${h.name}${free?', working without wages':''}.)`;
}
const RN = h => { const R = resident(h); return R ? R.name : 'the staff'; };
const RID = h => { const R = resident(h); return R ? R.id : null; };
const SSTR = h => Math.max(S.sam.strength, secOf(h));

      check('Talk him in circles','Charm',S.sam.charm,38, ()=>{ storyAdvance(h); return 'Sam buries him in so many questions about invoices and payment terms that Silas leaves to find a headache powder. Now Sam knows exactly what he wants.'; }, ()=>{ storyRetry(h); return 'Silas is not amused. "One week. Then we talk properly."'; })]}),

      check(`Let ${RN(h)} handle it`,'Management',resident(h)?resident(h).tech.manage:0,50, ()=>{ S.gold+=600; storyAdvance(h); return `${RN(h)} cracks it in one evening: proof of extortion, and 600g hidden under the floorboards. +600g`; }, ()=>{ storyRetry(h); return `${RN(h)} needs more time with it.`; })]}),

'use strict';
// Romance arcs live in data/arcs.json (beats, choices and their effects). The final beat makes her Sam's lover (Devoted).
ARCS = noMeta(needData('arcs'));
// Turn a choice's declarative effects into trust/mood/lewd changes, applying the side effects (gold, Sam stats, etc.).
function resolveEff(w, c){
  let e = Object.assign({}, c);
  if(e.if){ const ok = Object.entries(e.if).every(([k,v])=>(w[k]||0) >= v); if(!ok) e = Object.assign({}, e.else||{}); }
  if(e.gold && e.gold < 0 && S.gold < -e.gold) return Object.assign({}, e.cantAfford || {res:"Sam can't afford that right now."});
  if(e.gold) S.gold += e.gold;
  if(e.sam) Object.entries(e.sam).forEach(([k,v])=>samStat(k, v));
  if(e.energy==='full') w.energy = maxEnergy(w); else if(typeof e.energy==='number') w.energy = clamp(w.energy + e.energy, 0, maxEnergy(w));
  if(e.health) w.health = clamp(w.health + e.health);
  if(e.grow) Object.entries(e.grow).forEach(([k,v])=>grow(w, k, v));
  return e;
}
function applyEff(w, e){
  if(e.t) w.trust = clamp(w.trust + e.t);
  if(e.m) w.mood = clamp(w.mood + e.m);
  if(e.l) w.lewd = clamp(w.lewd + e.l);
}
function evArc(w){
  const beats = ARCS[w.key]; if(!beats || !S.workers.includes(w)) return null;
  const i = w.arc||0; if(i>=beats.length) return null;
  const b = beats[i], last = i===beats.length-1;
  let scene = b.scene, cloth = b.cloth;
  if(scene==='final'){ const act = (w.fav && canSam(w,w.fav)) ? w.fav : (getActs().find(a=>canSam(w,a.id))||{id:'caress'}).id; scene = 'samact:'+act; cloth = undefined; }
  return {title:`${w.name}: ${b.title} (${i+1}/${beats.length})`, who:w.id, scene, cloth, text:b.text,
    choices: b.choices.map(c=>({label:c.label, fx(){
      const e = resolveEff(w, c);
      applyEff(w, e);
      let res = String(e.res||'').replace(/\{N\}/g, w.name);
      w.arcWk = S.week;
      if(e.hold) return res;
      w.arc = i+1; samGainXP(last?40:15);
      if(w.arc>=4 && has(w,'Oblivious')){ w.traits = w.traits.filter(t=>t!=='Oblivious'); res += `\n\n(Something has changed in the way ${w.name} looks at Sam. Oblivious removed.)`; }
      if(last){ w.privateCount++; if(S.sam.first) S.sam.first=false; if(!has(w,'Devoted')) w.traits.push('Devoted'); w.isPartner = true; w.wage = 0; w.contract = 999;
        res = (res?res+'\n\n':'') + `${w.name} is now Sam's lover. (Devoted: never leaves, works without wages, more willing with Sam, and her mood stays up.)`; }
      return res;
    }}))};
}

'use strict';
/* =====================================================================
   REGULAR CLIENTS
   Named men who keep coming back to a house, usually for one favorite lady.
   Numbers and all the words are in data/regulars.json; the choice logic is here.
   ===================================================================== */
const REG = needData('regulars');
const regQuirk = r => REG.quirks[r.quirk] || {label:r.quirk, desc:'', tip:1, drama:0};
const regFill = (t, r, w, extra={}) => String(Array.isArray(t) ? pick(t) : t||'').replace(/\{(\w+)\}/g, (m,k)=>{
  const c = Object.assign({regular:r ? r.name : '', name:w ? w.name : 'her', house: r && S.houses.find(h=>h.id===r.house) ? S.houses.find(h=>h.id===r.house).name : 'the house'}, extra);
  return c[k]!==undefined ? String(c[k]) : m;
});
function regName(){
  const used = (S.regulars||[]).map(r=>r.name); let n, t=0;
  do { n = pick(REG.names.first) + ' ' + pick(REG.names.last); t++; } while(used.includes(n) && t<30);
  return n;
}
// this week's visiting regulars for a house
function regularsVisiting(h){ return (S.regulars||[]).filter(r=>r.house===h.id && Math.random() < (REG.visitChance ?? 0.6)); }
// after a regular's visit: loyalty, favorite, and whether he keeps coming
function regAfter(r, w, sat, inc){
  r.visits++; r.spent += inc;
  if(sat >= 60){ r.loyalty = Math.min(10, r.loyalty + 1); if(!r.fav || (r.fav!==w.id && sat>=85 && Math.random()<0.3)) r.fav = w.id; }
  else if(sat < 30){ r.loyalty -= 2; }
  if(r.loyalty <= -4){ S.regulars = S.regulars.filter(x=>x!==r); addLog(`${r.name} has stopped coming to ${S.houses.find(h=>h.id===r.house).name}.`); }
}
// a great visit may turn a client into a regular
function maybeNewRegular(h, best, R){
  S.regulars = S.regulars || [];
  if(!best || S.regulars.filter(r=>r.house===h.id).length >= (REG.maxPerHouse ?? 4) || Math.random() > 0.3) return;
  const r = {id:uid(), name:regName(), cls:best.cls.id, house:h.id, fav:best.w.id, visits:1, loyalty:2, spent:0, quirk:pick(Object.keys(REG.quirks)), since:S.week};
  S.regulars.push(r);
  R.hl.push({wid:best.w.id, text:regFill(REG.events.new, r, best.w), act:null, scene:'companion'});
}

/* ---------- drama ---------- */
function queueRegularDrama(){
  const c = (S.regulars||[]).filter(r=>r.fav && findW(r.fav) && REG.events[r.quirk] && Math.random() < (regQuirk(r).drama||0));
  if(!c.length) return false;
  const r = pick(c); EVQ.push(()=>evRegular(r.id)); return true;
}
function evRegular(rid){
  const r = (S.regulars||[]).find(x=>x.id===rid), w = r && findW(r.fav); if(!r || !w) return null;
  const E = REG.events[r.quirk], h = S.houses.find(x=>x.id===r.house) || houseOf(w);
  const F = (t, extra) => regFill(t, r, w, extra);
  const base = {title:F(E.title), who:w.id, scene:'companion'};
  if(r.quirk==='generous'){
    const g = ri(60,160);
    return Object.assign(base, {text:F(E.text,{gold:fmt(g)}), choices:[
      {label:'Let her keep it', fx(){ w.mood = clamp(w.mood+8); gainTrust(w,2); return F(E.keep); }},
      {label:'Sell it for the house', fx(){ S.gold += g; w.mood = clamp(w.mood-3); return F(E.split,{gold:fmt(g)}); }}]});
  }
  if(r.quirk==='jealous'){
    const g = ri(80,200);
    return Object.assign(base, {text:F(E.text), choices:[
      {label:`Take his money (${fmt(g)})`, fx(){ S.gold += g; w.mood = clamp(w.mood-3); r.loyalty++; return F(E.pay,{gold:fmt(g)}); }},
      {label:'"She isn\'t yours"', fx(){ r.loyalty -= 3; gainTrust(w,2); if(r.loyalty<=-4) S.regulars = S.regulars.filter(x=>x!==r); return F(E.refuse); }},
      {label:'Let her handle it', fx(){ w.energy = clamp(w.energy-10, 0, maxEnergy(w)); r.loyalty++; return F(E.calm); }}]});
  }
  if(r.quirk==='lingering'){
    const g = ri(40,110), sec = S.workers.some(x=>x.house===r.house && x.job==='security');
    const ch = [
      {label:`Bill him for the night (${fmt(g)})`, fx(){ S.gold += g; w.energy = clamp(w.energy-15, 0, maxEnergy(w)); return F(E.charge,{gold:fmt(g)}); }},
      {label:'Let it go', fx(){ S.gold += Math.round(g/3); w.energy = clamp(w.energy-15, 0, maxEnergy(w)); w.mood = clamp(w.mood-2); r.loyalty++; return F(E.letit); }}];
    if(sec) ch.splice(1, 0, {label:'Have security walk him out', fx(){ r.loyalty -= 2; gainTrust(w,1); return F(E.escort); }});
    return Object.assign(base, {text:F(E.text), choices:ch});
  }
  if(r.quirk==='smitten'){
    const g = Math.round(Math.max(300, (w.wage||20)*30 + w.popularity*8));
    const stays = has(w,'Devoted') || w.isPartner || w.locked || w.trust >= 60 || Math.random() < 0.6;
    return Object.assign(base, {text:F(E.text,{gold:fmt(g)}), choices:[
      {label:'Let her decide', fx(){
        S.regulars = S.regulars.filter(x=>x!==r);
        if(stays){ gainTrust(w,4); w.mood = clamp(w.mood+4); return F(E.stays); }
        S.gold += g; S.workers = S.workers.filter(x=>x.id!==w.id); return F(E.goes,{gold:fmt(g)}); }},
      {label:'Refuse the offer', fx(){ S.regulars = S.regulars.filter(x=>x!==r); w.mood = clamp(w.mood-2); return F(E.refuse); }}]});
  }
  if(r.quirk==='talker'){
    return Object.assign(base, {text:F(E.text), choices:[
      {label:'Buy him a drink', fx(){ if(h) h.rep = clamp(h.rep+2); w.popularity = clamp(w.popularity+3); return F(E.thanks); }}]});
  }
  return null;
}
