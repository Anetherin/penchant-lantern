the district who will see anyone, no questions asked. She is dry, blunt, a bit of a night owl and unfazed by blood, fever or anyone's vanity. She came to Hollowmere for the herbs, stayed for the tea, and has opinions about everybody's posture.","design":{"hairStyle":"short, wavy and tousled","hairColor":"dark brown","eyes":"dark grey","skin":"fair","features":"a cigarette tucked behind her ear and a tired half-smile"},"under":"sports","underColor":"black","stats":{"beauty":70,"charm":52,"refinement":50,"stamina":62,"strength":40,"agility":55},"tech":{"service":45,"dance":10,"bar":15,"combat":25,"manage":45},"actSkill":30,"popularity":10,"lewd":36,"trust":20,"outfits":{"sig_takemi":{"label":"Clinic coat","style":"Sporty","prompt":"an open white doctor's coat over a fitted black top, jeans, a stethoscope around her neck","bonus":{"bath":1.25,"commoner":1.15}},"sp_takemi":{"label":"Night-off leathers","style":"Revealing","prompt":"a fitted black leather jacket over a plain top, tight jeans and boots","bonus":{"adventurer":1.2,"courtesan":1.15}}},"bonds":{"kawakami":{"v":30,"note":"The doctor patched her up after a long run of overtime."},"margaret":{"v":20,"note":"Margaret finds the doctor's medical stories fascinating."}},"jobs":{"likes":["bath","attendant"],"dislikes":["dancer"]},"body":{"bust":"medium","height":"average","figure":"athletic"},"unique":{"name":"Doctor's Hands","desc":"Expert, no-nonsense hands make her massages unusually effective and she recovers quickly.","fx":{"actQuality":{"massage_give":1.35},"energyRec":1.08}}},"sae":{"job":"madame","name":"Sae Niijima","race":"human","age":29,"personality":"Proud and sharp-tongued","traits":["Ambitious","Tough"],"style":"Elegant","favColor":"navy","fav":"manual_give","dislike":"doggy","lovers":"missionary","backstory":"A prosecutor with a reputation for never losing a case she's decided to win, Sae Niijima lives on strong coffee, long hours and the kind of control that exhausts people. She is exacting, fair and fiercely loyal to the family she raised, and she has begun to wonder what her life might look like if it had a day off. She is here on a sabbatical she insists is only to audit the books.","design":{"build":"lean","hairStyle":"short, side-parted bob","hairColor":"dark brown","eyes":"red-brown","skin":"fair","features":"a sharp, focused gaze and a faint line of fatigue she hides well"},"under":"silk","underColor":"navy","stats":{"beauty":72,"charm":52,"refinement":72,"stamina":50,"strength":30,"agility":45},"tech":{"service":30,"dance":10,"bar":15,"combat":25,"manage":70},"actSkill":20,"popularity":12,"lewd":18,"trust":18,"outfits":{"sig_sae":{"label":"Prosecutor's suit","style":"Elegant","prompt":"a tailored charcoal skirt suit with a crisp white blouse, a slim tie and sharp heels","bonus":{"madame":1.3,"merchant":1.2}},"sp_sae":{"label":"Coffee-house blouse","style":"Elegant","prompt":"a loose cream blouse, dark slacks and her sleeves rolled up, a steaming coffee cup in her hand","bonus":{"noble":1.15,"courtesan":1.15}}},"bonds":{"takemi":{"v":20,"note":"A prosecutor and an unlicensed doctor. They keep their distance on principle."}},"jobs":{"likes":["madame","promoter"],"dislikes":["dancer","bartender"]},"body":{"bust":"medium","height":"tall","figure":"slim"},"unique":{"name":"Cross-Examination","desc":"Nothing gets past her scrutiny; she runs a tight house and lifts its standing.","fx":{"jobBonus":{"madame":1.2},"rep":1.1}}}}}}},"arcs":{"_readme":["Partner romance arcs: one list of beats per partner key (from characters.json). A beat fires every few weeks once her trust is high enough; the last beat makes her Sam's lover.","Beat: title, scene (image scene: sam_date, shower, walkin, casual, portrait, bath, or final = her private scene with Sam), text, choices.","Choice: label plus effects. t/m/l = trust/mood/lewdness change. res = result text ({N} = her name). hold:true = the beat comes back later instead of advancing.","Extra effects: gold (negative = cost; add cantAfford:{...} for when Sam is short), sam:{strength:1} (Sam stat), energy:\"full\", health:20, grow:{service:6} (her skill).","Conditions: if:{lewd:40} (her stat at least that; also works for trust, mood) uses this choice's effects, otherwise the ones under else:{...}.","image (optional): {comp, setting, sam, towel} a picture for that beat instead of the generic scene. The scene key still decides bath/walk-in handling."],"kaede":[{"title":"Two Stolen Bottles","scene":"sam_date","text":"Kaede drags Sam onto the roof with two stolen bottles of wine. \"Back in my party, nobody ever had my back. Then this skinny guy in a hoodie jumps in front of a goblin for me.\" She bumps his shoulder. \"Idiot.\" She doesn't move away.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"sitting on a rooftop at night bumping shoulders with him, holding a wine bottle, fox tail swishing","setting":"tiled rooftop over a fantasy town at night, stars, chimney smoke","sam":true}},{"title":"Wrong Door","scene":"shower","text":"Sam opens the washroom door and finds Kaede mid-towel, every hair on her tail standing straight up.","choices":[{"label":"Apologize and bolt","t":1,"m":-2,"res":"Kaede laughs about it for ten straight minutes. Through the door. Loudly."},{"label":"Compliment her","if":{"lewd":40},"t":2,"m":6,"l":3,"res":"She grins, not bothering with the towel very hard. \"Smooth, boss.\"","else":{"t":-2,"m":-4,"res":"\"GET OUT.\" The towel hits him in the face."}},{"label":"Stand there like an idiot","m":3,"l":2,"res":"\"Take a picture, it lasts longer.\" Sam has no idea how she knows that phrase."}],"image":{"comp":"frozen mid-towel in a washroom doorway, every hair on her fox tail standing straight up, wide-eyed","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"Tail Says Otherwise","scene":"casual","text":"Kaede shows up at Sam's door with a bandaged hand and a grin, from sparring \"for fun.\" While he patches her up, her tail keeps brushing his arm. Neither of them mentions it.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"sitting on a kitchen table while he bandages her hand, grinning, fox tail brushing his arm","setting":"inn kitchen at night, a first-aid kit","sam":true}},{"title":"The Old Party","scene":"portrait","text":"Kaede's old party leader turns up at the bar: a new contract, a deep dungeon, and a spot for her if she wants it. Kaede looks at Sam and waits.","choices":[{"label":"\"Go, if it's what you want.\"","t":4,"m":-4,"res":"She stays. Later she grumbles: \"You weren't supposed to make it easy.\""},{"label":"\"Stay. Please.\"","t":6,"m":6,"res":"Kaede turns the leader down without even looking at him."},{"label":"Say nothing","t":-6,"m":-10,"res":"She leaves for two days without a word. When she comes back, she doesn't mention it. Neither does he. It sits between them for a while."}],"image":{"comp":"standing at a bar between him and a rugged adventurer in armor, arms crossed, looking at him and waiting","setting":"busy tavern bar, adventurers at tables","sam":true}},{"title":"Rooftops","scene":"sam_date","text":"Kaede teaches Sam to run the rooftops of Hollowmere at night. He is very, very bad at it.","choices":[{"label":"Keep trying","sam":{"strength":1},"t":3,"m":6,"res":"By the end of the night he makes one jump cleanly. She cheers loud enough to wake the street."},{"label":"Fake a sprained ankle so she carries you","m":8,"l":2,"res":"She sees right through it. She carries him anyway, the whole way home."}],"image":{"comp":"leaping across rooftops at night, laughing back at the man clinging to a chimney","setting":"moonlit rooftops of a fantasy town","sam":true}},{"title":"Copper Fox, Kept","scene":"final","text":"After closing, Kaede corners Sam in the kitchen. \"I'm bad at this, so I'll just say it. I'm not going anywhere. Not for the money. For you.\" Her ears are bright red. She takes his hand and leads him upstairs, and the door closes behind them.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"yui":[{"title":"Almost Coffee","scene":"sam_date","text":"Yui finds Sam on the back steps with two cups of something that is almost, but not quite, coffee. They talk about home for hours: trains, convenience stores, the vending machine on the 4th floor. She cries a little. So does he.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"sitting on back steps with him holding two steaming cups, laughing about home","setting":"back steps of an inn at night, lanterns, stars","sam":true}},{"title":"Bath Time Budget Meeting","scene":"walkin","text":"Hunting for the ledger, Yui walks straight into the washroom while Sam is in the tub. She does not leave. She stares fixedly at the ceiling. Then the floor. Then the ceiling again.","choices":[{"label":"\"Could you pass me a towel?\"","t":2,"m":3,"res":"She throws it directly at his face and flees."},{"label":"Act completely casual","m":5,"l":2,"res":"She stammers through the entire weekly budget review, right there, without once looking down. It's honestly impressive."},{"label":"Yell","t":-2,"m":-3,"res":"She flees, mortified, and avoids him for three days."}],"image":{"comp":"standing in a washroom doorway clutching a ledger, staring fixedly at the ceiling, bright red","setting":"steamy wooden washroom, a man in the tub off-frame","sam":false}},{"title":"Instant Ramen, Reconstructed","scene":"casual","text":"Yui reveals she's been \"recreating\" instant ramen in the kitchen for a month. It is terrible. They eat all of it. \"Remember when you covered my shift that time?\" she asks. \"I liked you before the truck, you know.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"eating a terrible bowl of homemade ramen with him at a kitchen table, both laughing","setting":"small inn kitchen at night, pots and steam","sam":true}},{"title":"The Way Home","scene":"portrait","text":"A traveling mage claims he can send otherworlders home. Yui shows Sam the flyer with shaking hands. \"If it's real... would you go?\"","choices":[{"label":"\"I'd stay. This is home now.\"","t":5,"m":5,"res":"She lets out a breath she's been holding for a week."},{"label":"\"I don't know.\"","t":-3,"m":-8,"res":"Honest. It still hurts. She nods and doesn't bring it up again."},{"label":"\"Only if you came with me.\"","t":7,"m":8,"res":"She laughs and wipes her eyes. (The mage turns out to be a fraud. Neither of them is disappointed.)"}],"image":{"comp":"holding a crumpled flyer with shaking hands, looking up at him with teary eyes","setting":"quiet office at dusk","sam":true}},{"title":"Festival Night","scene":"sam_date","text":"Yui drags Sam to the harvest festival and wins him a prize at the ring toss: a deeply ugly stuffed wyvern. She insists he carry it all night.","choices":[{"label":"Wear it like a hat, proudly","m":9,"t":2,"res":"She laughs so hard she has to sit down."},{"label":"Win her one back","t":3,"m":6,"res":"It takes eleven tries. She keeps the slightly-less-ugly griffin on her desk forever."}],"image":{"comp":"at a harvest festival handing him an ugly stuffed wyvern prize, triumphant grin","setting":"harvest festival at night, game stalls, paper lanterns","sam":true}},{"title":"Second Chance","scene":"final","text":"Yui takes Sam's hand under the table during the staff meeting and doesn't let go. Afterward, in the empty office: \"Second life. Second chance. I'm not wasting this one being shy.\" She kisses him, and pulls him toward her room.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"nerys":[{"title":"Inconvenient Feelings","scene":"sam_date","text":"Nerys complains, at length, that the contract makes her feel it when Sam is sad. \"It's very inconvenient. Stop being sad.\" She sits next to him until he isn't.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"sitting very close to him on a sofa, arms crossed, sulking, wings folded, pretending not to care","setting":"dim lounge late at night","sam":true}},{"title":"Oops","scene":"shower","text":"Sam opens the washroom door to find Nerys lounging in the tub, very obviously waiting. \"Oops,\" she says, not moving at all.","choices":[{"label":"Leave politely","t":3,"m":-3,"res":"She looks almost disappointed. Almost."},{"label":"Call her bluff and sit down on the stool","l":3,"m":8,"res":"For once, SHE is the one who goes red. She recovers quickly. Mostly."},{"label":"Toss her a towel","m":2,"res":"She catches it with her tail and drapes it over his head instead."}],"image":{"comp":"lounging in a bathtub, very obviously waiting, smirking at the viewer, not moving at all","setting":"steamy wooden washroom, candles","sam":false,"towel":true}},{"title":"Research Material","scene":"casual","text":"Sam finds Nerys reading a romance novel in the lounge. She hides it in a panic, then throws a pillow at him. Later he finds it on his bed with a page dog-eared and a note: \"For research.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"hiding a romance novel behind her back in a panic, throwing a pillow, flustered","setting":"plush lounge, cushions everywhere","sam":true}},{"title":"Leash","scene":"portrait","text":"A demon noble mocks Nerys in front of the whole lounge for being \"leashed to a human.\" She laughs it off. That night, she snaps at Sam over nothing.","choices":[{"label":"Defend her, publicly, the next day","t":6,"m":6,"res":"Sam has the demon noble thrown out. Nerys pretends not to care. Her tail gives her away."},{"label":"Let her handle it","m":-4,"res":"She does, loudly. Then sulks for days."},{"label":"Offer to break the contract","t":-8,"m":-12,"res":"She goes very still. \"You want me gone?\" It takes him a long, miserable hour to fix that."}],"image":{"comp":"laughing off a sneering demon noble in a lounge, tight forced smile, tail lashing","setting":"velvet lounge full of guests, red lamplight","sam":false}},{"title":"Night Market","scene":"sam_date","text":"Nerys drags Sam to the Underdistrict night market and buys him every cursed snack she can find.","choices":[{"label":"Eat everything she hands you","m":9,"t":2,"res":"One of them makes his ears glow for an hour. She has never been happier."},{"label":"Buy her a hair ribbon","t":4,"m":6,"res":"She acts unimpressed. She wears it every day after."}],"image":{"comp":"holding out a skewer of strange glowing snacks to him at a night market, delighted grin","setting":"underground night market, glowing stalls, crowds","sam":true}},{"title":"Clause Kept","scene":"final","text":"A demon scholar offers to dissolve the contract. Nerys tears up his paperwork in front of him. \"I'll keep it,\" she tells Sam afterward, looking anywhere but at him. \"I've grown... attached.\" Then she looks at him, and stops pretending.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"elowen":[{"title":"Bedside Manner","scene":"sam_date","text":"Elowen insists on a \"check-up\" and spends most of it nervously talking about herbs. At the end she admits she's never been this far from home, and that Sam makes it feel less far.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"pressing a stethoscope-like charm to his chest, nervously babbling about herbs","setting":"small infirmary with herbs drying from the rafters","sam":true}},{"title":"Tea Service","scene":"walkin","text":"Elowen brings herbal tea to Sam's room at exactly the moment he's changing. The tray hits the floor.","choices":[{"label":"Laugh it off","t":3,"m":4,"res":"She laughs too, eventually, from behind both hands."},{"label":"Apologize profusely","t":2,"m":1,"res":"They both apologize to each other for ten minutes."},{"label":"\"You're a healer. You've seen it all, right?\"","if":{"lewd":30},"m":4,"l":3,"res":"\"Not... all,\" she says faintly.","else":{"m":-4,"l":2,"res":"She turns red to the tips of her ears and mutters something about anatomy textbooks."}}],"image":{"comp":"dropping a tea tray in a doorway, hands over her face, peeking through her fingers","setting":"small bedroom, spilled tea on the floor","sam":false}},{"title":"Flower Crowns","scene":"casual","text":"They go flower-picking outside the walls \"for medicine.\" Elowen makes him a flower crown. He makes a terrible one back. She wears it all day.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"placing a flower crown on his head in a meadow, holding the lopsided one he made her","setting":"wildflower meadow outside town walls, sunny afternoon","sam":true}},{"title":"Burnout","scene":"portrait","text":"Elowen has been healing the dock workers for free, every night, for weeks. Today she collapses in the kitchen.","choices":[{"label":"Scold her","t":-4,"m":-6,"res":"She cries. Not because he's wrong."},{"label":"Take care of her for a day","energy":"full","t":7,"m":8,"res":"Sam makes soup (badly), reads to her (badly), and doesn't leave her side. She sleeps for fourteen hours."},{"label":"Fund a free clinic night (150g)","gold":-150,"t":6,"m":10,"res":"One night a week, with help. She hugs him so hard his ribs creak.","cantAfford":{"t":2,"m":2,"res":"You can't afford it. She thanks you for trying."}}],"image":{"comp":"collapsed against kitchen cabinets, exhausted, healer's satchel spilled, the man kneeling beside her","setting":"inn kitchen at night","sam":true}},{"title":"Starlight","scene":"sam_date","text":"Elowen takes Sam to a hill outside town and names the constellations of her homeland, one by one.","choices":[{"label":"Listen to every single one","t":4,"m":7,"res":"There are a lot of them. He doesn't mind."},{"label":"Make up a constellation for her","t":3,"m":8,"res":"\"The Clumsy Healer.\" She shoves him. She uses the name forever."}],"image":{"comp":"pointing up at the night sky from a hilltop, naming constellations, the man beside her","setting":"grassy hilltop at night, sweeping starry sky","sam":true}},{"title":"Long-Lived","scene":"final","text":"Elowen kisses Sam first, very quickly, then hides her face in his shirt. \"Elves live a long time,\" she mumbles. \"I'd like to spend some of it with you.\" She doesn't let go of his hand all the way to her room.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"adelheid":[{"title":"Poison Taster","scene":"sam_date","text":"Adelheid insists on tasting all of Sam's food for poison. Every meal. She eventually admits she has started looking forward to dinner time.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"in armor tasting food from his plate with great seriousness, napkin tucked in","setting":"inn dining room at dinner time","sam":true}},{"title":"Rain Barrel","scene":"shower","text":"Sam cuts through the training yard and finds Adelheid washing off after practice at the rain barrel. She snaps to attention. With the hand holding the towel.","choices":[{"label":"Turn around immediately","t":3,"m":2,"res":"\"Thank you, my lord,\" she says, in a very small voice."},{"label":"Salute back","m":6,"t":1,"res":"She laughs: a real, startled laugh, the first he's ever heard from her."},{"label":"Stammer helplessly","m":3,"l":1,"res":"They stand there stammering at each other until a goose interrupts."}],"image":{"comp":"snapping to attention beside a rain barrel, soaking wet, covering herself with one arm and saluting with the other","setting":"training yard behind an inn, afternoon","sam":false}},{"title":"Knight and Her Lord","scene":"casual","text":"Sam finds Adelheid's secret stash of romance novels. Every one is about a knight and her lord. She threatens him with her sword. Then asks, very quietly, if he's read the third one.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"pointing a sword at him while clutching a stack of romance novels to her chest, scarlet","setting":"spartan barracks room","sam":true}},{"title":"The Report","scene":"portrait","text":"The Order demands Adelheid report on \"the sinful nature\" of Sam's business. She's been staring at a blank page for three hours.","choices":[{"label":"\"Tell them the truth.\"","t":6,"m":3,"res":"She writes three pages: fair wages, rest days, no one here against her will. She reads them twice and seals them with pride."},{"label":"\"Could you... leave some things out?\"","t":-8,"m":-10,"res":"Her face goes hard. \"I will not lie, my lord. Not even for you.\" It's a long, cold week."},{"label":"Go to the Order with her","t":8,"m":5,"res":"Sam answers their questions himself, politely, for four hours. Adelheid stands beside him the entire time."}],"image":{"comp":"sitting at a desk staring at a blank page, quill frozen, troubled expression","setting":"barracks room by candlelight","sam":false}},{"title":"Swordplay","scene":"sam_training","text":"Adelheid decides her lord must be able to defend himself, and hands Sam a practice sword.","choices":[{"label":"Practice until you drop","sam":{"strength":2},"t":3,"m":6,"res":"He drops. Twice. She is quietly, enormously proud."},{"label":"Let her win on purpose","m":-3,"res":"She knows. She hates that. \"Again, and properly this time.\""}]},{"title":"The Amended Oath","scene":"final","text":"Adelheid kneels to renew her oath, then stays kneeling. \"My oath was to serve you. I would like to amend it.\" She takes his hand. \"To stand beside you.\" She rises, and doesn't let go.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"marisol":[{"title":"Margin Notes","scene":"sam_date","text":"Marisol shows Sam her father's old ledgers and her own corrections in the margins, years of them. \"He never listened. You actually do.\" It sounds like an accusation. It isn't.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"showing him old ledgers covered in her margin notes, leaning over a desk together","setting":"owner's office, stacks of ledgers, lamplight","sam":true}},{"title":"Invoice Ambush","scene":"walkin","text":"Marisol barges into the washroom mid-argument about invoices, sees Sam in the tub, and keeps arguing.","choices":[{"label":"Argue back from the tub","m":6,"t":2,"res":"He wins, for once. She claims it doesn't count."},{"label":"Ask for some privacy","t":1,"res":"She rolls her eyes, leaves the invoice on the stool, and shuts the door. Firmly."},{"label":"Splash her","m":8,"l":2,"res":"War is declared. The washroom floods. Mira is not amused."}],"image":{"comp":"standing in a washroom doorway waving an invoice, mid-argument, not leaving","setting":"steamy wooden washroom, a man in the tub off-frame","sam":false}},{"title":"House Rules","scene":"casual","text":"Marisol beats Sam at cards four times in a row, then lets him win once, badly. \"I wanted to see your face,\" she says, and laughs until she can't breathe.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"slapping a winning hand of cards on the table, laughing at his face","setting":"staff room at night, cards and coins on the table","sam":true}},{"title":"A Letter","scene":"portrait","text":"A letter arrives from Marisol's father. He's alive, across the sea, and in debt again. She wants to sell something, anything, to bail him out.","choices":[{"label":"\"No. He left you with all of this.\"","t":-5,"m":-8,"res":"\"He's not YOUR father.\" She slams the door. She apologizes the next day; so does he."},{"label":"Send him 300g","gold":-300,"t":8,"m":6,"res":"She stares at the coins for a long time. \"You didn't have to.\" \"I know.\"","cantAfford":{"t":2,"m":-2,"res":"You can't spare it. She understands. Mostly."}},{"label":"Help her write back","t":5,"m":3,"res":"It takes all night. The letter says no, kindly. She sleeps better than she has in years."}],"image":{"comp":"reading a letter with a stricken expression, his hand on her shoulder","setting":"owner's office at dusk","sam":true}},{"title":"Her Mother","scene":"sam_date","text":"Marisol takes Sam to a small grave on the hill above town. Her mother's. She doesn't say much.","choices":[{"label":"Bring flowers","t":4,"m":6,"res":"She tells him three stories about her mother on the walk back. She has never told anyone."},{"label":"Just stand with her","t":5,"m":4,"res":"After a while she leans against his shoulder."}],"image":{"comp":"standing at a small grave on a hill with him, holding wildflowers, quiet","setting":"hilltop graveyard above a fantasy town, overcast","sam":true}},{"title":"A New Deed","scene":"final","text":"Marisol tears the old deed in half and writes a new one with both their names. \"Partners,\" she says. \"In every sense. Don't make me say it twice.\" Then she kisses him, and says nothing else for a long while.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"natsuki":[{"title":"Scars and Bets","scene":"sam_date","text":"Natsuki shows Sam the scar she got her first week here, three years ago, alone. \"I kept thinking: if Sam were here, he'd do something dumb and it'd somehow be fine.\" She laughs. \"Then you showed up and did something dumb.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"showing him a scar on her arm, sitting on a fence, half-smiling","setting":"town wall walkway at sunset","sam":true}},{"title":"Incoming","scene":"shower","text":"Sam walks into the washroom. Natsuki is in the bath. A bar of soap is already in the air at adventurer speed.","choices":[{"label":"Duck","m":4,"res":"He doesn't duck fast enough. She feels terrible. She laughs anyway."},{"label":"Take it like a man","t":2,"m":6,"res":"Direct hit. \"Nice reflexes, hero,\" she says, sinking up to her nose in the water."},{"label":"Apologize through the door","t":2,"res":"\"Knock next time, idiot!\" She sounds like she's grinning."}],"image":{"comp":"throwing a bar of soap at adventurer speed from a bath, furious and blushing","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"Almost Taiyaki","scene":"casual","text":"They find a stall selling something almost like taiyaki. Natsuki buys ten. Halfway through the fifth she goes quiet. \"Back home I always figured I'd end up with you someday. Dumb, right?\" She doesn't look at him.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"eating fish-shaped pastries at a street stall with him, cheeks full, going quiet","setting":"busy market street, food stalls, afternoon","sam":true}},{"title":"Solo Run","scene":"portrait","text":"Natsuki took a dangerous dungeon contract without telling anyone. She comes back three days later with a broken arm and a sack of gold.","choices":[{"label":"Yell at her","t":-4,"m":-8,"res":"\"You don't get to disappear on me twice!\" It comes out wrong. They don't talk for a while."},{"label":"Patch her up, quietly","health":20,"t":6,"m":6,"res":"He doesn't say anything. He doesn't have to. She leans her head against his."},{"label":"Make her promise","t":4,"m":2,"res":"\"Next time, you come with me,\" she says. \"Deal?\""}],"image":{"comp":"limping in with a broken arm in a sling and a sack of gold, defiant grin","setting":"inn entrance hall at night","sam":false}},{"title":"Fireworks","scene":"sam_date","text":"Natsuki bribes an alchemist to make fireworks \"like the summer festival back home.\" They watch from the town wall.","choices":[{"label":"Hold her hand","t":4,"m":8,"res":"Her hand is shaking. Then it isn't."},{"label":"Tell her you missed her, all three years","t":6,"m":6,"res":"She punches his arm. Then she cries. Then she laughs."}],"image":{"comp":"watching fireworks from the town wall with him, faces lit up","setting":"town wall at night, colorful fireworks over rooftops","sam":true}},{"title":"Door Kicked In","scene":"final","text":"Natsuki kicks Sam's door open at dawn, red-faced, sword still on her hip. \"I spent three years here thinking I'd never see you again. I'm not wasting another day.\" She kicks the door shut behind her.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"kanako":[{"title":"Sammy","scene":"sam_date","text":"Kanako ruffles Sam's hair and calls him \"Sammy\" in front of the whole staff. Again. Later she finds him on the back steps. \"You've grown up a lot, haven't you? When did that happen?\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"ruffling his hair in front of the staff, laughing","setting":"lively bar during staff meeting","sam":true}},{"title":"Shampoo","scene":"walkin","text":"Kanako walks in on Sam in the bath, doesn't blink, sets the shampoo on the edge of the tub, and keeps chatting about the bar schedule, like it's nothing.","choices":[{"label":"Insist she leave","t":2,"res":"\"So shy!\" she giggles, and goes."},{"label":"Act just as casual","m":5,"l":2,"res":"She falters. Just a little. Her eyes flick down, then away. Interesting."},{"label":"\"I'm a grown man, Kanako.\"","t":3,"m":-2,"res":"She stops mid-sentence. Looks at him. Leaves without a word."}],"image":{"comp":"setting a shampoo bottle on the edge of a tub, chatting casually, not blinking","setting":"steamy wooden washroom, a man in the tub off-frame","sam":false}},{"title":"Since When","scene":"casual","text":"A drunk client gets grabby with Kanako and Sam steps in without thinking. Afterward she's quiet for a long time. \"Since when do you protect me?\" She doesn't ruffle his hair. She just looks at him, like she's seeing him for the first time.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"standing behind him after he's stepped in front of a drunk client, surprised soft expression","setting":"busy bar at night","sam":true}},{"title":"Matchmaker","scene":"portrait","text":"Kanako has found Sam \"a nice girl\" and set up a dinner. She's very proud of herself.","choices":[{"label":"Go on the date to make her happy","t":-3,"m":-6,"res":"She asks how it went. Twice. She doesn't seem happy with either answer."},{"label":"\"It's always been you. You know that.\"","t":5,"m":-4,"res":"Kanako opens her mouth, closes it, and leaves. She doesn't sleep that night. Neither does he."},{"label":"Politely refuse","t":2,"res":"\"You're impossible,\" she sighs. She looks relieved."}],"image":{"comp":"proudly presenting a nervous young woman at a dinner table to him, beaming matchmaker grin","setting":"small restaurant, candles","sam":true}},{"title":"Last Call","scene":"sam_date","text":"Kanako finds a bar that's almost like a snack bar back home and takes Sam there, just the two of them. There's a lute, and a very drunk bard willing to lend it.","choices":[{"label":"Sing, badly","m":9,"t":3,"res":"She joins in. They are both terrible. It's the best night either of them has had in this world."},{"label":"Ask her to sing","t":4,"m":6,"res":"Her voice is soft. She sings the whole song looking at him."}],"image":{"comp":"singing karaoke with a lute-playing bard in a tiny bar, the man laughing beside her","setting":"tiny cozy bar like a snack bar, warm lights","sam":true}},{"title":"Not the Boy Next Door","scene":"final","text":"Kanako corners Sam in the kitchen, flustered for once in her life. \"I spent six years telling myself you were the boy next door. You're not. You haven't been for a long time.\" She kisses him, laughs at her own blush, and kisses him again.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"akari":[{"title":"The Umbrella","scene":"sam_date","text":"Akari admits she'd been a few steps behind Sam and Kenta at the crosswalk that day, with an umbrella she didn't need in her bag. \"Just walking by,\" she says, too quickly. Then, in a smaller voice: \"Kenta stopped to tie his shoe. He's fine. He's definitely fine.\" She looks at Sam as if daring him to disagree.","choices":[{"label":"\"He's fine. He's the luckiest guy I know.\"","t":5,"m":8,"res":"Something in her shoulders unlocks. She leans against his arm and doesn't make a joke for a whole minute, which is a record."},{"label":"Keep it light","t":1,"m":2,"res":"\"Yeah,\" she says, relieved and a little disappointed. \"Obviously.\""}],"image":{"comp":"sitting beside him holding a folded umbrella in her lap, a brave bright smile with worried eyes","setting":"busy market street, late afternoon","sam":true}},{"title":"What a Coincidence","scene":"shower","text":"Akari is in the bath. She is obviously waiting. \"Oh no. Sam. You've caught me. What a coincidence.\"","choices":[{"label":"Leave","t":1,"m":-4,"res":"\"Coward!\" she yells after him."},{"label":"\"You're Kenta's sister.\"","t":-2,"m":-6,"res":"\"I KNOW whose sister I am.\" A sponge hits the door as it closes. A minute later, from inside, quieter: \"...I'm tired of only being that.\""},{"label":"Laugh","m":5,"t":2,"res":"She tries to stay offended. She can't."}],"image":{"comp":"lounging in a bath, obviously waiting, fake-gasping with a hand over her mouth","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"Game Night","scene":"casual","text":"Akari organizes a staff \"game night,\" with a card game she half remembers from Kenta's apartment and invents the rest of as she goes. She wins. Loudly. Halfway through she realizes Sam has been quietly feeding her the right cards for an hour, and goes completely silent. \"You always did that,\" she says. \"I thought I was imagining it.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"Something between them shifts, just a little."},{"label":"Keep it light","t":1,"m":2,"res":"{N} smiles. Maybe next time."}],"image":{"comp":"holding a hand of cards up to her face, peeking over them at him with a stunned, delighted grin","setting":"inn lounge, staff gathered around a table, lamplight","sam":true}},{"title":"Useless","scene":"portrait","text":"A client complains about Akari. Loudly. Later Sam finds her crying in the linen closet. \"I'm useless. I'm just the person who tagged along behind you and Kenta.\" She wipes her eyes. \"I wanted to be someone you'd notice.\"","choices":[{"label":"\"You don't have to do this. You can quit.\"","t":-6,"m":-10,"res":"\"That's not what I wanted you to say.\" She doesn't come out for an hour."},{"label":"Train her yourself","grow":{"service":6},"t":6,"m":6,"res":"Every evening for a week. She gets better. She gets a lot better."},{"label":"Tell her about your own failures","t":5,"m":8,"res":"He has many. By the end she's laughing through her tears."}],"image":{"comp":"crying in a linen closet hugging a stack of towels","setting":"cramped linen closet, a sliver of light","sam":false}},{"title":"Drama Date","scene":"sam_date","text":"Akari demands a \"proper date, like in the dramas\": umbrella in the rain, a dramatic run to the station (there is no station), the works. Halfway through she drops the act. \"I've rehearsed this in my head for years,\" she admits. \"I'm terrible at the real thing.\"","choices":[{"label":"Commit to every cliché","m":10,"t":3,"res":"He even trips into her arms at the end. On purpose. She nearly dies of happiness."},{"label":"Do it your own way","t":4,"m":5,"res":"A walk, a bakery, a quiet bench. \"...Okay,\" she admits. \"This is better.\""}],"image":{"comp":"running dramatically through the rain toward him holding an umbrella","setting":"lantern-lit street in the rain","sam":true}},{"title":"Not Kenta's Sister","scene":"final","text":"Akari climbs onto the roof where Sam is hiding from paperwork. \"I've had a crush on you for years, and I'm done keeping it to myself. I'm not Kenta's sister up here. I'm a grown woman and I know what I want. It's you.\" This time, Sam doesn't climb down.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"lara":[{"title":"The Step Below","scene":"sam_date","text":"Lara finds Sam on the back steps after close and sits one step below him, knees together, hands in her lap. She tells him how she tracked the rumors of a stranger in a hoodie across three provinces, sleeping in stables and chapels. \"I couldn't stay anywhere you weren't,\" she says. \"I know that's not healthy. I know.\" She is looking at his boots, not his face.","choices":[{"label":"\"I'm really glad you found me.\"","t":5,"m":8,"res":"She lets out a long, shaky breath, like she's been holding it since Alder Street."},{"label":"\"You're allowed a life of your own, Lara.\"","t":4,"m":3,"res":"She nods slowly, as though it's a lesson she'll need to learn more than once. She doesn't leave, but she looks at the street instead of at him, thinking."}],"image":{"comp":"sitting one step below him on a back staircase at night, hands folded in her lap, looking up at him with dark kohl-lined eyes","setting":"back steps of a lantern-lit inn at night","sam":true}},{"title":"Can't Sleep","scene":"walkin","text":"Lara brings fresh towels to the washroom at midnight because she couldn't sleep, and walks in on Sam in the tub. She freezes in the doorway, arms full of linen, face hidden behind the stack. \"I'm so sorry. I'm so sorry. I'm just going to... stand here.\" She does not move.","choices":[{"label":"Laugh and ask her to leave the towels","t":2,"m":6,"res":"She puts them down with enormous care and retreats, and he hears her laughing, once, in the hall."},{"label":"\"Stay and talk, if you can't sleep.\"","t":4,"m":8,"l":2,"res":"She sits on the edge of the tub with her back turned, and tells him about the night noises of the orphanage. By the end she is leaning against the wood, nearly asleep."},{"label":"Send her to bed","t":1,"m":-2,"res":"\"Of course.\" She goes at once. In the morning she apologizes four times."}],"image":{"comp":"frozen in a washroom doorway, arms full of folded towels hiding most of her face, mortified","setting":"steamy wooden washroom at night","sam":false,"towel":true}},{"title":"A Lamp in the Window","scene":"casual","text":"When Sam is out, Lara leaves a lamp lit in the courtyard window. Tonight he's out very late. When he returns, she's under the lamp with a shawl and a book she hasn't turned a page of. \"I wasn't waiting,\" she says. \"I was keeping it warm.\"","choices":[{"label":"Sit with her","t":5,"m":8,"res":"They share the bench and the shawl. She leans on his shoulder, and for once doesn't ask whether he's tired of her."},{"label":"\"Come out with me next time.\"","t":4,"m":4,"res":"She says \"maybe,\" which is better than the \"no\" she'd have given last month."}],"image":{"comp":"sitting under a courtyard lamp in a black shawl with a book, looking up as he returns","setting":"lantern-lit courtyard at night, moths around the light","sam":true}},{"title":"Don't Go","scene":"portrait","text":"The house needs Sam in the capital for three days to settle a supplier dispute. Lara hears it in the corridor and goes white. In his room she grips the doorframe. \"Everyone who says they'll come back... I know how this goes, Sam. I know.\" She doesn't cry. That is worse.","choices":[{"label":"\"I'll never leave you.\"","t":2,"m":3,"res":"It's what she wants to hear. It isn't quite true, and both of them know it. She holds on a little too tightly, and the three days are very long."},{"label":"\"I can't promise forever. I promise I'll come back.\"","t":6,"m":4,"res":"She cries, but it's a different kind. She presses her room key into his hand. \"So you have to return it.\""},{"label":"Give her the linen schedule to run while you're gone","grow":{"service":5},"t":5,"m":6,"res":"She runs the house for three days and does it perfectly. When he returns she is proud in a way that has nothing to do with him."}],"image":{"comp":"gripping a doorframe with both hands, pale, dark eyes wide, ponytail swinging","setting":"dim inn corridor at night","sam":true}},{"title":"Midnight Garden","scene":"sam_date","text":"Lara invites Sam to the courtyard at midnight, as though she had thought hard about it and decided to ask first. In the moonlight she has planted a patch of white flowers that glow. She says it's hers, and that she'd like him to see it. \"I made something,\" she says. \"Even if you weren't here.\"","choices":[{"label":"Tell her it's beautiful and mean it","t":5,"m":8,"res":"She laughs shakily and tucks a flower behind his ear."},{"label":"Plant the next row together","t":4,"m":6,"res":"She teaches him to space the seeds. He does it wrong. She lets him, because it's his row now."}],"image":{"comp":"kneeling in a patch of glowing white night flowers, offering a small blossom up to him, shy smile","setting":"moonlit courtyard garden of pale night-blooming flowers","sam":true}},{"title":"Being Left","scene":"final","text":"On the roof, under a clear sky, Lara says it slowly. \"I used to think loving someone meant never being left. I think it's closer to... being able to be left, and still be me.\" She takes a breath. \"I want you because I choose you. Not because I'm afraid.\" She kisses him, and for the first time in her life she is the one who leads him inside, and the door closes behind them.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"emily":[{"title":"Username","scene":"sam_date","text":"Emily asks Sam to meet her on the bridge over the canal after close. She has clearly rehearsed this. \"Okay. So. This is going to sound insane,\" she says, and then she says his old forum username, out loud, in a world where nobody should know it. Her wolf ears are flat against her hair. \"Please tell me I didn't just say a random string of letters to a stranger.\"","choices":[{"label":"Say \"Shadowkin?\"","t":5,"m":8,"res":"She makes a noise he's only ever seen typed as a keysmash. Then she grabs his sleeve with both hands and doesn't let go for a while."},{"label":"\"You still owe me the end of that campaign.\"","t":4,"m":7,"res":"\"It was YOUR turn to post!\" she says, outraged, and then starts crying and laughing at the same time."}],"image":{"comp":"standing on a canal bridge at night, hands clasped, wolf ears flat, glasses, hopeful and terrified smile","setting":"stone bridge over a canal, lamplight on the water","sam":true}},{"title":"Bath Lag","scene":"shower","text":"Sam opens the washroom door and finds Emily in the tub, a notebook balanced on the rim, glasses fogged, talking to herself in what is unmistakably her old character's voice. She looks up. Her tail slaps the water. \"I was drafting dialogue,\" she says, mortified. \"Out loud. Like a normal person.\"","choices":[{"label":"Apologize and back out","t":2,"m":3,"res":"\"It's fine!\" she squeaks. That evening a note slides under his door: brb dying of embarrassment, signed with a tiny wolf doodle."},{"label":"Answer in your old character's voice","t":3,"m":7,"l":1,"res":"She stares, then answers back, in character, and they finish the whole scene through the door with Sam politely facing the hallway. She laughs so hard the water sloshes."},{"label":"Stand there, flustered","t":1,"m":3,"l":2,"res":"Her ears go straight back. \"Lag,\" she whispers. \"You're lagging. Please reconnect.\" He tries, fails, and she giggles into her hands."}],"image":{"comp":"in a tub with a notebook on the rim, fogged glasses, wolf ears perked up in surprise, tail splashing","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"Session Zero","scene":"casual","text":"Emily talks Sam into running a campaign again, on paper, in the lounge after close. She has drawn dice faces on wooden cubes and character sheets for both of them. It's the same story they abandoned on the forum years ago, picked up mid-scene. Halfway through, her character says something to his that isn't in any of the old logs.","choices":[{"label":"Answer in character","t":5,"m":8,"res":"He does. She drops a die, picks it up, drops it again, and finally hides behind her character sheet with only her ears showing."},{"label":"Ask, out of character, if she meant it","t":4,"m":6,"l":1,"res":"\"OOC?\" she says, very small. \"...Yeah. OOC, I meant it.\""}],"image":{"comp":"sitting cross-legged on a sofa with hand-drawn character sheets and wooden dice, peeking over a sheet with a shy smile, tail swishing","setting":"cozy lounge after close, fireplace glow","sam":true}},{"title":"Last Seen","scene":"portrait","text":"Emily shows Sam a page from her notebook where she copied out, from memory, the last thing she ever sent him on the forum: \"you there?\" It was never answered. \"I kept checking for three weeks,\" she says quietly. \"Then I woke up here. Sometimes I think if I fall asleep wrong I'll wake up back in my dorm and you'll still be 'last seen' forever.\"","choices":[{"label":"\"I'm here.\"","t":5,"m":6,"res":"She reads his face like a chat window, waiting for the typing indicator. Then she nods, and holds his sleeve for a long time anyway."},{"label":"Write the reply under it","t":6,"m":5,"res":"He takes her pencil and writes under her line: yeah. sorry for the lag. She presses the notebook to her chest and laughs wetly."},{"label":"\"Let's not think about it.\"","t":-3,"m":-6,"res":"\"Right. Sure.\" Her ears droop. She spends the evening rereading her notebook alone."}],"image":{"comp":"holding an open notebook toward him, ears drooped, tail low, glasses, fear in her eyes","setting":"lamp-lit lounge corner at night","sam":true}},{"title":"New Constellations","scene":"sam_date","text":"Under a full moon Emily takes Sam up onto the roof with a blanket and her notebook. None of the stars here match the ones back home, so she has been naming the constellations after their old campaign: the Cursed Lute, the Bard Who Never Posted, the Wolf and the Idiot. She lets her ears and tail relax. \"I figured,\" she says, \"if we're stuck here, we should at least have our own sky.\"","choices":[{"label":"Name one together","t":4,"m":8,"res":"They argue happily for an hour over a single cluster of stars and settle on The Streak. She writes it down in her best forum-header lettering."},{"label":"Ask which one is her","t":3,"m":6,"l":1,"res":"She points to two stars close together and doesn't explain. She doesn't have to."}],"image":{"comp":"lying on a blanket on a rooftop in moonlight pointing at the stars, notebook open, wolf ears relaxed, glancing at him with soft eyes","setting":"slate rooftop under a full moon, a lantern beside her","sam":true}},{"title":"More Than a Username","scene":"final","text":"Emily stops in the doorway of Sam's room, notebook hugged to her chest. \"For six years you were a username,\" she says. \"My favorite one. I never wanted more than that, and then I got a whole person, and it turns out I do.\" She is trembling, ears flat, tail wrapped around her own ankle. \"I'm bad at saying things out loud. So, short version.\" She takes his hand. \"Stay online.\" The door closes behind them.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Just don't go idle on me.\""}]}],"lirael":[{"title":"Whoever Finds This","scene":"sam_date","text":"Lirael meets Sam at the old postbox in the alley after close. She takes a yellowed letter from her satchel: the very first one, addressed to \"Whoever finds this.\" She reads it aloud, in a voice that trembles at the end. \"I never thought anyone would write back.\" Her long ears are drooping. \"And then you did.\"","choices":[{"label":"\"Thank you for writing first.\"","t":5,"m":8,"res":"Her satchel strap slips from her fingers and clinks against the cobbles, loud in the quiet. She covers her face."},{"label":"Take the letter and read your own reply","t":4,"m":6,"res":"He reads it aloud, and she mouths the words along with him; she's known them by heart for years."}],"image":{"comp":"holding a yellowed letter against her chest beside an old iron postbox, long ears drooping, shy and tearful smile","setting":"lamp-lit alley beside an old iron postbox at night","sam":true}},{"title":"Ink Stains","scene":"shower","text":"Sam opens the washroom door and finds Lirael in the tub, a stack of waterproofed letters balanced on the rim, reading with a soft smile. She looks up. Her hand slaps the water. \"I read them here,\" she says, mortified. \"It's the only quiet room in the building.\"","choices":[{"label":"Apologize and back out","t":2,"m":3,"res":"\"It's fine!\" she squeaks. She sends a note under his door that evening, three lines, signed with a tiny drawn quill."},{"label":"\"Which one are you on?\"","t":3,"m":7,"l":1,"res":"She holds up the letter. He reads it from the doorway, politely looking at the ceiling. She laughs so hard the water sloshes."},{"label":"Stand there, flustered","t":1,"m":3,"l":2,"res":"The tips of her ears go pink. \"Please say something,\" she whispers. He tries, and fails, and she giggles into her hands."}],"image":{"comp":"reading a letter in a tub with a stack of letters on the rim, long ears perked up in surprise, hand splashing the water","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"Notes Across the Sofa","scene":"casual","text":"They fall into an easy habit: sitting at opposite ends of the lounge sofa, writing each other notes instead of talking, passing them across with their feet. It is a ridiculous, wonderful way to flirt. Lirael's replies grow longer every night. Tonight's has a P.S. in very small letters.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"He reads the P.S. aloud. She buries her face in a cushion, ears trembling, and writes back immediately."},{"label":"Write one back about how you feel","t":4,"m":6,"res":"She reads it three times, folds it, and tucks it into her satchel, next to the others."}],"image":{"comp":"curled at one end of a sofa writing a note on her knee, one foot swinging, peeking over the paper with a shy smile","setting":"cozy inn lounge, fireplace glow","sam":true}},{"title":"Wrong Address","scene":"portrait","text":"A letter arrives for Sam with no stamp, no postmark, and an address in a handwriting he hasn't used in years: his own, from long ago. It reads: \"To whoever I become. I hope you're not lonely anymore.\" Lirael reads over his shoulder and goes still. \"If a letter can cross,\" she says quietly, \"so can a person. What if the box takes you back?\"","choices":[{"label":"\"I'm not going anywhere.\"","t":5,"m":6,"res":"She nods, and holds his sleeve for a long time anyway."},{"label":"Write a reply together","t":6,"m":5,"res":"They write two words and post them: Not lonely. The box hums. She is still smiling when it falls silent."},{"label":"Burn the letter","t":-3,"m":-6,"res":"\"You can't burn what's already happened,\" she says. She spends the night sweeping the postbox in silence."}],"image":{"comp":"reading a letter over his shoulder, ears drooped, fear in her eyes","setting":"lamp-lit lounge corner at night","sam":true}},{"title":"Full Moon Post","scene":"sam_date","text":"Under a full moon Lirael takes Sam up onto the post house roof to sort the night's collection by lantern light. She lets her shoulders and ears relax. Between letters, she hums the tune she once wrote in the margin of her second note, and he realizes he's been humming it for years.","choices":[{"label":"Hum along","t":4,"m":8,"res":"She stops sorting, and just listens, and then joins the harmony."},{"label":"Help her sort the last bag","t":3,"m":5,"res":"He puts every letter in the wrong slot. She re-sorts every one, grinning, and says it's the best mistake she's ever seen."}],"image":{"comp":"sitting on a post house roof in moonlight sorting letters, long ears relaxed, humming, glancing at him with soft eyes","setting":"slate rooftop under a full moon, a lantern beside her","sam":true}},{"title":"Meeting the Man","scene":"final","text":"Lirael puts down her satchel in the doorway of Sam's room. \"For ten years I wrote to a name,\" she says. \"I'd like to meet the man.\" She is trembling, ears dipping, one foot wrapped around her own ankle. \"I'm not good at saying things out loud. So I'll say the short version.\" She takes his hand. \"Stay.\" The door closes behind them.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"ella":[{"title":"Dinner Is a Competition","scene":"sam_date","text":"Ella challenges Sam to dinner as a competition: whoever orders the better meal wins. Over the second course she puts down her fork. \"I was across the street. I saw the truck. For three years I've told myself I'd never speak of it.\" Her hand is steady on the glass, but her knuckles are white. \"I'm speaking of it now. Because you're here. Because I can.\"","choices":[{"label":"Reach across the table","t":5,"m":8,"res":"She lets him hold her hand and does not comment. Then, quietly: \"That counts as a point to you.\""},{"label":"Order dessert and change the subject gently","t":2,"m":3,"res":"She follows the pivot like a professional. \"The tart. Obviously.\""}],"image":{"comp":"sitting across a candlelit dinner table from him, fork set down, serious and vulnerable, hand on her wine glass","setting":"private corner table in a lantern-lit restaurant","sam":true}},{"title":"Scoring Points","scene":"shower","text":"Sam opens the washroom door and finds Ella in the tub, hair pinned, a book propped on the soap dish, glasses-fogged glare aimed at the intruder. \"You didn't knock,\" she says. \"That's a point to me.\" She doesn't cover up, since the moral high ground is more valuable than modesty.","choices":[{"label":"Concede the point and leave","t":2,"m":3,"res":"\"Good.\" She tallies it in the margin of the book. Later she leaves a cup of tea outside his door, which she scores as a draw."},{"label":"\"Then I'll earn it back.\"","if":{"lewd":35},"t":3,"m":8,"l":3,"res":"\"Oh?\" The corner of her mouth moves. \"Name your terms.\" They negotiate for far longer than the situation warrants.","else":{"t":-1,"m":-3,"res":"\"Out,\" she says, with great dignity. \"The point stands.\""}},{"label":"Compliment her and mean it","t":3,"m":6,"l":1,"res":"She goes very still, and a delicate pink climbs up her throat. \"That... wasn't in my scoring system.\""}],"image":{"comp":"in a bath, hair pinned up, a book propped beside her, fixing the doorway with a cool unimpressed glare","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"The Leaderboard","scene":"casual","text":"Ella turns the staff's daily chores into a points tournament with a leaderboard, prizes and an appeals process. Morale in the house triples. She has also, without telling anyone, assigned Sam a score of her own: a secret column in her notebook headed Observations. She is only caught when it falls out of her apron.","choices":[{"label":"Stay with her","t":5,"m":8,"res":"He reads it aloud, politely. The column contains seventeen entries. She says nothing at all and doesn't leave."},{"label":"Hand it back unread","t":3,"m":5,"res":"She takes it with great dignity. \"You are,\" she says, \"unbelievably annoying.\" It sounds, for once, like a compliment."}],"image":{"comp":"holding a leaderboard chalkboard, caught as a small notebook falls out of her apron, mortified and composed at once","setting":"busy inn kitchen with staff cheering in the background","sam":true}},{"title":"The Offer","scene":"portrait","text":"A merchant house in the capital offers Ella a post as chief of accounts: a salary, a title, a corner office with her name on the door. It's everything she has ever wanted on paper. She lays the letter in front of Sam without a word and watches his face with the intensity of someone grading an exam.","choices":[{"label":"\"Take it. You'd be the best they've ever had.\"","t":4,"m":-2,"res":"She nods once. \"I hate how much I wanted you to say that,\" she mutters. She doesn't answer the merchants for a week."},{"label":"\"Stay. Beat me here.\"","t":6,"m":6,"res":"\"That's cheating,\" she says. She turns the letter down the next morning, in writing, with a flourish."},{"label":"Say nothing","t":-5,"m":-8,"res":"She folds the letter, tucks it away, and gives him a mark he can't read. The house is colder for days."}],"image":{"comp":"sitting at a desk with a sealed offer letter in front of her, watching him with a level searching gaze","setting":"ledger room, lamplight, neat stacks of paper","sam":true}},{"title":"Rematch","scene":"sam_date","text":"Ella sets up a chessboard in the courtyard at dusk, with rules, a clock and a hand-lettered scoreboard that reads SAM vs. ELLA — GAME 1 OF 1. They play for two hours without speaking. At the end, she has him cornered. She looks at the board. She looks at him. She doesn't make the winning move.","choices":[{"label":"Offer a draw","t":5,"m":8,"res":"\"Accepted,\" she says, much too quickly. \"As a purely tactical choice.\""},{"label":"Tell her to take the win","t":4,"m":5,"res":"She takes it. She cheers, genuinely, and then buys him dinner out of sheer guilt."}],"image":{"comp":"leaning over a chessboard, one hand hovering above a piece, looking up at him instead of the game","setting":"lantern-lit courtyard table at dusk, chessboard between them","sam":true}},{"title":"First Place","scene":"final","text":"Ella stops him on the stairs. \"I have been second to you for years, and I have never minded. Don't tell anyone.\" She takes the pencil out of her hair, lets it fall down around her shoulders, and meets his eyes. \"I'm not competing anymore. I'd like to be on your side of the board.\" She kisses him, decisively, as if it were the winning move.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"ione":[{"title":"Three Questions","scene":"sam_date","text":"Ione brings Sam tea on the back steps, exactly how he takes it. \"I will answer any question you ask,\" she says, \"except three. I won't tell you where I came from, how I came, or how the story ends.\" She sits with perfect posture and a faint hum. \"The rest is yours.\" Sam asks her what she likes. She is quiet for so long he thinks she's frozen. \"Nobody has asked me that before,\" she says.","choices":[{"label":"\"Then tell me what you like.\"","t":5,"m":8,"res":"She lists seven things, slowly: rain, the smell of tea, the hum of a crowded room, and, last, quietly, \"you.\" Her status light glows gold."},{"label":"Let her keep her secrets","t":3,"m":4,"res":"She tilts her head. \"That is the kindest answer I could have received.\" Her shoulders lower by one precise degree."}],"image":{"comp":"sitting upright on a back step holding a teacup, silver-white hair and a softly glowing temple light, looking at him with calm curiosity","setting":"back steps of a lantern-lit inn at dusk","sam":true}},{"title":"Warm Water","scene":"walkin","text":"Ione has discovered the bath. Sam walks in to find her seated in the water, perfectly still, eyes closed, status light glowing a fascinated gold. \"I have read about this for years,\" she says, not opening her eyes. \"No document prepared me for the temperature.\" She makes no attempt to cover up, since it hasn't occurred to her to.","choices":[{"label":"Sit on the edge and tell her about baths","t":4,"m":8,"l":1,"res":"She listens as though to scripture. By the end she's asked him to explain the concept of a bubble."},{"label":"Back out politely","t":2,"m":3,"res":"\"Understood,\" she calls after him. \"I will file this under 'privacy.' Please return soon with more information.\""},{"label":"Hand her a towel and the soap","t":3,"m":5,"res":"She examines the soap like a precious artifact. She smells it for a very long time."}],"image":{"comp":"seated in a bath with her eyes closed and a calm wondering expression, silver-white hair damp, a faint gold glow at her temple","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"Joke Protocol","scene":"casual","text":"Ione has been practicing jokes. They're from a list in her memory, delivered with flawless timing and no comprehension at all. Tonight she tells one about a priest and a goblin and a barrel, and the punchline lands with a perfect, silent thud. She watches Sam's face. \"I think,\" she says, \"that was funnier in the archive.\"","choices":[{"label":"Laugh anyway","t":5,"m":8,"res":"She tries to work out why this is funnier than the joke. After a minute, she decides it doesn't matter."},{"label":"Teach her a real one","t":4,"m":6,"res":"He tells her the worst joke he knows. She stares. Then her mouth twitches, and she gets it, an entire second late, and it's glorious."}],"image":{"comp":"standing behind the bar with a polished glass, delivering a joke with a perfectly straight face, a tiny curious smile","setting":"inn bar at evening, bottles gleaming","sam":true}},{"title":"Another Evening","scene":"portrait","text":"Mid-sentence, Ione goes still. Her status light flickers white. Then, in a flat voice: \"I was not supposed to remember that. There was another evening like this one. You wore the blue hoodie. It rained.\" Her gaze snaps back to him, frightened. \"That hasn't happened yet. It has happened. I don't know which.\"","choices":[{"label":"\"Whatever it is, you can tell me.\"","t":5,"m":5,"res":"She tells him in pieces: fragments of evenings that might be hers, might be his. By the end she is holding his hand tightly, and he is not afraid."},{"label":"\"Don't tell me. Let's just live this one.\"","t":6,"m":6,"res":"She breathes in, the way no machine needs to. \"Yes. Yes. That's... correct.\" She sleeps beside him, for the first time, in the lounge chair."},{"label":"Change the subject, uneasily","t":-3,"m":-6,"res":"She files the memory away and says nothing. But her light stays pale all night."}],"image":{"comp":"frozen mid-gesture, her temple light flickering white, wide-eyed and unsettled, one hand lifted toward him","setting":"inn lounge at night, rain on the window","sam":true}},{"title":"Satellites","scene":"sam_date","text":"On the town wall at midnight Ione points at a clear patch of sky. \"That one hasn't been launched yet,\" she says. \"Neither has that one. They will have names. Some of them will be yours.\" She lowers her hand. \"I'm not allowed to explain. I wanted to show you anyway. Is that permitted?\" He says yes, and she leans, very carefully, against his shoulder.","choices":[{"label":"Make a wish on one","t":4,"m":8,"res":"\"On a satellite? Statistically unsound.\" She wishes anyway. Her light glows gold."},{"label":"Ask her what the future is like","t":3,"m":4,"res":"\"Bright,\" she says, after a long moment. \"With a lot of lanterns. Yours is still burning.\""}],"image":{"comp":"pointing up at the stars from a stone wall, leaning against his shoulder, a gold glow at her temple","setting":"stone town wall under a vast starry sky","sam":true}},{"title":"The Last Page","scene":"final","text":"Ione hands Sam the diary, closed, with a ribbon marking the last page. \"I came to read the ending,\" she says. \"I opened it on the road. The last page was blank.\" Her light is steady gold. \"I have decided that means the ending isn't written. I would like to help write it.\" She takes his hand. \"With you.\" It isn't in any archive. The door closes behind them.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}],"anael":[{"title":"Lamplighter","scene":"sam_date","text":"At dusk Anael walks the street with Sam, lighting lanterns with a touch of her fingers. She tells him, plainly, that the old Lantern Stone burned for the first time in four centuries on the night he arrived, and that the Order sent her to find out why. \"I have concluded,\" she says, \"that it was you.\" Sam says that's absurd. \"I know,\" says Anael, with a small, helpless smile. \"I have run out of other explanations.\"","choices":[{"label":"\"I'm glad it was me.\"","t":5,"m":8,"res":"Her wings relax a full inch. \"So am I,\" she says. \"I find I am not objective about it.\""},{"label":"Ask what happens when she finds out","t":3,"m":3,"res":"\"I report,\" she says. A pause. \"Or I do not. That part of the protocol has become unclear.\""}],"image":{"comp":"walking along a street at dusk lighting lanterns with a touch of her fingertip, wings folded behind her, turning to him with a small smile","setting":"lantern-lit cobbled street at dusk","sam":true}},{"title":"Not the Wings","scene":"shower","text":"Sam opens the washroom door to find Anael perched on the edge of the tub, wings dripping, wrapped in a towel and a deep, full-body blush. \"The Order does not prepare one,\" she says with enormous dignity, \"for the maintenance of plumage.\" She draws one wing in front of her like a shield. \"Do not touch the wings. It is... impolite.\"","choices":[{"label":"Apologize and back out","t":2,"m":3,"res":"\"Thank you,\" she says. \"For the courtesy. It is noted.\" The note is, as it turns out, a very warm one."},{"label":"\"Can I help dry them?\"","if":{"trust":40},"t":4,"m":7,"l":1,"res":"She holds very still while he blots the feathers with a towel. At the end her halo is brighter than the lamps.","else":{"t":-2,"m":-4,"res":"\"No,\" she says, rigid. \"Please leave.\" The wings snap shut with a thump."}},{"label":"Offer her the soap","t":2,"m":5,"res":"She examines it, perplexed. \"I have never required it,\" she admits. She keeps it anyway."}],"image":{"comp":"perched on the edge of a tub in a towel with dripping white wings drawn in front of her like a shield, blushing hard","setting":"steamy wooden washroom","sam":false,"towel":true}},{"title":"Field Research: Pie","scene":"casual","text":"Anael has decided to try human food in the name of research. She approaches a slice of berry pie as if it might be a trap. After the first bite she goes completely still. After the second, her halo flickers. After the third, she looks Sam directly in the eye. \"This changes my understanding of mortality,\" she says gravely. \"Please do not tell the Order I enjoyed it so much.\"","choices":[{"label":"Stay with her","t":5,"m":8,"res":"He shares the pie. She feeds him a bite, solemnly, as though it were a sacrament, and something warm settles over them both."},{"label":"Order a second slice","t":3,"m":6,"res":"She accepts with great composure. She finishes it with less."}],"image":{"comp":"seated at a table with a slice of berry pie, eyes wide with solemn wonder, a soft glow flickering behind her head","setting":"cozy inn lounge, afternoon light","sam":true}},{"title":"Recall","scene":"portrait","text":"A second angel, tall and stern, appears in the courtyard with a sealed scroll. The Order has completed its review. Anael is recalled to the Quiet Lamp at the next new moon. She takes the scroll with perfect composure and tucks it into her sleeve. That night she stands at Sam's door and does not knock.","choices":[{"label":"\"Go, if it's your duty.\"","t":3,"m":-3,"res":"\"Duty,\" she repeats, and for the first time she sounds uncertain of the word. She does not leave, but she does not answer the scroll."},{"label":"\"Stay. Please.\"","t":6,"m":6,"res":"She reads her reply to the Order aloud. It is one line long. The messenger, a little scandalized, flies off before she can finish blushing."},{"label":"Say nothing","t":-5,"m":-8,"res":"She waits, and then folds the scroll and bows. Her halo is dim for days."}],"image":{"comp":"standing outside his door at night holding a sealed scroll, wings drooping, uncertain, halo dim","setting":"dim inn corridor at night, moonlight through a window","sam":true}},{"title":"Evensong","scene":"sam_date","text":"In the chapel nook of the house, Anael sings the evensong of her order, a slow, ancient melody of lanterns and homecoming. The lights in the room rise and fall with her voice. Sam, who cannot sing, hums the bass line anyway, and the lanterns glow brighter in answer. She stops mid-verse, stares at him, and starts to laugh, helpless and bright.","choices":[{"label":"Keep humming","t":5,"m":8,"res":"They finish the evensong together, one voice shining and one decidedly flat. It is the best she has ever heard it."},{"label":"Listen in silence","t":4,"m":5,"res":"She sings the whole of it for him alone, and the room is warm for hours afterward."}],"image":{"comp":"standing in front of a small candlelit altar singing with wings half-spread, her halo glowing, glancing back at him with a delighted smile","setting":"small candlelit chapel nook of an inn at night","sam":true}},{"title":"Report Withheld","scene":"final","text":"Anael finds Sam on the roof under the stars. She opens her wings and then folds them around both of them. \"I have been asked to report on whether this soul is a danger to the world,\" she says. \"I find that he is a danger only to my composure.\" She meets his eyes, golden and brave. \"I would like to stay. Not as a Warden. As yourself.\" The door closes behind them.","choices":[{"label":"Say yes","t":6,"m":12,"res":""},{"label":"Not yet","t":1,"m":-3,"hold":true,"res":"{N} nods. \"I can wait. Don't make it too long.\""}]}]},"regulars":{"_readme":["Regular clients: named men who keep coming back to a house, usually for one favorite lady.","A good visit can turn a client into a regular (up to max per house). Each regular visits most weeks, asks for his favorite, and pays with his quirk's tip multiplier. Bad visits wear his loyalty down until he stops coming.","quirks: label and desc show in the Houses tab. tip multiplies what he pays. drama = chance per week of his quirk's event (text in events below).","events: {name} = the lady, {regular} = his name, {house} = the house, {gold} = money involved. Choice logic is in js/events/regulars.js; the words are all here."],"maxPerHouse":4,"visitChance":0.6,"names":{"first":["Bertram","Osric","Tobias","Edmund","Hollis","Garrick","Lucan","Ambrose","Fenwick","Rowan","Silas","Corwin","Dorian","Alaric","Percival","Wendel","Matthias","Leopold","Cassian","Tamsin"],"last":["Hale","Marsh","Crane","Ashby","Pell","Wren","Fairweather","Thorne","Vane","Holloway","Bramble","Quill","Stroud","Kettering","Lark"]},"quirks":{"generous":{"label":"Generous","desc":"Tips well and brings gifts.","tip":1.35,"drama":0.12},"jealous":{"label":"Jealous","desc":"Hates sharing his favorite.","tip":1.15,"drama":0.18},"lingering":{"label":"Lingers","desc":"Never wants the night to end.","tip":1,"drama":0.15},"smitten":{"label":"Smitten","desc":"Has fallen for his favorite. Might try to take her away.","tip":1.2,"drama":0.08},"talker":{"label":"Talker","desc":"Mostly comes for conversation, and tells everyone about the house.","tip":1,"drama":0.1},"shy":{"label":"Shy","desc":"Took him weeks to say hello. Very loyal once he does.","tip":1.1,"drama":0}},"events":{"new":["{regular} keeps asking for {name}. Looks like he's a regular now."],"generous":{"title":"A Gift for {name}","text":["{regular} arrived with a velvet box for {name}: a bracelet worth at least {gold}. She's turning it over in her hands, delighted and a little unsure."],"keep":"She keeps it. She hasn't stopped smiling.","split":"She hands it to Sam to sell for the house, a little wistfully. +{gold}."},"jealous":{"title":"{regular} Wants {name} to Himself","text":["{regular} saw {name} going upstairs with someone else, and he's at the front desk, red in the face. He wants her to see no one else on his nights, and he'll pay for it."],"pay":"He pays {gold} for his nights to be hers alone. {name} rolls her eyes but takes the money.","refuse":"Sam tells him {name} isn't anyone's property. {regular} storms out. He may not come back.","calm":"{name} talks him down herself, sweetly. He leaves soothed, and she leaves tired."},"lingering":{"title":"{regular} Won't Leave","text":["It's past dawn and {regular} is still in {name}'s room, talking about his mother."],"charge":"Sam bills him for the whole night. He pays {gold} without blinking. {name} is exhausted.","escort":"Security walks him out, politely. He's embarrassed, and a little hurt.","letit":"Sam lets it go. {name} gets no sleep, but {regular} tips extra out of guilt."},"smitten":{"title":"{regular} Proposes","text":["{regular} has offered to buy out {name}'s contract and marry her. He's put {gold} on the table and is waiting for an answer."],"stays":"{name} looks at the money, then at Sam, and gently tells {regular} no. She's staying.","goes":"{name} hesitates a long time, then says yes. She leaves with {regular}, and the house keeps the {gold}.","refuse":"Sam refuses the offer outright. {regular} leaves, heartbroken. {name} looks relieved, and a little annoyed nobody asked her."},"talker":{"title":"{regular} Spreads the Word","text":["{regular} has been telling everyone in town about {house}, and about {name} in particular. A few new faces have turned up asking for her."],"thanks":"Sam stands him a drink. Reputation +2."}}},"bonds":{"_readme":["Bonds between the ladies: a value from -100 (bitter rivals) to 100 (inseparable), plus an optional kind for special relationships.","Named ladies start with the bonds listed under 'bonds' in characters.json. Everyone else starts at 0 and drifts while they share a house ecords only allow for once. I have been instructed to file a correction.\" She looks at the flame, then at him. \"I have not decided what the correction should say.\"","stay":{"label":"Stay with her a while","res":"They watch the flame until the bells ring midnight. When Anael finally writes her report, it is three pages long and none of it is about the lamp."},"ask":{"label":"Ask what the Order thinks it means","res":"\"That souls who arrive unsent sometimes refuse to leave,\" Anael says. \"And that the world bends a little to keep them.\" A pause. \"The Order considers this a problem. I find I don't.\""},"image":{"comp":"standing beside a glowing stone lantern at night, soft halo light, thoughtful expression, looking at him","setting":"quiet crossroads at midnight, ancient stone lantern burning","sam":true}},"circle":{"title":"The Returners' Circle","text":"A folded card arrives with no seal, only a hand-drawn lantern and an address above a teahouse. Inside: a dozen people who all, in one way or another, should not remember what they remember. A former schoolteacher. A sellsword who apologises to everyone. A woman who still checks her pockets for a phone. Someone hands Sam tea. \"Welcome back,\" they say, and it's clear they've said it many times before.","join":{"label":"Become a regular","res":"The Circle meets on the last night of each month. People talk. Some of them are looking for work, and now they know where to find it. (+renown. Someone from Sam's old world is already waiting among your candidates.)"},"visit":{"label":"Just stay for the tea","res":"It's good tea. Sam leaves with a full stomach and a strange, light feeling, like being remembered by strangers."}}}},"snippets":{"_readme":["Your own text, appended to the image prompt for that scene. Empty = default prompt only.","scenes: pov (every Sam/POV scene), bath, mishap (shower / walk-in), solo (a lady alone at max lust), duo (every shared scene with two ladies). Per-service wording now lives in servic
